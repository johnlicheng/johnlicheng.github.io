<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="九年级历史知识PK对战 - 同屏双人对战，巩固统编版世界历史（九年级上册）知识" />
  <title>历史PK对战 · 九年级世界历史上册</title>
  <style>
:root {
  --primary: #ff6b4a;
  --primary-dark: #e8552f;
  --green: #2e9e5b;
  --green-light: #dff4e7;
  --red: #e04b4b;
  --red-light: #fdeaea;
  --blue: #3a7bd5;
  --blue-light: #e7f0fc;
  --ink: #2b2b31;
  --muted: #7a7a85;
  --line: #ececf0;
  --bg: #f5f3ef;
  --card: #ffffff;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.app { min-height: 100vh; }

/* 通用视图 */
.view { padding: 24px; max-width: 1000px; margin: 0 auto; }
.hidden { display: none !important; }

.card {
  background: var(--card);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 28px;
}

/* ============ 设置页 ============ */
.logo { text-align: center; margin-bottom: 22px; }
.logo-icon {
  width: 64px; height: 64px; margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; border-radius: 18px;
  background: linear-gradient(135deg, #ffd86b, #ff8a3d);
  box-shadow: 0 6px 16px rgba(255, 138, 61, 0.4);
}
.logo h1 { font-size: 26px; letter-spacing: 1px; }
.subtitle { color: var(--muted); font-size: 14px; margin-top: 6px; }

.players-row { display: flex; gap: 14px; align-items: flex-end; margin: 20px 0; }
.player-input { flex: 1; }
.player-input label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.player-input input {
  width: 100%; padding: 12px 14px; font-size: 16px;
  border: 2px solid var(--line); border-radius: 12px; outline: none;
  transition: border-color .15s;
}
.pA input:focus { border-color: var(--primary); }
.pB input:focus { border-color: var(--blue); }
.vs-badge {
  flex: none; width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--blue));
  border-radius: 50%; transform: translateY(-4px);
}

.field { margin: 18px 0; }
.field-label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.seg { display: flex; gap: 10px; flex-wrap: wrap; }
.seg-chip {
  padding: 9px 18px; border-radius: 10px; cursor: pointer;
  background: var(--bg); border: 2px solid var(--line);
  font-weight: 700; font-size: 15px; user-select: none; transition: all .15s;
}
.seg-chip:hover { border-color: var(--primary); }
.seg-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.unit-chip {
  border: 2px solid var(--line); background: #fff; border-radius: 12px;
  padding: 11px 12px; cursor: pointer; user-select: none; transition: all .15s;
  font-size: 13.5px; line-height: 1.35;
}
.unit-chip .u-name { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.unit-chip .u-check { color: transparent; }
.unit-chip .u-count { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.unit-chip.active { border-color: var(--green); background: var(--green-light); }
.unit-chip.active .u-check { color: var(--green); }
.hint { font-size: 13px; color: var(--muted); margin-top: 10px; }

.link-btn {
  background: none; border: none; color: var(--blue); cursor: pointer;
  font-size: 13px; padding: 0; margin: 2px 0 10px;
}
.btn-primary {
  display: block; width: 100%; padding: 14px; border: none; border-radius: 14px;
  background: var(--primary); color: #fff; font-size: 18px; font-weight: 800;
  cursor: pointer; transition: transform .1s, opacity .15s; letter-spacing: 2px;
}
.btn-primary:hover { opacity: .92; }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { background: #d8d8de; cursor: not-allowed; }
.btn-primary.big { padding: 15px; font-size: 19px; box-shadow: 0 6px 16px rgba(255, 107, 74, .4); }

.btn-secondary {
  padding: 14px; border: 2px solid var(--line); border-radius: 14px;
  background: #fff; color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer;
}

.tip { font-size: 13px; color: var(--muted); text-align: center; margin: 14px 0 4px; line-height: 1.6; }

.bank-panel { margin-top: 8px; padding: 16px; background: var(--bg); border-radius: 12px; font-size: 13.5px; color: var(--muted); line-height: 1.7; }
.bank-list { margin-top: 10px; max-height: 260px; overflow: auto; }
.bank-item { padding: 8px 4px; border-bottom: 1px dashed var(--line); color: var(--ink); }
.bank-item .u { color: var(--muted); font-size: 12px; }

/* ============ 对战页 ============ */
#view-battle { max-width: 1200px; padding: 14px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

.battle-bar {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border-radius: 14px; padding: 12px 16px;
  box-shadow: var(--shadow); margin-bottom: 12px;
}
.abort-btn { background: none; border: 1px solid var(--line); color: var(--muted); padding: 7px 12px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.abort-btn:hover { color: var(--red); border-color: var(--red); }
.battle-hint { flex: 1; text-align: center; font-size: 14px; font-weight: 700; color: var(--ink); }

.battle-panels { display: flex; flex: 1; gap: 12px; min-height: 0; }

.player-panel {
  flex: 1; background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  border-top: 5px solid var(--primary);
}
.player-panel.pb { border-top-color: var(--blue); }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: #faf8f5;
}
.player-panel.pb .panel-head { background: #f6f9fd; }
.player-name { font-size: 18px; font-weight: 800; }
.pa .player-name { color: var(--primary-dark); }
.pb .player-name { color: var(--blue); }
.panel-stats { display: flex; gap: 10px; }
.stat { font-size: 13px; background: #fff; border-radius: 20px; padding: 4px 12px; border: 1px solid var(--line); }
.stat.score { color: var(--primary-dark); font-weight: 700; }
.pb .stat.score { color: var(--blue); }
.stat .num { font-size: 16px; font-weight: 800; }

.panel-progress { background: var(--bg); }
.panel-bar-track { height: 6px; background: var(--line); }
.panel-bar { height: 100%; width: 0%; background: var(--primary); transition: width .4s; }
.pb .panel-bar { background: var(--blue); }
.panel-progress-label { text-align: center; padding: 4px 10px 6px; }
.panel-progress-label .q-progress { font-weight: 800; font-size: 13px; color: var(--muted); }
.pa .panel-progress-label .q-progress { color: var(--primary-dark); }
.pb .panel-progress-label .q-progress { color: var(--blue); }

.panel-footer {
  padding: 12px 14px; border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.panel-footer .next-btn { width: 100%; }
.done-label { text-align: center; color: var(--green); font-weight: 800; font-size: 14px; }

.panel-body { flex: 1; display: flex; flex-direction: column; padding: 14px; overflow: auto; min-height: 0; }
.q-text { font-size: 17px; font-weight: 700; line-height: 1.55; margin-bottom: 14px; }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px;
  background: #fff; cursor: pointer; transition: all .15s; text-align: left; font-size: 14.5px; line-height: 1.45;
}
.opt:hover:not(.locked) { border-color: var(--primary); }
.opt .key {
  flex: none; width: 26px; height: 26px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); font-weight: 800; font-size: 14px;
}
.opt.selected { border-color: var(--primary); background: #fff3ee; }
.pb .opt.selected { border-color: var(--blue); background: #eef4ff; }
.opt.selected .key { background: var(--primary); color: #fff; }
.pb .opt.selected .key { background: var(--blue); color: #fff; }
.opt.correct { border-color: var(--green); background: var(--green-light); }
.opt.correct .key { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-light); }
.opt.wrong .key { background: var(--red); color: #fff; }
.opt.locked, .opt.done { cursor: default; pointer-events: none; }

.answer-box { margin-top: 12px; font-size: 13.5px; line-height: 1.7; padding: 10px; border-radius: 10px; display: none; }
.answer-box.show { display: block; }
.answer-box .res-line { font-weight: 800; margin-bottom: 6px; }
.answer-box .ok { color: var(--green); }
.answer-box .no { color: var(--red); }
.answer-box .src { color: var(--primary-dark); font-weight: 700; }
.answer-box .expl { color: var(--muted); }

.center-divider {
  flex: none; width: 84px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
}
.cd-score { display: flex; flex-direction: column; align-items: center; background: #fff; padding: 8px 6px; border-radius: 12px; box-shadow: var(--shadow); }
.cd-name { font-weight: 800; color: var(--primary-dark); }
.cd-name.b { color: var(--blue); }
.cd-vs { font-size: 13px; color: var(--muted); font-weight: 700; }

/* ============ 结算页 ============ */
.result-card { padding: 24px; }
.result-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 18px; }
.result-title .winner { color: var(--primary); }
.result-title .draw { color: var(--blue); }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 6px; }
.sum-card { padding: 14px; border-radius: 14px; background: var(--bg); text-align: center; }
.sum-card.pa { border-top: 4px solid var(--primary); }
.sum-card.pb { border-top: 4px solid var(--blue); }
.sum-card .sum-name { font-weight: 800; margin-bottom: 8px; }
.sum-card .big-num { font-size: 30px; font-weight: 800; }
.sum-card.pa .big-num { color: var(--primary-dark); }
.sum-card.pb .big-num { color: var(--blue); }
.sum-card .sum-label { color: var(--muted); font-size: 12px; margin-top: 4px; }
.rate-row { display: flex; gap: 6px; margin-top: 8px; }
.rate-row .r { flex: 1; }

.block { margin-top: 22px; }
.block-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; }

.chart-wrap { background: var(--bg); border-radius: 14px; padding: 10px; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 18px; justify-content: center; margin-top: 8px; font-size: 13px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
.dot.a { background: var(--primary); }
.dot.b { background: var(--blue); }

.knowledge { display: flex; flex-direction: column; gap: 10px; }
.unit-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px; background: var(--bg); border-radius: 12px; }
.unit-row .u-name { font-weight: 700; font-size: 14px; }
.k-bar { grid-column: 1 / -1; height: 8px; background: #e6e6ec; border-radius: 6px; position: relative; }
.k-bar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.k-bar .a { background: var(--primary); }
.k-bar .b { background: var(--blue); }
.weak { background: var(--red-light); border: 1px solid #f6cdcd; }
.weak-tag { font-size: 12px; color: var(--red); font-weight: 700; }

.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
.detail-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 560px; }
.detail-table th, .detail-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.detail-table th { background: var(--bg); font-weight: 700; }
.res-ok { color: var(--green); font-weight: 700; }
.res-no { color: var(--red); font-weight: 700; }

.detail-per-player { display: flex; flex-direction: column; gap: 18px; }
.detail-player { }
.detail-name { font-size: 15px; font-weight: 800; margin-bottom: 8px; }
.detail-name.a { color: var(--primary-dark); }
.detail-name.b { color: var(--blue); }
.detail-player .table-wrap { margin-top: 8px; }

.result-actions { display: flex; gap: 14px; margin-top: 24px; }
.result-actions .btn-primary { flex: 1; }
.result-actions .btn-secondary { flex: 1; }

/* ============ 响应式 ============ */
@media (max-width: 720px) {
  .view { padding: 14px; }
  .card { padding: 18px; }
  .logo h1 { font-size: 21px; }
  #view-battle { padding: 8px; gap: 8px; }
  .battle-bar { padding: 8px 10px; gap: 8px; }
  .battle-hint { font-size: 12.5px; }
  .center-divider { width: 34px; }
  .cd-name { font-size: 12px; }
  .q-text { font-size: 15px; }
  .opt { padding: 10px 11px; font-size: 13.5px; }
  .player-name { font-size: 15px; }
  .stat { padding: 3px 8px; font-size: 11px; }
  .result-actions { flex-direction: column; }
}

/* 横屏窄设备（手机横屏对战） */
@media (orientation: landscape) and (max-width: 900px) {
  #view-battle { padding: 4px; }
  .battle-bar { padding: 6px 8px; }
  .q-text { font-size: 14px; }
  .opt { padding: 7px 9px; font-size: 12.5px; gap: 6px; }
  .opt .key { width: 22px; height: 22px; }
  .answer-box { font-size: 12px; margin-top: 6px; }
}
</style>
</head>
<body>
  <div class="app">

    <!-- ============ 设置视图 ============ -->
    <section id="view-setup" class="view">
      <div class="card setup-card">
        <div class="logo">
          <div class="logo-icon">⚔</div>
          <h1>历史知识 PK 对战</h1>
          <p class="subtitle">统编版《世界历史》九年级上册 · 双人同屏对决</p>
        </div>

        <!-- 玩家昵称 -->
        <div class="players-row">
          <div class="player-input pA">
            <label for="nameA">玩家&nbsp;A</label>
            <input id="nameA" type="text" maxlength="8" placeholder="A同学" />
          </div>
          <div class="vs-badge">VS</div>
          <div class="player-input pB">
            <label for="nameB">玩家&nbsp;B</label>
            <input id="nameB" type="text" maxlength="8" placeholder="B同学" />
          </div>
        </div>

        <!-- 题数选择 -->
        <div class="field">
          <label class="field-label">本轮题数（10 – 20）</label>
          <div id="count-options" class="seg"></div>
        </div>

        <!-- 章节范围 -->
        <div class="field">
          <label class="field-label">章节范围（多选，按所选单元随机抽题）</label>
          <button id="toggle-all-units" class="link-btn" type="button">
            <span id="toggle-all-text">✔ 全选所有单元</span>
          </button>
          <div id="unit-options" class="unit-grid"></div>
          <p id="bank-info" class="hint"></p>
        </div>

        <button id="btn-start" class="btn-primary big" type="button">开始对战</button>
        <p class="tip">对战规则：左右两边各自独立作答，答对每题 +10 分，答完点各自下方的『下一题』；双方都完成即自动出结算，节奏互不影响。</p>

        <button id="btn-bank" class="link-btn" type="button">查看题库与说明 ▾</button>
        <div id="bank-panel" class="bank-panel hidden">
          <p>题库依据统编版（最新）《世界历史》九年级上册主要章节要点编制，共
            <span id="bank-count"></span> 道选择题，按单元分类。每题附考点出处与解析，适合课后自测与 PK。
          </p>
          <div id="bank-list" class="bank-list"></div>
        </div>
      </div>
    </section>

    <!-- ============ 对战视图 ============ -->
    <section id="view-battle" class="view hidden">
      <div class="battle-bar">
        <button id="btn-abort" class="abort-btn" title="退出本局">✕ 退出</button>
        <div class="battle-hint">左右两边各自独立作答，答完点各自下方的『下一题』</div>
      </div>

      <div id="battle-panels" class="battle-panels">
        <!-- 玩家A 面板 -->
        <div id="panel-0" class="player-panel pa">
          <div class="panel-head">
            <div class="player-name">玩家 A</div>
            <div class="panel-stats">
              <span class="stat score"><span class="num" id="score-0">0</span>分</span>
              <span class="stat correct"><span class="num" id="correct-0">0</span>对</span>
            </div>
          </div>
          <div class="panel-progress">
            <div class="panel-bar-track"><div id="bar-0" class="panel-bar"></div></div>
            <div class="panel-progress-label"><span id="prog-0" class="q-progress">第 1 / 10 题</span></div>
          </div>
          <div class="panel-body">
            <div class="q-text" id="question-0"></div>
            <div id="options-0" class="options"></div>
            <div id="answer-0" class="answer-box"></div>
          </div>
          <div class="panel-footer">
            <button id="next-0" class="btn-primary next-btn" type="button" disabled>下一题</button>
            <div id="done-0" class="done-label hidden">✅ 已完成</div>
          </div>
        </div>
        <!-- 中央分隔条 -->
        <div class="center-divider">
          <div class="cd-score">
            <span class="cd-name" id="cdNameA">A</span>
            <span class="cd-vs">VS</span>
            <span class="cd-name" id="cdNameB">B</span>
          </div>
          <div class="cd-delay"></div>
        </div>
        <!-- 玩家B 面板 -->
        <div id="panel-1" class="player-panel pb">
          <div class="panel-head">
            <div class="player-name">玩家 B</div>
            <div class="panel-stats">
              <span class="stat score"><span class="num" id="score-1">0</span>分</span>
              <span class="stat correct"><span class="num" id="correct-1">0</span>对</span>
            </div>
          </div>
          <div class="panel-progress">
            <div class="panel-bar-track"><div id="bar-1" class="panel-bar"></div></div>
            <div class="panel-progress-label"><span id="prog-1" class="q-progress">第 1 / 10 题</span></div>
          </div>
          <div class="panel-body">
            <div class="q-text" id="question-1"></div>
            <div id="options-1" class="options"></div>
            <div id="answer-1" class="answer-box"></div>
          </div>
          <div class="panel-footer">
            <button id="next-1" class="btn-primary next-btn" type="button" disabled>下一题</button>
            <div id="done-1" class="done-label hidden">✅ 已完成</div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 结算视图 ============ -->
    <section id="view-result" class="view hidden">
      <div class="card result-card">
        <div id="result-title" class="result-title"></div>

        <!-- 汇总卡片 -->
        <div id="summary" class="summary"></div>

        <!-- 得分曲线 SVG -->
        <div class="block">
          <h3 class="block-title">📈 双方各自累计得分曲线</h3>
          <div id="chart-wrap" class="chart-wrap">
            <svg id="chart" viewBox="0 0 600 260" preserveAspectRatio="xMidYMid meet"></svg>
          </div>
          <div class="legend" id="chart-legend"></div>
        </div>

        <!-- 知识点分析 -->
        <div class="block">
          <h3 class="block-title">📊 知识点掌握分析</h3>
          <div id="knowledge" class="knowledge"></div>
        </div>

        <!-- 逐题明细（按玩家分别列出） -->
        <div class="block">
          <h3 class="block-title">📋 逐题明细</h3>
          <div id="detail" class="detail-per-player"></div>
        </div>

        <div class="result-actions">
          <button id="btn-again" class="btn-primary big" type="button">🔁 再来一局</button>
          <button id="btn-reset" class="btn-secondary big" type="button">⚙ 重新设置</button>
        </div>
      </div>
    </section>

  </div>

  <script>
// 九年级历史上册《世界历史》题库 —— 依据统编版（部编）最新教材要点编制
// 每题为标准化选择题，含单元/课节出处与简明考点解析。
window.QUESTION_BANK = [
  // ================= 第一单元 古代亚非文明 =================
  {
    id: 1, unit: '第一单元 古代亚非文明', chapter: '第1课 古代埃及',
    question: '古埃及文明被认为是古代世界最灿烂的文明之一，它的产生与下列哪条河流有密切关系？',

</script>
  <script>
/* 九年级历史知识 PK 对战 —— 主逻辑（独立作答版：两位玩家各自独立抽题、各自判题、各自推进） */
(function () {
  'use strict';

  var SCORE_PER_Q = 10;
  var COUNT_OPTIONS = [10, 12, 15, 20];
  var LETTERS = ['A', 'B', 'C', 'D'];

  // 玩家颜色：0 = A(橙) 1 = B(蓝)
  var P_COLOR = { 0: 'var(--primary)', 1: 'var(--blue)' };

  // ---------------- 状态 ----------------
  // players[p] = { name, score, correct, questions[], cur, answered, done, answers[] }
  var game = {
    names: ['A同学', 'B同学'],
    count: 10,
    selectedUnits: [],
    players: [null, null]
  };

  // ---------------- DOM 工具 ----------------
  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove('hidden'); }
  function hide(id) { $(id).classList.add('hidden'); }

  // ---------------- 单元信息 ----------------
  function getUnits() {
    var map = {};
    window.QUESTION_BANK.forEach(function (q) {
      if (!map[q.unit]) map[q.unit] = 0;
      map[q.unit]++;
    });
    return Object.keys(map).map(function (u) { return { name: u, count: map[u] }; });
  }

  // ---------------- 设置页 ----------------
  function renderCountOptions() {
    var box = $('count-options');
    box.innerHTML = '';
    COUNT_OPTIONS.forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'seg-chip' + (n === game.count ? ' active' : '');
      el.textContent = n + ' 题';
      el.dataset.n = n;
      el.addEventListener('click', function () {
        game.count = n;
        Array.prototype.forEach.call(box.children, function (c) {
          c.classList.toggle('active', Number(c.dataset.n) === n);
        });
      });
      box.appendChild(el);
    });
  }

  function renderUnits() {
    var units = getUnits();
    var box = $('unit-options');
    box.innerHTML = '';
    units.forEach(function (u) {
      var el = document.createElement('div');
      el.className = 'unit-chip active';
      el.innerHTML =
        '<div class="u-name"><span class="u-check">✔</span><span class="u-text"></span>' +
        '<span class="u-count"></span></div>';
      el.querySelector('.u-text').textContent = u.name;
      el.querySelector('.u-count').textContent = u.count + '题';
      el.dataset.unit = u.name;
      el.addEventListener('click', function () {
        el.classList.toggle('active');
        syncAllToggle();
        updateBankInfo();
      });
      box.appendChild(el);
    });
    game.selectedUnits = units.map(function (u) { return u.name; });
    syncAllToggle();
    updateBankInfo();
  }

  function syncAllToggle() {
    var chips = $('unit-options').children;
    var allActive = Array.prototype.every.call(chips, function (c) { return c.classList.contains('active'); });
    $('toggle-all-text').textContent = allActive ? '✅ 取消全选' : '✔ 全选所有单元';
  }

  function currentSelectedUnits() {
    var chips = $('unit-options').children;
    var out = [];
    Array.prototype.forEach.call(chips, function (c) { if (c.classList.contains('active')) out.push(c.dataset.unit); });
    return out;
  }

  function updateBankInfo() {
    var sel = currentSelectedUnits();
    var total = 0;
    window.QUESTION_BANK.forEach(function (q) { if (sel.indexOf(q.unit) >= 0) total++; });
    var n = Math.min(game.count, total);
    var warn = total < game.count ? '（所选单元题量不足，本局每人实际出题 ' + n + ' 题）' : '';
    $('bank-info').textContent = '已选 ' + sel.length + ' 个单元，可抽题 ' + total + ' 道 → 每位玩家将各自抽取 ' + n + ' 题（互不相同）。' + warn;
  }

  function renderBankList() {
    $('bank-count').textContent = window.QUESTION_BANK.length;
    var box = $('bank-list');
    box.innerHTML = '';
    window.QUESTION_BANK.forEach(function (q) {
      var el = document.createElement('div');
      el.className = 'bank-item';
      el.innerHTML = '<div class="u"></div><div class="t"></div>';
      el.querySelector('.u').textContent = q.unit + ' · ' + q.chapter;
      el.querySelector('.t').textContent = q.id + '. ' + q.question;
      box.appendChild(el);
    });
  }

  var bankOpen = false;
  function toggleBank() {
    bankOpen = !bankOpen;
    $('bank-panel').classList.toggle('hidden', !bankOpen);
    $('btn-bank').textContent = bankOpen ? '收起题库与说明 ▴' : '查看题库与说明 ▾';
  }

  // ---------------- 抽题（各自独立洗牌取 N 题） ----------------
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickQuestions() {
    var sel = currentSelectedUnits();
    var bank = window.QUESTION_BANK.filter(function (q) { return sel.indexOf(q.unit) >= 0; });
    var n = Math.min(game.count, bank.length);
    return shuffle(bank).slice(0, n);
  }

  // ---------------- 对战 ----------------
  function startGame() {
    game.names = [$('nameA').value.trim() || 'A同学', $('nameB').value.trim() || 'B同学'];
    game.selectedUnits = currentSelectedUnits();
    if (game.selectedUnits.length === 0) {
      alert('请至少勾选一个单元范围！');
      return;
    }
    initPlayers();

    hide('view-setup');
    show('view-battle');
    bindNameBar();

    // 每个玩家独立渲染第 1 题
    for (var p = 0; p < 2; p++) renderQuestion(p);
  }

  function initPlayers() {
    game.players = [0, 1].map(function (p) {
      return {
        name: game.names[p],
        score: 0,
        correct: 0,
        questions: pickQuestions(),   // 各自单独洗牌抽题
        cur: 0,
        answered: false,
        done: false,
        answers: []
      };
    });
  }

  function bindNameBar() {
    $('cdNameA').textContent = game.players[0].name;
    $('cdNameB').textContent = game.players[1].name;
    $('cdNameB').classList.add('b');
  }

  function currentQ(p) { return game.players[p].questions[game.players[p].cur]; }

  function updateStat(p) {
    var info = game.players[p];
    $('score-' + p).textContent = info.score;
    $('correct-' + p).textContent = info.correct;
  }

  function updateProgress(p) {
    var info = game.players[p];
    var total = info.questions.length;
    var n = info.cur + 1;
    if (info.done) n = total;
    $('prog-' + p).textContent = '第 ' + n + ' / ' + total + ' 题';
    $('bar-' + p).style.width = (info.done ? total : info.cur) / total * 100 + '%';
  }

  function updateNextButton(p) {
    var info = game.players[p];
    var btn = $('next-' + p);
    var doneLabel = $('done-' + p);
    if (info.done) {
      btn.disabled = true;
      doneLabel.classList.remove('hidden');
    } else if (info.answered) {
      btn.disabled = false;
      doneLabel.classList.add('hidden');
    } else {
      btn.disabled = true;
      doneLabel.classList.add('hidden');
    }
  }

  // 渲染某位玩家的当前题
  function renderQuestion(p) {
    var pl = game.players[p];
    var q = currentQ(p);
    pl.answered = false;

    $('question-' + p).textContent = q.question;
    var box = $('options-' + p);
    box.innerHTML = '';
    q.options.forEach(function (opt, i) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'opt';
      el.innerHTML = '<span class="key"></span><span class="text"></span>';
      el.querySelector('.key').textContent = LETTERS[i];
      el.querySelector('.text').textContent = opt.replace(/^[A-D]\.\s*/, '');
      el.addEventListener('click', function () { onAnswer(p, i); });
      box.appendChild(el);
    });
    var ab = $('answer-' + p);
    ab.className = 'answer-box';
    ab.innerHTML = '';

    updateStat(p);
    updateProgress(p);
    updateNextButton(p);
  }

  // ---------------- 作答与判题 ----------------
  function onAnswer(p, i) {
    var pl = game.players[p];
    if (pl.answered || pl.done) return;
    pl.answered = true;

    var q = currentQ(p);
    var correct = (i === q.answer);
    pl.answers.push({
      unit: q.unit,
      chapter: q.chapter,
      question: q.question,
      chosen: i,
      correct: correct
    });
    if (correct) {
      pl.score += SCORE_PER_Q;
      pl.correct++;
    }

    // 高亮所选并锁定
    var opts = $('options-' + p).children;
    Array.prototype.forEach.call(opts, function (o) { o.classList.add('locked'); });
    opts[i].classList.add('selected');
    // 标出正确 / 错误
    opts[q.answer].classList.add('correct');
    if (i !== q.answer) opts[i].classList.add('wrong');

    // 解析框
    var ab = $('answer-' + p);
    ab.className = 'answer-box show';
    var resLine = correct
      ? '<span class="res-line ok">✓ 回答正确 · +' + SCORE_PER_Q + ' 分</span>'
      : '<span class="res-line no">✗ 回答错误 · 0 分</span>';
    ab.innerHTML =
      resLine +
      '<div>正确答案：<b>' + LETTERS[q.answer] + '</b></div>' +
      '<div class="src">出处：' + q.unit + ' · ' + q.chapter + '</div>' +
      '<div class="expl">' + q.explanation + '</div>';

    updateStat(p);
    updateProgress(p);
    updateNextButton(p);
  }

  // 某位玩家的“下一题”
  function nextPlayer(p) {
    var pl = game.players[p];
    if (!pl.answered || pl.done) return;
    if (pl.cur < pl.questions.length - 1) {
      pl.cur++;
      renderQuestion(p);
    } else {
      pl.done = true;
      updateProgress(p);
      updateNextButton(p);
    }
    if (game.players[0].done && game.players[1].done) finishGame();
  }

  function abortGame() {
    if (confirm('确定要退出本局对战吗？')) {
      show('view-setup');
      hide('view-battle');
      hide('view-result');
    }
  }

  // ---------------- 结算页 ----------------
  function finishGame() {
    hide('view-battle');
    show('view-result');

    var a = game.players[0], b = game.players[1];
    // 标题
    var title = $('result-title');
    if (a.score > b.score) title.innerHTML = '🏆 恭喜 <span class="winner">' + a.name + '</span> 获胜！';
    else if (b.score > a.score) title.innerHTML = '🏆 恭喜 <span class="winner">' + b.name + '</span> 获胜！';
    else title.innerHTML = '<span class="draw">🤝 旗鼓相当，本局平局！</span>';

    renderSummary(a, b);
    renderChart();
    renderKnowledge();
    renderDetail();
  }

  function renderSummary(a, b) {
    var box = $('summary');
    box.innerHTML = '';
    [a, b].forEach(function (info, idx) {
      var n = info.questions.length;
      var rate = n ? Math.round(info.correct / n * 100) : 0;
      var card = document.createElement('div');
      card.className = 'sum-card ' + (idx === 0 ? 'pa' : 'pb');
      card.innerHTML =
        '<div class="sum-name">' + info.name + '</div>' +
        '<div class="big-num">' + info.score + '</div>' +
        '<div class="sum-label">总得分（满分 ' + (n * SCORE_PER_Q) + '）</div>' +
        '<div class="rate-row">' +
        '<div class="r"><b>' + info.correct + '</b><div class="sum-label">答对数</div></div>' +
        '<div class="r"><b>' + rate + '%</b><div class="sum-label">正确率</div></div>' +
        '</div>';
      box.appendChild(card);
    });
  }

  // 每位玩家按自己的 N 题累计绘制
  function renderChart() {
    var a = game.players[0], b = game.players[1];
    var n = Math.max(a.questions.length, b.questions.length);
    var maxY = n * SCORE_PER_Q;

    var W = 600, H = 260;
    var padL = 40, padR = 16, padT = 18, padB = 28;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    function px(i) { return padL + (plotW * i / n); }
    function py(v) { return padT + plotH * (1 - v / maxY); }

    // 生成某位玩家按自己题序的累计得分序列
    function polyFor(answers) {
      var xs = [], ys = [], s = 0;
      for (var i = 0; i <= n; i++) {
        if (i > 0 && i - 1 < answers.length && answers[i - 1].correct) s += SCORE_PER_Q;
        xs.push(i);
        ys.push(py(s));
      }
      return { xs: xs, ys: ys };
    }

    var svg = $('chart');
    var parts = [];
    // 网格横线
    for (var g = 0; g <= 4; g++) {
      var gy = padT + plotH * g / 4;
      var val = Math.round(maxY * (1 - g / 4));
      parts.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#e6e6ec"/>');
      parts.push('<text x="' + (padL - 6) + '" y="' + (gy + 4) + '" font-size="11" fill="#9a9aa6" text-anchor="end">' + val + '</text>');
    }
    parts.push('<text x="' + padL + '" y="' + (H - 8) + '" font-size="11" fill="#9a9aa6">题序</text>');

    function poly(xs, ys) {
      return xs.map(function (x, i) { return (i ? ' L' : 'M') + px(x).toFixed(1) + ' ' + ys[i].toFixed(1); }).join('');
    }
    var lineA = polyFor(a.answers), lineB = polyFor(b.answers);
    parts.push('<polyline points="' + poly(lineA.xs, lineA.ys) + '" fill="none" stroke="' + P_COLOR[0] + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>');
    parts.push('<polyline points="' + poly(lineB.xs, lineB.ys) + '" fill="none" stroke="' + P_COLOR[1] + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>');

    function dots(line, color) {
      line.xs.forEach(function (x, i) {
        var idx = Math.round(x);
        if (i === 0 || idx === n || idx % 5 === 0) {
          parts.push('<circle cx="' + px(x).toFixed(1) + '" cy="' + line.ys[i].toFixed(1) + '" r="3.5" fill="#fff" stroke="' + color + '" stroke-width="2.5"/>');
        }
      });
    }
    dots(lineA, P_COLOR[0]);
    dots(lineB, P_COLOR[1]);

    svg.innerHTML = parts.join('');

    $('chart-legend').innerHTML =
      '<span><i class="dot a"></i>' + a.name + '（' + a.score + '分）</span>' +
      '<span><i class="dot b"></i>' + b.name + '（' + b.score + '分）</span>';
  }

  // 知识点分析：按每位玩家自己的答案统计
  function renderKnowledge() {
    var a = game.players[0], b = game.players[1];
    var units = {};
    window.QUESTION_BANK.forEach(function (q) { if (!units[q.unit]) units[q.unit] = 0; });
    Object.keys(units).forEach(function (u) { units[u] = { a: 0, aT: 0, b: 0, bT: 0 }; });

    [a, b].forEach(function (info, idx) {
      info.answers.forEach(function (r) {
        if (!units[r.unit]) units[r.unit] = { a: 0, aT: 0, b: 0, bT: 0 };
        if (idx === 0) { units[r.unit].aT++; if (r.correct) units[r.unit].a++; }
        else { units[r.unit].bT++; if (r.correct) units[r.unit].b++; }
      });
    });

    // 本局涉及单元数（合并两位玩家各自的题目）
    var countThisGame = {};
    [a, b].forEach(function (info) {
      info.questions.forEach(function (q) { countThisGame[q.unit] = (countThisGame[q.unit] || 0) + 1; });
    });

    var box = $('knowledge');
    box.innerHTML = '';
    Object.keys(units).forEach(function (u) {
      var st = units[u];
      if (!countThisGame[u]) return; // 只显示本局涉及的单元
      var aRate = st.aT ? Math.round(st.a / st.aT * 100) : 0;
      var bRate = st.bT ? Math.round(st.b / st.bT * 100) : 0;
      var weak = Math.min(aRate, bRate) < 50;
      var row = document.createElement('div');
      row.className = 'unit-row' + (weak ? ' weak' : '');
      row.innerHTML =
        '<div class="u-name">' + u + ' <span class="sum-label">（' + countThisGame[u] + '题）</span>' +
        (weak ? '<span class="weak-tag">⚠ 建议复习</span>' : '') + '</div>' +
        '<div class="sum-label">A ' + aRate + '% · B ' + bRate + '%</div>' +
        '<div class="k-bar"><i class="a" style="width:' + aRate + '%"></i><i class="b" style="width:' + bRate + '%"></i></div>';
      box.appendChild(row);
    });
    if (!box.children.length) box.innerHTML = '<div class="tip">暂无本局单元数据。</div>';
  }

  // 逐题明细：按玩家分别列出
  function renderDetail() {
    var a = game.players[0], b = game.players[1];
    var wrap = $('detail');
    wrap.innerHTML = '';
    [a, b].forEach(function (info, idx) {
      var sec = document.createElement('div');
      sec.className = 'detail-player';
      var name = document.createElement('div');
      name.className = 'detail-name ' + (idx === 0 ? 'a' : 'b');
      name.textContent = info.name + '（答对 ' + info.correct + ' / ' + info.questions.length + ' 题）';
      sec.appendChild(name);

      var tableWrap = document.createElement('div');
      tableWrap.className = 'table-wrap';
      var table = document.createElement('table');
      table.className = 'detail-table';
      table.innerHTML = '<thead><tr><th>题号</th><th>题干</th><th>所选</th><th>正误</th><th>单元 / 课节</th><th>答案</th></tr></thead>';
      var tb = document.createElement('tbody');
      info.answers.forEach(function (r, i) {
        var q = info.questions[i];
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + (i + 1) + '</td>' +
          '<td>' + r.question + '</td>' +
          '<td>' + LETTERS[r.chosen] + '</td>' +
          '<td>' + (r.correct ? '<span class="res-ok">对</span>' : '<span class="res-no">错</span>') + '</td>' +
          '<td>' + r.unit + '<br><span class="sum-label">' + r.chapter + '</span></td>' +
          '<td>' + (q ? LETTERS[q.answer] : '—') + '</td>';
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      tableWrap.appendChild(table);
      sec.appendChild(tableWrap);
      wrap.appendChild(sec);
    });
  }

  // ---------------- 事件绑定 ----------------
  function bindEvents() {
    $('btn-start').addEventListener('click', startGame);
    $('next-0').addEventListener('click', function () { nextPlayer(0); });
    $('next-1').addEventListener('click', function () { nextPlayer(1); });
    $('btn-abort').addEventListener('click', abortGame);
    $('btn-again').addEventListener('click', function () { startGame(); });
    $('btn-reset').addEventListener('click', function () { show('view-setup'); hide('view-battle'); hide('view-result'); });
    $('btn-bank').addEventListener('click', toggleBank);
    $('toggle-all-units').addEventListener('click', function () {
      var chips = $('unit-options').children;
      var allActive = Array.prototype.every.call(chips, function (c) { return c.classList.contains('active'); });
      Array.prototype.forEach.call(chips, function (c) { c.classList.toggle('active', !allActive); });
      syncAllToggle();
      updateBankInfo();
    });
    ['nameA', 'nameB'].forEach(function (id) {
      $(id).addEventListener('input', function () {
        if (!$(id).value.trim()) $(id).placeholder = id === 'nameA' ? 'A同学' : 'B同学';
      });
    });
    // 键盘快捷键：A侧 1/2/3/4 选题，B侧 7/8/9/0 选题（无回车联动）
    document.addEventListener('keydown', function (e) {
      if ($('view-battle').classList.contains('hidden')) return;
      var mapA = { '1': 0, '2': 1, '3': 2, '4': 3 };
      var mapB = { '7': 0, '8': 1, '9': 2, '0': 3 };
      if (e.key in mapA) onAnswer(0, mapA[e.key]);
      else if (e.key in mapB) onAnswer(1, mapB[e.key]);
    });
  }

  // ---------------- 初始化 ----------------
  document.addEventListener('DOMContentLoaded', function () {
    renderCountOptions();
    renderUnits();
    renderBankList();
    updateBankInfo();
    bindEvents();
  });
})();
</script>
