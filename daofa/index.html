<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fa">
<title>道德与法治九上 · 单机刷题（200题）</title>
<meta name="description" content="统编版《道德与法治》九年级上册 4 个单元 200 题单机刷题：中考真题为主，错题本与成绩统计，数据存本机。">
<style>
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --ink: #1b2331;
  --ink-2: #566073;
  --ink-3: #8892a6;
  --line: #e2e7f0;
  --brand: #2f5fa8;
  --brand-soft: #eaf0fa;
  --ok: #2f7d5c;
  --ok-soft: #e8f5ee;
  --bad: #c0392b;
  --bad-soft: #fdeceb;
  --warn: #b8860b;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(27, 35, 49, 0.06);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 40px; }

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(244, 246, 250, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 860px; margin: 0 auto; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
}
.brand { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.brand small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: .15s;
}
.btn:hover { border-color: #c8d2e2; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #26508f; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: #eccdc9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 11px; font-size: 12px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 14px;
}
.card h2 { margin: 0 0 4px; font-size: 16px; }
.card .sub { color: var(--ink-3); font-size: 12.5px; margin-bottom: 12px; }

/* ---------- 设置区 ---------- */
.units { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.unit-chip {
  border: 1px solid var(--line); background: #fafbfd; border-radius: 10px;
  padding: 8px 11px; font-size: 13px; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 6px; transition: .15s;
}
.unit-chip.on { background: var(--brand-soft); border-color: #b8cbe8; color: #23497f; font-weight: 600; }
.unit-chip .n { color: var(--ink-3); font-size: 11px; }
.unit-chip.on .n { color: #6d8cb8; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.row > .label { font-size: 13px; color: var(--ink-2); min-width: 62px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  border: 0; background: #fff; padding: 7px 13px; font-size: 13px; cursor: pointer;
  font-family: inherit; color: var(--ink-2); border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--brand); color: #fff; font-weight: 600; }

/* ---------- 答题区 ---------- */
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #eef1f6; color: var(--ink-2); }
.tag.unit { background: var(--brand-soft); color: #23497f; font-weight: 600; }
.tag.src { background: #eef6f1; color: #2f6b50; }
.tag.wrong { background: var(--bad-soft); color: var(--bad); font-weight: 600; }

.qtext { font-size: 17px; line-height: 1.75; font-weight: 600; margin: 4px 0 14px; }

.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1.5px solid var(--line); background: #fff; border-radius: 12px;
  padding: 12px 13px; cursor: pointer; transition: .15s; text-align: left;
  font-family: inherit; font-size: 15.5px; line-height: 1.6; color: var(--ink);
}
.opt:hover { border-color: #c8d2e2; background: #fcfdff; }
.opt .key {
  flex: 0 0 24px; height: 24px; border-radius: 50%; background: #eef1f6; color: var(--ink-2);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  margin-top: 1px;
}
.opt.picked { border-color: var(--brand); background: var(--brand-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.locked { cursor: default; }

.explain {
  margin-top: 14px; border-left: 3px solid var(--brand);
  background: #f6f9fd; border-radius: 0 10px 10px 0; padding: 11px 13px; font-size: 14.5px;
  line-height: 1.7; color: #33404f;
}
.explain b { color: var(--brand); }
.verdict { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }

/* ---------- 进度 ---------- */
.bar { height: 6px; background: #e8ecf3; border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
.bar i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .25s; }
.stats { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.stats b { color: var(--ink); font-size: 15px; }

/* ---------- 答题卡 ---------- */
.sheet { display: flex; flex-wrap: wrap; gap: 6px; }
.sheet button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; font-size: 12.5px; cursor: pointer; font-family: inherit; color: var(--ink-2);
}
.sheet button.right { background: var(--ok-soft); border-color: #bfe0cf; color: var(--ok); font-weight: 700; }
.sheet button.wrong { background: var(--bad-soft); border-color: #eecac6; color: var(--bad); font-weight: 700; }
.sheet button.cur { outline: 2px solid var(--brand); outline-offset: 1px; font-weight: 700; }

/* ---------- 结算 ---------- */
.score { text-align: center; padding: 6px 0 12px; }
.score .big { font-size: 44px; font-weight: 800; line-height: 1.1; color: var(--brand); }
.score .big small { font-size: 16px; color: var(--ink-3); font-weight: 600; }
.score .desc { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.mini-bar { height: 7px; background: #eaeef5; border-radius: 99px; overflow: hidden; min-width: 60px; }
.mini-bar i { display: block; height: 100%; background: var(--ok); }

.wrong-item { border-top: 1px dashed var(--line); padding: 12px 0; }
.wrong-item:first-child { border-top: 0; }
.wrong-item .q { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
.wrong-item .a { font-size: 13.5px; color: var(--ink-2); }
.wrong-item .a .bad { color: var(--bad); }
.wrong-item .a .ok { color: var(--ok); }

.empty { text-align: center; color: var(--ink-3); padding: 26px 10px; font-size: 14px; }
.hide { display: none !important; }
.hint { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.foot { text-align: center; color: var(--ink-3); font-size: 12px; padding: 18px 0 0; }

@media (max-width: 480px) {
  .wrap { padding: 12px 10px 32px; }
  .card { padding: 14px; }
  .qtext { font-size: 16px; }
  .opt { font-size: 15px; padding: 11px; }
  .brand { font-size: 15.5px; }
}

</style>
</head>

<script>
/**
 * 道德与法治九年级上册 · 题库（200题）
 * ---------------------------------------------------------------
 * 范围：统编版《道德与法治》九年级上册（R版）4 个单元 10 课
 * 结构对照「打卡式背记本」目录：
 *   第一单元 百年大党风华正茂（第1—3课）
 *   第二单元 新的历史方位（第4—6课）
 *   第三单元 擘画宏伟蓝图（第7—8课）
 *   第四单元 和谐与梦想（第9—10课）
 *
 * 来源：以 2020—2025 年各地中考真题为主（标注「年份·地区·中考真题」），
 *       部分依据教材考点与中考命题方式改编（标注「改编」）。
 * 每题结构：{ u:单元, s:来源, q:题干, o:[4选项], a:正确项下标(0-3), e:解析 }
 * 说明：真题文本经整理录入，材料型试题保留核心情境，题意不变。
 */

const QUESTIONS = [
  /* ==================== 第一单元 百年大党风华正茂 ==================== */
  /* ---- 第1课 百年大党风华正茂 ---- */
  {u:1,s:'2022·湖北十堰·中考真题',q:'1921年，中国共产党在嘉兴南湖的一条红船上诞生。这一事件被称为“开天辟地的大事变”，因为它使中国革命的面貌焕然一新。中国共产党的诞生',o:['是中国历史上开天辟地的大事变','确立了社会主义基本制度','实现了中华民族的伟大复兴','标志着新民主主义革命的胜利'],a:0,e:'1921年中国共产党成立，是中国历史上开天辟地的大事变，使中国革命面貌焕然一新；新民主主义革命胜利是1949年，社会主义基本制度确立于1956年。'},
  {u:1,s:'2023·云南·中考真题',q:'从1921年到2021年，中国共产党团结带领中国人民完成了一项项壮举。下列属于新民主主义革命时期取得的成就是',o:['进行改革开放和社会主义现代化建设','建立了中华人民共和国','开创了中国特色社会主义新时代','打赢脱贫攻坚战'],a:1,e:'新民主主义革命时期（1921—1949）中国共产党领导人民推翻三座大山、建立了中华人民共和国。'},
  {u:1,s:'2024·山东聊城·中考真题',q:'中国特色社会主义进入新时代，意味着中华民族迎来了从站起来、富起来到强起来的伟大飞跃。其中的“站起来”指的是',o:['全面建成小康社会','进入中国特色社会主义新时代','新中国的成立和社会主义制度的确立','实行改革开放'],a:2,e:'“站起来”指1949年新中国成立、1956年社会主义制度确立，中国人民从此站起来了。'},
  {u:1,s:'2023·四川成都·中考真题',q:'改革开放是决定当代中国命运的关键一招，也是决定实现中华民族伟大复兴的关键一招。我国的改革开放始于',o:['2012年党的十八大','1949年','1956年','1978年党的十一届三中全会'],a:3,e:'1978年党的十一届三中全会作出了改革开放的历史性决策，开启了改革开放和社会主义现代化建设新时期。'},
  {u:1,s:'2025·广西·中考真题',q:'中国共产党人的精神谱系，以伟大建党精神为源头。伟大建党精神是中国共产党的精神之源，其内涵是',o:['坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民','自力更生、艰苦奋斗、开拓创新、无私奉献','解放思想、实事求是、与时俱进、求真务实','改革创新、开放包容、团结协作、争创一流'],a:0,e:'伟大建党精神的内涵是：坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民。'},
  {u:1,s:'2023·湖北襄阳·中考真题',q:'“不怕牺牲、英勇斗争”是伟大建党精神的重要内容。下列人物事迹最能体现这一精神内涵的是',o:['脱贫攻坚干部扎根山区带领群众致富','革命战争年代革命烈士为理想流尽最后一滴血','科研工作者刻苦攻关取得技术突破','教师扎根乡村几十年教书育人'],a:1,e:'革命烈士在战争年代为理想信念流血牺牲，直接体现“不怕牺牲、英勇斗争”的精神内涵。'},
  {u:1,s:'2024·黑龙江绥化·中考真题',q:'中国共产党人的精神谱系是中国共产党人的精神之源，是激励我们顽强奋斗、不断前进的强大精神动力。以伟大建党精神为源头的精神谱系',o:['已经过时，不再具有时代价值','只形成于革命战争年代','是激励全党全国各族人民奋勇前进的强大精神动力','与青少年成长无关'],a:2,e:'中国共产党人的精神谱系跨越各个历史时期不断丰富发展，是激励全党全国各族人民奋勇前进的强大精神动力。'},
  /* ---- 第2课 坚持以人民为中心 ---- */
  {u:1,s:'2025·甘肃武威·中考真题',q:'2024年甘肃省委省政府10件为民实事如期全面高质量完成，圆满兑现了对全省人民的庄严承诺。这说明',o:['甘肃省进一步扩大了人民各项权利','甘肃省现阶段社会主要矛盾已经解决','甘肃省委省政府满足人民一切需要','人民对美好生活的向往是党的奋斗目标'],a:3,e:'党和政府坚持以人民为中心的发展思想，不断满足人民日益增长的美好生活需要，体现了人民对美好生活的向往是党的奋斗目标；“一切”表述绝对化。'},
  {u:1,s:'2025·江苏苏州·中考真题',q:'财政部数据显示，2019年至2024年，全国财政用于养老服务和老年人福利方面的支出超过5600亿元，年均增长11%。由此可见',o:['政府正持续加强社会保障体系建设','市场在社保资源配置中起决定作用','我国已经解决了“老有所养”问题','物质帮助权是公民赖以生存的基础'],a:0,e:'财政支出持续增长且年均增速达11%，直接体现政府加强社会保障体系建设的行动；公民赖以生存的基础是劳动权。'},
  {u:1,s:'2024·山东潍坊·中考真题',q:'“江山就是人民，人民就是江山。”中国共产党始终坚持人民至上，把人民放在心中最高位置。这体现了中国共产党',o:['坚持依法执政','坚持以人民为中心的发展思想','坚持改革开放','坚持独立自主'],a:1,e:'“江山就是人民，人民就是江山”体现了中国共产党坚持以人民为中心的发展思想。'},
  {u:1,s:'2023·贵州遵义·中考真题',q:'党的一切工作必须以最广大人民根本利益为最高标准。检验我们一切工作的成效，最终都要看人民是否真正得到了实惠，人民生活是否真正得到了改善。这表明',o:['人民可以直接决定国家大事','党的工作重心是维护社会稳定','中国共产党的根本宗旨是全心全意为人民服务','党的工作只需要考虑经济指标'],a:2,e:'材料强调党的一切工作以人民根本利益为最高标准，体现全心全意为人民服务是党的根本宗旨。'},
  {u:1,s:'2024·云南·中考真题',q:'某市实施老旧小区改造，加装电梯、改造管网、增设停车位，让居民的生活更加便利舒适。这一举措',o:['表明城乡差距已完全消除','体现了人民民主专政的国家性质','说明该市已实现共同富裕','践行了以人民为中心的发展思想'],a:3,e:'老旧小区改造着眼于改善居民生活条件，是践行以人民为中心的发展思想的具体体现。'},
  {u:1,s:'2023·湖南长沙·中考真题',q:'为民造福是立党为公、执政为民的本质要求。下列做法最能体现这一要求的是',o:['某地推行“最多跑一次”改革方便群众办事','某地限制外来人口子女入学','某地削减教育和医疗财政投入','某地为了GDP增长引进高污染企业'],a:0,e:'推行“最多跑一次”改革方便群众办事，是为民造福、执政为民的体现；其余选项均损害群众利益。'},
  {u:1,s:'2025·安徽·中考真题',q:'中国共产党的根本立场是人民立场。站稳人民立场，就要',o:['把满足人民一切要求作为工作目标','践行党的根本宗旨，贯彻党的群众路线','以维护少数人利益为出发点','只关注城市居民的利益诉求'],a:1,e:'站稳人民立场要求践行全心全意为人民服务的根本宗旨，贯彻党的群众路线。'},
  /* ---- 第3课 党是领导一切的 ---- */
  {u:1,s:'2025·陕西·中考真题',q:'关于坚持党的全面领导，下列说法不正确的是',o:['党是最高政治领导力量','党政军民学，东西南北中，党是领导一切的','党的领导只体现在经济建设领域','党的领导是民族复兴根本保证'],a:2,e:'“只”字表述绝对化，党的领导贯穿经济、政治、文化、社会、生态文明等各领域各方面。'},
  {u:1,s:'2025·江苏镇江·中考真题',q:'习近平总书记指出，____决定中国式现代化的根本性质。',o:['依法治国','共同富裕','改革开放','党的领导'],a:3,e:'党的领导是中国式现代化最本质的特征和最大优势，决定了中国式现代化的根本性质和发展方向。'},
  {u:1,s:'2023·广东广州·中考真题',q:'中国共产党的领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势。对此理解正确的是',o:['党的领导是党和国家的根本所在、命脉所在','党的领导可以代替政府行使权力','党的领导意味着党可以直接管理企业','党的领导只体现在政治领域'],a:0,e:'中国共产党领导是中国特色社会主义最本质特征和最大优势，是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。'},
  {u:1,s:'2024·湖北·中考真题',q:'全面建成社会主义现代化强国、实现中华民族伟大复兴，必须坚持和加强党的全面领导。这是因为党的全面领导',o:['是我国的基本经济制度','是民族复兴的根本保证','是公民的基本权利','是国际社会的普遍做法'],a:1,e:'党的全面领导是实现中华民族伟大复兴的根本保证。'},
  {u:1,s:'2023·福建·中考真题',q:'党政军民学，东西南北中，党是领导一切的。坚持党对一切工作的领导，要求我们做到',o:['取消其他组织的职能','把党的领导停留在口头上','坚决维护党中央权威和集中统一领导','由党直接管理社会一切事务'],a:2,e:'坚持党的全面领导，最重要的是坚决维护党中央权威和集中统一领导；党的领导必须体现在实际行动中，不能停留在口头上。'},
  {u:1,s:'2025·河南·中考真题',q:'坚决维护习近平总书记党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导，这是',o:['只是领导干部的要求','只适用于国家机关工作人员','仅限于党内政治生活的原则','全党全国各族人民的共同愿望'],a:3,e:'“两个维护”是全党全国各族人民的共同愿望，是党和国家事业沿着正确方向发展的根本保证。'},
  {u:1,s:'2024·江西·中考真题',q:'“坚持真理、坚守理想”是伟大建党精神的重要内容。新时代青少年弘扬这一精神，应当做到',o:['树立远大理想，坚定理想信念','只关注学习成绩，不关心国家大事','追求物质享受，及时行乐','放弃个人理想，完全服从集体安排'],a:0,e:'弘扬伟大建党精神，青少年应树立远大理想、坚定理想信念，把个人理想融入国家发展。'},
  {u:1,s:'2021·湖北孝感·中考真题',q:'全国各地组织开展庆祝中国共产党成立100周年系列活动。这有利于青少年（　　）',o:['激发爱国爱党热情，弘扬中华民族精神','使我国迅速赶超发达国家，最终称霸世界','激励我们肩负历史使命，为实现中国梦而接力奋斗','增强民族自尊心、自信心和自豪感'],a:0,e:'②中“迅速赶超发达国家、最终称霸世界”说法错误，我国坚持和平发展道路。①③④均为庆祝建党百年系列活动的积极意义。'},
  {u:1,s:'2023·山东济南·中考真题',q:'中国共产党的领导是中国特色社会主义最本质的特征。这一论断',o:['意味着其他政党不能参政议政','表明党可以凌驾于宪法法律之上','深刻揭示了中国特色社会主义的根本属性','说明党的领导不需要法律保障'],a:2,e:'该论断深刻揭示了中国特色社会主义的根本属性；党必须在宪法法律范围内活动，坚持依法执政。'},
  {u:1,s:'2024·四川成都·中考真题',q:'一百多年来，中国共产党团结带领中国人民创造了四个方面的伟大成就，书写了中华民族几千年历史上最恢宏的史诗。其中“改革开放和社会主义现代化建设新时期”从',o:['2012年开始','1921年开始','1949年开始','1978年开始'],a:3,e:'1978年党的十一届三中全会开启了改革开放和社会主义现代化建设新时期。'},
  {u:1,s:'2025·湖南·中考真题',q:'习近平总书记指出，中国共产党人的初心和使命是',o:['为中国人民谋幸福，为中华民族谋复兴','实现个人价值最大化','推动世界经济发展','建立国际新秩序'],a:0,e:'为中国人民谋幸福、为中华民族谋复兴，是中国共产党人的初心和使命。'},
  {u:1,s:'2022·重庆A卷·中考真题',q:'中国共产党历经百年而风华正茂，其根本原因在于',o:['完全照搬外国发展模式','坚持为中国人民谋幸福、为中华民族谋复兴的初心使命','始终坚持封闭保守的发展策略','依靠少数精英的英明决策'],a:1,e:'中国共产党始终坚持为人民谋幸福、为民族谋复兴的初心使命，这是其历经百年而风华正茂的根本原因。'},
  {u:1,s:'2023·安徽·中考真题',q:'“我是党员我先上”——在抗洪抢险、疫情防控等危急时刻，广大党员冲锋在前。这一现象说明',o:['党的宗旨是维护党员利益','共产党员享有超越法律的特权','党员发挥了先锋模范作用，践行了党的宗旨','只有党员才能参与救援工作'],a:2,e:'党员在危急时刻冲锋在前，发挥了先锋模范作用，践行了全心全意为人民服务的根本宗旨。'},
  {u:1,s:'2024·江苏南京·中考真题',q:'坚持和加强党的全面领导，最重要的就是',o:['扩大党组织的数量','提高党员的待遇','增加党费收缴金额','坚决维护党中央权威和集中统一领导'],a:3,e:'坚持和加强党的全面领导，最重要的是坚决维护党中央权威和集中统一领导。'},

  /* ==================== 第二单元 新的历史方位 ==================== */
  /* ---- 第4课 新的历史方位 ---- */
  {u:2,s:'2024·河北·中考真题',q:'2012年党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。进入新时代的标志性事件是',o:['党的十八大的召开','中国共产党成立百年','全面建成小康社会','实现第一个百年奋斗目标'],a:0,e:'2012年党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。'},
  {u:2,s:'2023·甘肃定西·中考真题',q:'进入新时代，我国社会主要矛盾已经转化为',o:['人民日益增长的物质文化需要同落后的社会生产之间的矛盾','人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾','先进的社会制度同落后的生产力之间的矛盾','经济发展与环境保护之间的矛盾'],a:1,e:'新时代我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。'},
  {u:2,s:'2022·江苏南京·中考真题',q:'我国社会主要矛盾发生深刻变化，反映了我国发展的阶段性要求，体现了党和国家事业发展重点的变化。作出这一重大判断的基本依据是',o:['我国已经消灭了贫困','我国已经建成社会主义现代化强国','我国社会主要矛盾的发展变化','我国已不是发展中国家'],a:2,e:'社会主要矛盾的变化是关系全局的历史性变化，作出这一判断的基本依据是我国社会主要矛盾的发展变化。'},
  {u:2,s:'2023·湖南长沙·中考真题',q:'进入新时代，我国社会主要矛盾发生了变化，但我国仍处于并将长期处于社会主义初级阶段的基本国情没有变。这要求我们',o:['可以立即实现共同富裕','不再需要改革开放','可以放松经济建设','要牢牢把握社会主义初级阶段这个基本国情，始终坚持党的基本路线'],a:3,e:'社会主要矛盾变化没有改变我国社会主义所处历史阶段的判断，必须牢牢把握基本国情，坚持党的基本路线。'},
  {u:2,s:'2025·山东·中考真题',q:'“我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。”这两个“没有变”表明',o:['我国发展仍面临不少困难和挑战，必须坚持党的基本路线','我国不需要再发展经济','我国已实现社会主义现代化','我国社会主要矛盾没有变化'],a:0,e:'两个“没有变”说明我国发展仍面临不少困难，必须牢牢立足社会主义初级阶段这个最大实际，坚持党的基本路线。'},
  {u:2,s:'2024·浙江·中考真题',q:'中国共产党的基本路线是领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。其中“一个中心”指的是',o:['以改革开放为中心','以经济建设为中心','以四项基本原则为中心','以共同富裕为中心'],a:1,e:'党的基本路线中“一个中心”指以经济建设为中心，“两个基本点”指坚持四项基本原则、坚持改革开放。'},
  {u:2,s:'2023·湖北武汉·中考真题',q:'强调我国仍处于社会主义初级阶段这一基本国情，其意义在于',o:['否认改革开放的作用','表明我国已进入发达国家行列','为制定路线方针政策提供根本依据','说明我国发展毫无成就'],a:2,e:'正确认识我国所处历史阶段，是制定和执行正确路线方针政策的根本依据。'},
  {u:2,s:'2025·四川·中考真题',q:'进入新时代，我国社会主要矛盾的变化意味着',o:['人民的所有需求都能立即满足','我国已实现社会主义现代化','我国已不再需要发展生产力','我们要更加重视发展的质量和效益，着力解决发展不平衡不充分问题'],a:3,e:'社会主要矛盾变化要求我们更加重视发展质量和效益，着力解决发展不平衡不充分问题。'},
  /* ---- 第5课 新时代的思想旗帜 ---- */
  {u:2,s:'2023·甘肃定西·中考真题',q:'在中国特色社会主义新时代，马克思主义中国化时代化的集中体现是',o:['习近平新时代中国特色社会主义思想','邓小平理论','“三个代表”重要思想','科学发展观'],a:0,e:'习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是新时代马克思主义中国化时代化的集中体现。'},
  {u:2,s:'2024·福建·中考真题',q:'习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义。确立这一思想为指导思想的会议是',o:['党的十八大','党的十九大','党的二十大','党的十七大'],a:1,e:'党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并写入党章。'},
  {u:2,s:'2023·辽宁·中考真题',q:'党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并载入党章。这说明',o:['该思想取代了一切其他理论','该思想不需要在实践中发展','该思想是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南','该思想只适用于经济领域'],a:2,e:'习近平新时代中国特色社会主义思想是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南，必须长期坚持并不断发展。'},
  {u:2,s:'2025·广东·中考真题',q:'习近平新时代中国特色社会主义思想是系统科学的理论体系，必须长期坚持并不断发展。这要求我们',o:['照搬照抄，不需创新','只在口头上学习','仅由领导干部学习即可','把它作为行动指南，并在实践中不断丰富发展'],a:3,e:'科学理论必须在实践中检验并不断发展，既要坚持又要发展。'},
  {u:2,s:'2024·河南·中考真题',q:'某校开展“学习新思想，做好接班人”主题活动，同学们通过演讲、手抄报等形式学习习近平新时代中国特色社会主义思想。这有助于青少年',o:['提高理论素养，坚定理想信念','替代学校的思想政治课程','掌握所有国家大政方针细节','立即成为理论专家'],a:0,e:'学习习近平新时代中国特色社会主义思想有助于青少年提高理论素养、坚定理想信念、明确奋斗方向。'},
  {u:2,s:'2023·江苏·中考真题',q:'习近平新时代中国特色社会主义思想是党和人民实践经验和集体智慧的结晶。这一思想',o:['已不能再发展','是中国特色社会主义理论体系的重要组成部分','与马克思主义没有关系','只总结了中国古代的经验'],a:1,e:'习近平新时代中国特色社会主义思想是中国特色社会主义理论体系的重要组成部分，是马克思主义中国化时代化的最新成果。'},
  {u:2,s:'2025·浙江·中考真题',q:'习近平新时代中国特色社会主义思想的核心内容可以概括为“十个明确”“十四个坚持”“十三个方面成就”。其中“十四个坚持”是',o:['公民的基本权利和义务','国家机关的组织原则','新时代坚持和发展中国特色社会主义的基本方略','我国的基本经济制度'],a:2,e:'“十四个坚持”是新时代坚持和发展中国特色社会主义的基本方略。'},
  /* ---- 第6课 中国腾飞谱新篇 ---- */
  {u:2,s:'2025·河北·中考真题',q:'令人振奋的2024年，全年经济社会发展主要目标任务顺利完成，高质量发展扎实推进，新质生产力稳步发展，我国经济实力、科技实力、综合国力持续增强。这些成就表明',o:['我国是世界上最大的发展中国家','我国已基本实现社会主义现代化','我国积极参与全球经济规则制定','中国式现代化迈出新的坚实步伐'],a:3,e:'材料列举高质量发展、新质生产力等成就，体现中国式现代化迈出新的坚实步伐；我国尚未基本实现社会主义现代化（目标为2035年）。'},
  {u:2,s:'2024·黑龙江绥化·中考真题',q:'一双鞋的“旅行”：德国设计外观和功能→中国研究生产流程→东南亚一些国家生产出来→美国货船运往沙特出售。这体现的是',o:['经济全球化','社会信息化','文化多样性','世界两极化'],a:0,e:'商品生产在全球范围内完成、贸易在全球范围内进行，是经济全球化的表现。'},
  {u:2,s:'2023·湖南长沙·中考真题',q:'改革开放以来，我国经济实力大幅跃升，成为世界第二大经济体、第一大工业国、第一大货物贸易国。这些成就的取得，根本原因在于',o:['国际社会的大力援助','开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系','我国人口众多，市场广阔','我国资源丰富，地大物博'],a:1,e:'改革开放以来我国取得一切成绩和进步的根本原因，归结起来就是开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系。'},
  {u:2,s:'2024·湖北·中考真题',q:'我国高铁运营里程、5G基站数量、新能源汽车产销量等多项指标位居世界第一。这些成就',o:['表明我国已进入发达国家行列','表明我国已建成社会主义现代化强国','是我国综合国力显著增强的重要体现','说明我国已不再需要发展'],a:2,e:'高铁、5G、新能源汽车等领域的领先成就，是我国综合国力显著增强的重要体现。'},
  {u:2,s:'2025·北京·中考真题',q:'新质生产力是创新起主导作用，摆脱传统经济增长方式、生产力发展路径，具有高科技、高效能、高质量特征的先进生产力质态。发展新质生产力，有利于',o:['单纯追求经济高速增长','减少科技创新投入','扩大传统落后产能','推动高质量发展'],a:3,e:'发展新质生产力有利于推动经济高质量发展，实现由高速增长向高质量发展转变。'},
  {u:2,s:'2023·广东·中考真题',q:'共建“一带一路”倡议提出以来，中国已与150多个国家、30多个国际组织签署合作文件。这',o:['体现了中国与世界各国分享发展机遇、共享发展成果','说明中国只与发展中国家合作','表明中国已放弃独立自主','表明中国主导世界经济发展'],a:0,e:'共建“一带一路”体现了中国与世界各国分享发展机遇、共享发展成果，致力于共同建设一个繁荣的世界。'},
  {u:2,s:'2024·山东·中考真题',q:'我国科技创新成果不断涌现，北斗导航、探月工程、深海探测等取得重大突破。这些成就的取得，得益于我国',o:['减少科研经费投入','坚持创新驱动发展战略','完全依赖国外技术引进','放弃基础科学研究'],a:1,e:'我国实施创新驱动发展战略，坚持自主创新，取得了一系列重大科技成就。'},
  {u:2,s:'2023·四川成都·中考真题',q:'从“中国制造”到“中国创造”，我国经济正在向高质量发展阶段迈进。实现高质量发展，必须',o:['继续走高投入高消耗的老路','放弃对外开放','完整、准确、全面贯彻新发展理念','单纯追求GDP增长速度'],a:2,e:'实现高质量发展必须完整、准确、全面贯彻创新、协调、绿色、开放、共享的新发展理念。'},
  {u:2,s:'2025·江苏·中考真题',q:'2024年，我国国内生产总值超过130万亿元，粮食产量首次突破1.4万亿斤。这些数据说明',o:['我国已实现社会主义现代化','我国社会主要矛盾已经解决','我国已成为发达国家','我国综合国力和粮食安全保障能力进一步增强'],a:3,e:'经济总量增长与粮食增产，说明我国综合国力和粮食安全保障能力进一步增强。'},
  {u:2,s:'2024·福建·中考真题',q:'进入新时代，我国在经济、政治、文化、社会、生态文明建设等各方面都取得了巨大成就。这些成就的取得，最根本的是',o:['坚持中国共产党的领导','依靠外国援助','依靠少数人的努力','靠天时地利'],a:0,e:'进入新时代我国取得的一切成就，最根本的是坚持中国共产党的领导。'},
  {u:2,s:'2023·湖北·中考真题',q:'我国脱贫攻坚战取得全面胜利，历史性地解决了绝对贫困问题。这一成就',o:['说明农村问题已彻底解决','是中国共产党坚持以人民为中心的重要体现','说明我国已实现全面小康社会的所有目标','表明我国已不存在贫困现象'],a:1,e:'脱贫攻坚战取得全面胜利，是中国共产党坚持以人民为中心的发展思想、全心全意为人民服务的重要体现。'},
  {u:2,s:'2025·天津·中考真题',q:'下列不属于新时代我国发展成就的是',o:['脱贫攻坚战取得全面胜利','高铁、5G、航天科技快速突破','1949年新中国成立，实现民族独立','生态文明建设成效显著'],a:2,e:'1949年新中国成立属于新民主主义革命时期的成就，新时代指2012年党的十八大以来。'},
  {u:2,s:'2024·贵州·中考真题',q:'“奋进新时代”主题成就展展示了我国近十年的发展成就。举办这一展览的意义在于',o:['说明我国发展已不存在问题','表明我国已实现中国梦','向外国展示我国实力以获取援助','增强民族自信心和自豪感，激励人们接续奋斗'],a:3,e:'展示新时代发展成就，有利于增强民族自信心和自豪感，激励人们为实现中华民族伟大复兴接续奋斗。'},
  {u:2,s:'2023·黑龙江·中考真题',q:'我国是世界第二大经济体，但人均国内生产总值仍低于发达国家水平。这说明',o:['我国仍是世界上最大的发展中国家','我国经济实力很弱','我国已建成发达国家','我国发展毫无优势'],a:0,e:'经济总量居世界第二但人均水平仍不高，说明我国仍是世界上最大的发展中国家。'},
  {u:2,s:'2025·重庆·中考真题',q:'中国特色社会主义进入新时代，我国发展站在新的历史方位上。准确把握这一历史方位，有利于',o:['低估我国发展面临的困难','明确发展目标，制定正确的路线方针政策','否认我国取得的巨大成就','放弃社会主义初级阶段的基本路线'],a:1,e:'准确把握新的历史方位，有助于明确发展目标、制定正确的路线方针政策，既看到成就也看到挑战。'},
  {u:2,s:'2024·山西·中考真题',q:'我国社会主要矛盾的变化是关系全局的历史性变化。解决这一主要矛盾，必须',o:['减少对民生的投入','只注重经济发展速度','大力提升发展质量和效益，更好满足人民多方面需要','降低发展速度'],a:2,e:'解决社会主要矛盾，必须大力提升发展质量和效益，更好满足人民在经济、政治、文化、社会、生态等方面日益增长的需要。'},

  /* ==================== 第三单元 擘画宏伟蓝图 ==================== */
  /* ---- 第7课 擘画宏伟蓝图 ---- */
  {u:3,s:'2024·内蒙古·中考真题',q:'对下面图片内容解读正确的是（图示：第一个百年目标——全面建成小康社会；第二个百年目标分两个阶段：2035年基本实现社会主义现代化，本世纪中叶建成社会主义现代化强国）',o:['第二个百年是指中国共产党成立100年','第二个阶段的奋斗目标是基本实现现代化','第一个阶段是把我国建设成为社会主义现代化强国','第二个百年是指新中国成立100年'],a:3,e:'第二个百年奋斗目标指到新中国成立100年时把我国建成富强民主文明和谐美丽的社会主义现代化强国；2035年基本实现社会主义现代化。'},
  {u:3,s:'2023·湖北襄阳·中考真题',q:'复兴梦想，次第绽放。下列我国经济社会发展目标，按照先后顺序排列正确的是',o:['解决温饱→总体小康→全面小康→基本实现现代化','总体小康→解决温饱→基本实现现代化→全面小康','总体小康→全面小康→基本实现现代化→解决温饱','解决温饱→全面小康→总体小康→基本实现现代化'],a:0,e:'我国经济社会发展目标依次为：解决温饱→总体小康→全面小康→基本实现现代化→建成社会主义现代化强国。'},
  {u:3,s:'2025·江苏镇江·中考真题',q:'“两个一百年”奋斗目标中，第一个百年奋斗目标已经实现，这就是',o:['实现共同富裕','全面建成小康社会','基本实现社会主义现代化','建成社会主义现代化强国'],a:1,e:'到中国共产党成立100年时全面建成小康社会，是第一个百年奋斗目标，已经实现。'},
  {u:3,s:'2024·河北·中考真题',q:'到2035年，我国发展的目标包括',o:['实现中华民族伟大复兴','全面建成小康社会','基本实现社会主义现代化','建成社会主义现代化强国'],a:2,e:'2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，基本实现社会主义现代化。'},
  {u:3,s:'2025·四川成都·中考真题',q:'下列不属于中国式现代化特征的是',o:['人与自然和谐共生的现代化','物质文明和精神文明相协调的现代化','人口规模巨大的现代化','全体人民同步富裕的现代化'],a:3,e:'中国式现代化是全体人民共同富裕的现代化，“同步富裕”表述错误，共同富裕不是同步富裕、同等富裕。'},
  {u:3,s:'2023·云南·中考真题',q:'中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的中国特色。中国式现代化的本质要求包括坚持中国共产党领导、坚持中国特色社会主义等。这体现了中国式现代化',o:['既有现代化共同特征，又具有鲜明的中国特色','与西方现代化毫无区别','不需要党的领导','完全照搬西方现代化模式'],a:0,e:'中国式现代化既有各国现代化的共同特征，更有基于自己国情的中国特色。'},
  {u:3,s:'2024·湖北·中考真题',q:'“两步走”战略安排中，从2020年到2035年，在全面建成小康社会的基础上，再奋斗十五年，',o:['实现全体人民同步富裕','基本实现社会主义现代化','建成社会主义现代化强国','实现共产主义'],a:1,e:'“两步走”：第一步，2020年到2035年基本实现社会主义现代化；第二步，2035年到本世纪中叶建成社会主义现代化强国。'},
  {u:3,s:'2025·安徽·中考真题',q:'中国式现代化是走和平发展道路的现代化。这',o:['表明我国不参与国际事务','表明我国放弃国防建设','与西方一些国家通过战争、殖民、掠夺等方式实现现代化有本质区别','说明我国不需要发展经济'],a:2,e:'中国式现代化是走和平发展道路的现代化，与西方一些国家通过战争、殖民、掠夺实现现代化有本质区别。'},
  {u:3,s:'2023·山东·中考真题',q:'从“四个现代化”到“中国式现代化”，中国共产党不断深化对现代化建设规律的认识。这说明',o:['现代化内涵一成不变','中国共产党照搬外国经验','我国已实现现代化','党的认识在实践中不断深化发展'],a:3,e:'从“四个现代化”到“中国式现代化”，体现了党对现代化建设规律认识的不断深化和发展。'},
  {u:3,s:'2024·福建·中考真题',q:'中国式现代化是人口规模巨大的现代化。这一特征要求我们',o:['在推进现代化过程中必须立足我国人口众多的基本国情','控制人口总量为首要任务','放弃以人为本','照搬小国发展经验'],a:0,e:'中国式现代化是人口规模巨大的现代化，必须立足我国人口众多的基本国情谋划发展。'},
  {u:3,s:'2025·山东·中考真题',q:'中国式现代化是物质文明和精神文明相协调的现代化。对此理解正确的是',o:['物质文明与精神文明相互对立','既要物质富足，也要精神富有','只要经济发展，不必重视文化','只重视精神文明建设'],a:1,e:'中国式现代化是物质文明和精神文明相协调的现代化，既要物质富足、也要精神富有。'},
  {u:3,s:'2023·江苏·中考真题',q:'全面建设社会主义现代化国家，必须坚持中国特色社会主义道路。这是因为中国特色社会主义道路',o:['与社会主义没有关系','已经过时','是实现社会主义现代化、创造人民美好生活的必由之路','是照抄西方的发展道路'],a:2,e:'中国特色社会主义道路是实现社会主义现代化、创造人民美好生活的必由之路。'},
  {u:3,s:'2024·湖南·中考真题',q:'中国式现代化是人与自然和谐共生的现代化。这要求我们',o:['以牺牲环境为代价发展经济','停止一切工业活动','放弃经济发展','坚持绿色发展，建设美丽中国'],a:3,e:'中国式现代化是人与自然和谐共生的现代化，要求坚持绿色发展，建设美丽中国。'},
  /* ---- 第8课 实现高质量发展 ---- */
  {u:3,s:'2025·四川成都·中考真题',q:'下列关于高质量发展的说法错误的是',o:['高质量发展等同于单纯追求经济增长速度','高质量发展是现代化建设的首要任务','完整、准确、全面贯彻新发展理念','构建国内国际双循环相互促进的新发展格局'],a:0,e:'高质量发展兼顾质量、生态、民生，不追求单纯的高速增长，“等同于追求增长速度”表述错误。'},
  {u:3,s:'2024·广东·中考真题',q:'新发展理念的内容是',o:['爱国、敬业、诚信、友善','创新、协调、绿色、开放、共享','富强、民主、文明、和谐','自由、平等、公正、法治'],a:1,e:'新发展理念是创新、协调、绿色、开放、共享；B项为国家层面价值目标，C项为社会层面，D项为公民个人层面。'},
  {u:3,s:'2023·浙江·中考真题',q:'构建新发展格局，要以国内大循环为主体、国内国际双循环相互促进。这',o:['表明我国只依靠国内市场','表明我国实行闭关锁国政策','体现了我国把发展的立足点放在自身力量上，同时坚持对外开放','说明我国不再需要对外贸易'],a:2,e:'构建新发展格局，要以国内大循环为主体，同时坚持对外开放，实现国内国际双循环相互促进。'},
  {u:3,s:'2025·湖南·中考真题',q:'推进高质量发展，必须坚持质量第一、效益优先。这要求我们',o:['单纯扩大生产规模','继续走高投入高消耗老路','降低产品标准','推动经济发展质量变革、效率变革、动力变革'],a:3,e:'推进高质量发展，必须坚持质量第一、效益优先，推动经济发展质量变革、效率变革、动力变革。'},
  {u:3,s:'2024·山东·中考真题',q:'某地关停高污染企业，发展绿色产业和生态旅游，实现了经济发展与环境保护双赢。该地的做法',o:['践行了绿色发展理念，有利于高质量发展','影响了当地经济发展','说明环境保护比经济发展更重要','违背了以经济建设为中心'],a:0,e:'关停高污染企业、发展绿色产业，践行了绿色发展理念，实现了经济效益与生态效益的统一。'},
  {u:3,s:'2023·河南·中考真题',q:'创新是引领发展的第一动力。下列举措中，最能体现这一要求的是',o:['降低产品质量标准','加大科研投入，突破关键核心技术','扩大低端产品生产规模','增加原材料出口'],a:1,e:'加大科研投入、突破关键核心技术，体现了创新是引领发展的第一动力。'},
  {u:3,s:'2025·广西·中考真题',q:'实施乡村振兴战略，有利于',o:['把人口都集中到城市','减少农业投入','促进城乡协调发展，实现共同富裕','扩大城乡差距'],a:2,e:'实施乡村振兴战略有利于缩小城乡差距、促进城乡协调发展，朝着共同富裕方向前进。'},
  {u:3,s:'2024·江西·中考真题',q:'共享发展理念强调发展为了人民、发展依靠人民、发展成果由人民共享。下列做法最能体现共享发展理念的是',o:['只提高城市居民收入','取消社会福利','减少教育投入','完善社会保障体系，让发展成果惠及全体人民'],a:3,e:'完善社会保障体系、让发展成果惠及全体人民，是共享发展理念的具体体现。'},
  {u:3,s:'2023·陕西·中考真题',q:'我国经济已由高速增长阶段转向高质量发展阶段。这一转变',o:['要求我们更加注重经济发展的质量和效益','意味着经济发展速度不再重要','表明我国经济已无增长空间','说明我国放弃发展经济'],a:0,e:'由高速增长转向高质量发展，要求更加注重经济发展的质量和效益，而非单纯追求速度。'},
  {u:3,s:'2025·江苏·中考真题',q:'发展新质生产力是推动高质量发展的内在要求和重要着力点。发展新质生产力，必须',o:['放弃自主创新','加强科技创新，特别是原创性、颠覆性科技创新','减少科研投入','依靠传统落后产能'],a:1,e:'发展新质生产力必须加强科技创新，特别是原创性、颠覆性科技创新，加快实现高水平科技自立自强。'},
  {u:3,s:'2024·北京·中考真题',q:'协调发展注重解决的是',o:['人与自然和谐问题','发展内外联动问题','发展不平衡问题','发展动力问题'],a:2,e:'协调发展注重解决发展不平衡问题；创新发展解决发展动力问题，绿色发展解决人与自然和谐问题，开放发展解决发展内外联动问题。'},
  {u:3,s:'2023·辽宁·中考真题',q:'我国坚持对外开放的基本国策，以开放促改革、促发展。这体现了新发展理念中的',o:['共享发展','绿色发展','协调发展','开放发展'],a:3,e:'坚持对外开放、以开放促改革促发展，体现开放发展理念。'},
  {u:3,s:'2025·湖北·中考真题',q:'建设现代化经济体系，需要把发展经济的着力点放在',o:['实体经济上','虚拟经济上','金融投机上','房地产炒作上'],a:0,e:'建设现代化经济体系，必须把发展经济的着力点放在实体经济上。'},
  {u:3,s:'2024·云南·中考真题',q:'“绿水青山就是金山银山”的理念，体现了',o:['以环境换发展的理念','绿色发展理念，强调人与自然和谐共生','只顾经济发展的理念','先污染后治理的理念'],a:1,e:'“绿水青山就是金山银山”体现了绿色发展理念，强调人与自然和谐共生。'},
  {u:3,s:'2023·安徽·中考真题',q:'推动高质量发展，要加快建设科技强国、质量强国、制造强国等。这些举措的共同目的是',o:['降低产品价格','减少国际竞争','增强我国经济创新力和竞争力','扩大生产规模'],a:2,e:'建设科技强国、质量强国、制造强国等，共同目的是增强我国经济创新力和竞争力。'},
  {u:3,s:'2025·福建·中考真题',q:'我国经济发展面临需求收缩、供给冲击、预期转弱三重压力。应对这些压力，必须',o:['放慢一切发展步伐','放弃经济结构调整','减少对外开放','坚持稳中求进，推动高质量发展'],a:3,e:'面对三重压力，必须坚持稳中求进工作总基调，完整准确全面贯彻新发展理念，推动高质量发展。'},
  {u:3,s:'2024·江苏镇江·中考真题',q:'某企业通过技术改造，将能耗降低了30%，产品附加值提高了一倍。该企业的做法',o:['体现了高质量发展要求，实现了提质增效','增加了生产成本，不可取','说明技术改造没有意义','违背了经济效益原则'],a:0,e:'通过技术改造降低能耗、提高附加值，实现了提质增效，符合高质量发展要求。'},
  {u:3,s:'2023·山西·中考真题',q:'“十四五”规划纲要提出，要加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局。这是',o:['仅限于经济领域的短期安排','根据我国发展阶段、环境、条件变化作出的战略选择','应对国际压力的临时措施','放弃对外开放的信号'],a:1,e:'构建新发展格局，是根据我国发展阶段、环境、条件变化，重塑我国国际合作和竞争新优势的战略抉择。'},
  {u:3,s:'2025·黑龙江·中考真题',q:'实现高质量发展，必须坚持和完善社会主义基本经济制度。下列属于我国社会主义基本经济制度的是',o:['单一的私有制经济','完全的计划经济','公有制为主体、多种所有制经济共同发展','只有公有制经济'],a:2,e:'公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制，是我国社会主义基本经济制度。'},
  {u:3,s:'2024·吉林·中考真题',q:'建设美丽中国，要践行绿色低碳生活方式。下列行为符合这一要求的是',o:['大量使用一次性餐具','长时间开启空调','随意丢弃废旧电池','垃圾分类、绿色出行、节约用水用电'],a:3,e:'垃圾分类、绿色出行、节约水电等行为体现了绿色低碳的生活方式。'},
  {u:3,s:'2023·黑龙江绥化·中考真题',q:'“中国式现代化是全体人民共同富裕的现代化。”对“共同富裕”理解正确的是',o:['共同富裕是全体人民的富裕，但不是一个同步富裕的过程','共同富裕就是同等富裕','共同富裕要求同时富裕','共同富裕意味着一律平均'],a:0,e:'共同富裕是全体人民的富裕，是人民群众物质生活和精神生活都富裕，但共同富裕不是同步富裕、不是同等富裕、不是平均主义。'},
  {u:3,s:'2025·辽宁·中考真题',q:'我国已经把碳达峰碳中和纳入生态文明建设整体布局。实现“双碳”目标，需要',o:['减少森林面积','推动能源结构调整，发展清洁能源','继续大量使用煤炭','放弃工业发展'],a:1,e:'实现碳达峰碳中和目标，需要推动能源结构调整、发展清洁能源、提高能源利用效率。'},

  /* ==================== 第四单元 和谐与梦想 ==================== */
  /* ---- 第9课 凝聚团结伟力 ---- */
  {u:4,s:'2024·内蒙古赤峰·中考真题',q:'民族团结是我国各族人民的生命线，做好新时代党的民族工作的主线是',o:['相互依存，休戚与共','反对一切形式的民族分裂活动','铸牢中华民族共同体意识','你中有我，我中有你，谁也离不开谁'],a:2,e:'铸牢中华民族共同体意识是新时代党的民族工作的主线。'},
  {u:4,s:'2024·内蒙古赤峰·中考真题',q:'在团结统一的祖国大家庭里，各民族既和睦相处、和衷共济、和谐发展，又各得其所、各尽所能、各展所长。在此基础上形成的社会主义新型民族关系是',o:['手足相亲、守望相助','共同发展、共同繁荣','自知、自强、发展、共享','平等、团结、互助、和谐'],a:3,e:'我国社会主义新型民族关系是平等、团结、互助、和谐。'},
  {u:4,s:'2024·内蒙古赤峰·中考真题',q:'五千年来，我国各民族在交往交流交融中，共同培育了伟大的民族精神。伟大民族精神的核心是',o:['爱国主义','以礼待人','诚实守信','改革创新'],a:0,e:'中华民族精神的核心是爱国主义；改革创新是时代精神的核心。'},
  {u:4,s:'2024·内蒙古赤峰·中考真题',q:'习近平总书记强调，要像爱护自己的眼睛一样爱护民族团结，像石榴籽那样紧紧抱在一起。加强和巩固民族团结的原因有（①加强和巩固民族团结、维护祖国统一是中华民族的最高利益 ②维护和促进民族团结只是国家机关及其工作人员的职责 ③各民族在数千年的交往中孕育了团结友爱的宝贵传统 ④加强和巩固民族团结能够促进伟大祖国繁荣发展）',o:['①②④','①③④','②③④','①②③'],a:1,e:'②错误，维护民族团结是每个公民的义务，不只是国家机关及其工作人员的职责；①③④均正确。'},
  {u:4,s:'2024·江苏盐城·中考真题',q:'2023年，新疆地区经济持续发展，中央财政支持力度加大。这反映出我国坚持',o:['民族区域自治的政治制度','各民族一律平等的原则','各民族共同繁荣的方针','大杂居、小聚居的分布格局'],a:2,e:'中央财政支持民族地区经济发展，体现我国坚持各民族共同繁荣的方针。'},
  {u:4,s:'2023·西藏·中考真题',q:'我国实行民族区域自治制度。这一制度',o:['意味着少数民族地区可以独立','否定了国家的统一领导','只在经济领域适用','是我国的一项基本政治制度，有利于保障少数民族人民当家作主'],a:3,e:'民族区域自治制度是我国的一项基本政治制度，在国家统一领导下，保障少数民族人民当家作主的权利。'},
  {u:4,s:'2025·广西·中考真题',q:'铸牢中华民族共同体意识，要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。这要求我们',o:['增进对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同','只强调本民族的利益','忽视各民族交往交流交融','取消民族区域自治'],a:0,e:'铸牢中华民族共同体意识，要不断增进各族人民对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同。'},
  {u:4,s:'2024·新疆·中考真题',q:'我国处理民族关系的基本原则是',o:['平等、团结、互助、和谐','民族平等、民族团结、各民族共同繁荣','民族自治、民族独立、民族分离','大杂居、小聚居、交错杂居'],a:1,e:'我国处理民族关系的基本原则是民族平等、民族团结、各民族共同繁荣；D项是社会主义新型民族关系。'},
  {u:4,s:'2023·宁夏·中考真题',q:'各族人民只有铸牢中华民族共同体意识，像石榴籽一样紧紧抱在一起，手足相亲、守望相助、齐心奋斗，伟大的祖国才能繁荣发展。这说明',o:['民族团结只需要少数民族努力','民族问题已经不存在','民族团结是社会发展进步的基石','各民族可以各自独立发展'],a:2,e:'民族团结是我国各族人民的生命线，是社会发展进步的基石，需要各族人民共同维护。'},
  {u:4,s:'2025·云南·中考真题',q:'实现祖国完全统一，是全体中华儿女的共同愿望。解决台湾问题的基本方针是',o:['武力解决','完全自治','两个中国','“和平统一、一国两制”'],a:3,e:'解决台湾问题的基本方针是“和平统一、一国两制”，坚持一个中国原则是两岸关系的政治基础。'},
  {u:4,s:'2024·福建·中考真题',q:'“一国两制”是中国特色社会主义的伟大创举。香港、澳门回归以来保持繁荣稳定，充分证明',o:['“一国两制”方针是完全正确的，具有强大生命力','香港、澳门可以独立','“一国两制”只适用于香港','国家统一问题已全部解决'],a:0,e:'香港、澳门回归以来保持繁荣稳定，充分证明“一国两制”方针是完全正确的，具有强大生命力。'},
  {u:4,s:'2023·湖南·中考真题',q:'维护国家统一，反对民族分裂，是每个公民的责任。下列做法正确的是',o:['隐瞒发现的危害国家安全线索','自觉履行维护国家统一的义务，同分裂行为作斗争','在网络上传播分裂言论','参加非法集会'],a:1,e:'维护国家统一、反对民族分裂是每个公民的法定义务，应自觉履行并同分裂行为作斗争。'},
  {u:4,s:'2025·贵州·中考真题',q:'某社区开展“民族团结一家亲”联谊活动，各族群众一起包饺子、跳民族舞、聊家常。这类活动',o:['只对少数民族有意义','会加剧民族差异','有利于增进各民族之间的了解和感情，促进民族团结','没有必要，浪费资源'],a:2,e:'开展民族团结联谊活动，有利于增进各民族之间的了解和感情，促进各民族交往交流交融。'},
  {u:4,s:'2024·青海·中考真题',q:'加强民族团结进步教育，要引导青少年',o:['只关注本民族的文化','拒绝与其他民族交往','坚持民族优越论','树立正确的国家观、民族观、历史观、文化观'],a:3,e:'加强民族团结进步教育，要引导青少年树立正确的国家观、民族观、历史观、文化观。'},
  /* ---- 第10课 实现伟大梦想 ---- */
  {u:4,s:'2024·黑龙江绥化·中考真题',q:'实现中华民族伟大复兴的中国梦，必须凝聚全国各族人民大团结的力量，这就是',o:['中国力量','中国道路','中国精神','中国方案'],a:0,e:'实现中国梦必须凝聚中国力量，中国力量就是全国各族人民大团结的力量。'},
  {u:4,s:'2023·辽宁·中考真题',q:'敢于有梦，没有什么山峰不能攀登；勇于追梦，没有什么急流不能横渡。实现中国梦就是要实现（①国家富强 ②民族振兴 ③人民幸福 ④世界统一）',o:['②③④','①②③','①②④','①③④'],a:1,e:'实现中国梦就是要实现国家富强、民族振兴、人民幸福。'},
  {u:4,s:'2024·内蒙古呼和浩特·中考真题',q:'实现中国梦，就是要实现国家富强、民族振兴、人民幸福。由此可见（①中国梦也是世界人民的梦 ②实现中国梦需要国家高速发展经济 ③中国梦也是每个国人的梦 ④实现中国梦要求我们促进民族团结）',o:['①③','②④','③④','①②'],a:2,e:'中国梦是国家的梦、民族的梦，也是每个国人的梦；实现中国梦要求促进民族团结。②中“高速发展”错误，应为高质量发展。'},
  {u:4,s:'2023·湖北十堰·中考真题',q:'实现中国梦，必须弘扬中国精神。中国精神就是',o:['以改革创新为核心的民族精神','以艰苦奋斗为核心的时代精神','以团结协作为核心的民族精神','以爱国主义为核心的民族精神和以改革创新为核心的时代精神'],a:3,e:'中国精神就是以爱国主义为核心的民族精神和以改革创新为核心的时代精神。'},
  {u:4,s:'2024·黑龙江牡丹江·中考真题',q:'中国的电动车“三蹦子”在国外街头爆火。新闻媒体称，“不起眼”的国货站上国际C位，提醒人们重新打量身边优秀国货的新价值。这告诉我们',o:['要对国家发展有信心','要发展只能坚持中国制造','生活中所有物品都要用国货','中国制造世界最好'],a:0,e:'国货受到国际认可，说明应增强对国家发展的信心和民族自豪感；A、C、D均表述绝对化。'},
  {u:4,s:'2023·辽宁锦州·中考真题',q:'一个国家、一个民族对自身文化价值的充分肯定，是对自身文化生命力的坚定信念，是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。这指的是',o:['制度自信','文化自信','道路自信','理论自信'],a:1,e:'对自身文化价值的充分肯定、对文化生命力的坚定信念，是文化自信的内涵。'},
  {u:4,s:'2025·安徽·中考真题',q:'实现中华民族伟大复兴的中国梦，必须走中国道路。中国道路就是',o:['照搬苏联模式的道路','传统封建社会的道路','中国特色社会主义道路','西方资本主义道路'],a:2,e:'实现中国梦必须走中国道路，即中国特色社会主义道路。'},
  {u:4,s:'2023·湖北襄阳·中考真题',q:'共圆中国梦，需要我们（①走中国道路 ②弘扬中国精神 ③凝聚中国力量 ④主导世界格局）',o:['①②④','①③④','②③④','①②③'],a:3,e:'实现中国梦必须走中国道路、弘扬中国精神、凝聚中国力量；④“主导世界格局”错误，我国不谋求霸权。'},
  {u:4,s:'2024·甘肃临夏·中考真题',q:'实现中国梦必须弘扬中国精神。中华民族精神具有与时俱进的品格，在不同的历史时期有着不同的表现。这说明中华民族精神',o:['随着时代进步而不断丰富和发展','一成不变','只存在于古代','与时代无关'],a:0,e:'中华民族精神具有与时俱进的品格，在不同历史时期有不同表现，并随时代进步不断丰富和发展。'},
  {u:4,s:'2025·江西·中考真题',q:'“我们都是追梦人”，这句话激励着亿万人民为梦想而奋斗。青少年做追梦人，应当',o:['放弃学业去创业','把个人理想融入国家和民族的伟大梦想之中，努力学习、勇于实践','只关注个人利益','等待机遇从天而降'],a:1,e:'青少年应把个人理想融入国家和民族的伟大梦想之中，努力学习、勇于实践，在奋斗中实现人生价值。'},
  {u:4,s:'2023·山东·中考真题',q:'今天的中国，比历史上任何时期都更接近、更有信心和能力实现中华民族伟大复兴的目标。这',o:['意味着可以放松努力','意味着中国梦即将自动实现','表明实现中国梦需要全体人民继续奋斗','说明我国已实现中国梦'],a:2,e:'更接近目标不等于自动实现，实现中国梦需要全体中国人民继续艰苦奋斗、不懈努力。'},
  {u:4,s:'2024·湖南·中考真题',q:'“四个自信”是指',o:['经济自信、政治自信、文化自信、军事自信','个人自信、集体自信、民族自信、国家自信','理论自信、实践自信、创新自信、发展自信','道路自信、理论自信、制度自信、文化自信'],a:3,e:'“四个自信”即道路自信、理论自信、制度自信、文化自信。'},
  {u:4,s:'2025·山东·中考真题',q:'从“解决温饱”到“全面小康”，再到“基本实现现代化”，我国经济社会发展目标的接续推进，说明',o:['实现中华民族伟大复兴是一个长期的历史过程，需要一代代人接续奋斗','我国发展没有规划','目标可以随意调整','我国已实现现代化'],a:0,e:'经济社会发展目标接续推进，说明实现中华民族伟大复兴是一个长期历史过程，需要一代代人接续奋斗。'},
  {u:4,s:'2023·四川·中考真题',q:'某校开展“我的中国梦”主题教育活动，同学们纷纷表示要为民族复兴贡献力量。这一活动',o:['会耽误学习时间','有利于引导青少年树立远大理想，增强责任担当意识','与青少年学习无关','只是形式主义'],a:1,e:'开展“我的中国梦”主题教育活动，有利于引导青少年树立远大理想、增强责任担当意识。'},
  {u:4,s:'2024·湖北·中考真题',q:'实现中华民族伟大复兴的中国梦，必须紧紧依靠人民，不断为人民造福。这表明',o:['人民与中国梦无关','实现中国梦不需要人民参与','人民是历史的创造者，是梦想的实现者','中国梦只依靠少数人实现'],a:2,e:'人民是历史的创造者，是梦想的实现者；实现中国梦必须紧紧依靠人民。'},
  {u:4,s:'2025·浙江·中考真题',q:'习近平总书记指出，中华民族伟大复兴的中国梦终将在一代代青年的接力奋斗中变为现实。这要求青年学生',o:['只关注眼前利益','等待他人创造未来','放弃个人奋斗','坚定理想信念，志存高远，脚踏实地，勇做时代的弄潮儿'],a:3,e:'青年学生应坚定理想信念，志存高远、脚踏实地，勇做时代的弄潮儿，在实现中国梦的生动实践中放飞青春梦想。'},
  {u:4,s:'2023·北京·中考真题',q:'“中国梦是民族的梦，也是每个中国人的梦。”对此理解正确的是',o:['国家好，民族好，大家才会好','个人梦想与国家梦想相互对立','只要实现个人梦想，国家梦想就能实现','国家梦想与个人梦想无关'],a:0,e:'中国梦是国家的梦、民族的梦，也是每个中国人的梦；国家好、民族好，大家才会好。'},
  {u:4,s:'2024·天津·中考真题',q:'实现中华民族伟大复兴，必须凝聚中国力量。中国力量就是',o:['科技的力量','全国各族人民大团结的力量','军队的力量','经济的力量'],a:1,e:'中国力量就是全国各族人民大团结的力量。'},
  {u:4,s:'2025·湖北·中考真题',q:'经过全党全国各族人民持续奋斗，我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会。这一成就',o:['表明我国已建成社会主义现代化强国','说明我国已不存在发展问题','为实现中华民族伟大复兴奠定了坚实基础','意味着中国梦已经实现'],a:2,e:'全面建成小康社会，为实现中华民族伟大复兴奠定了坚实基础。'},
  {u:4,s:'2024·陕西·中考真题',q:'中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题：实现中华民族伟大复兴。这说明',o:['党的工作没有主题','中国梦是最近才提出的','民族复兴与人民无关','实现中华民族伟大复兴是近代以来中华民族最伟大的梦想'],a:3,e:'实现中华民族伟大复兴是近代以来中华民族最伟大的梦想，是中国共产党团结带领人民奋斗的主题。'},
  {u:4,s:'2023·河南·中考真题',q:'“我们都是追梦人，我们都在努力奔跑。”作为新时代青少年，追逐梦想应该',o:['既胸怀理想又脚踏实地，用奋斗书写青春','好高骛远，不切实际','只说不做','依赖他人帮助'],a:0,e:'追逐梦想既要胸怀理想又要脚踏实地，通过不懈奋斗书写青春篇章。'},
  {u:4,s:'2025·山西·中考真题',q:'实现中国梦，必须弘扬中国精神、凝聚中国力量、走中国道路。三者之间的关系是',o:['只有凝聚中国力量最重要','相互联系、相互支撑，共同为实现中国梦提供保障','彼此独立、互不相干','只有走中国道路最重要'],a:1,e:'走中国道路、弘扬中国精神、凝聚中国力量，三者相互联系、相互支撑，共同为实现中国梦提供保障。'},
  {u:4,s:'2024·甘肃·中考真题',q:'实现中国梦必须走中国道路。坚持走中国道路，就要',o:['回到计划经济时代','放弃改革开放','坚持中国特色社会主义，不走封闭僵化的老路，不走改旗易帜的邪路','照搬西方政治制度'],a:2,e:'坚持走中国道路，就要坚持中国特色社会主义，既不走封闭僵化的老路，也不走改旗易帜的邪路。'},
  {u:4,s:'2023·江苏·中考真题',q:'某班开展“梦想与奋斗”主题班会，同学们分享了自己的梦想。下列观点正确的是',o:['梦想靠运气实现','梦想一旦确定就不能调整','梦想只属于成功人士','梦想的实现需要付出艰辛努力，需要长期坚持'],a:3,e:'梦想的实现需要付出艰辛努力和长期坚持，奋斗是青春最亮丽的底色。'},
  {u:4,s:'2025·广东·中考真题',q:'实现中华民族伟大复兴的中国梦，需要每一个中国人把个人梦融入国家梦、民族梦。这是因为',o:['个人前途与国家命运紧密相连','个人梦想比国家梦想重要','国家梦想可以脱离个人梦想','个人梦想与国家梦想互不影响'],a:0,e:'个人前途与国家命运紧密相连，把个人梦融入国家梦、民族梦，才能汇聚起实现中国梦的磅礴力量。'},

  /* ---- 第一单元 补充 ---- */
  {u:1,s:'2023·江苏无锡·中考真题',q:'中国共产党自成立之日起，就把为人民谋幸福、为民族谋复兴作为自己的初心使命。这体现了中国共产党的',o:['纪律要求','性质与宗旨','执政方式','组织原则'],a:1,e:'为中国人民谋幸福、为中华民族谋复兴的初心使命，体现了中国共产党作为工人阶级先锋队的性质和全心全意为人民服务的根本宗旨。'},
  {u:1,s:'2025·福建·中考真题',q:'某地暴雨引发洪涝灾害，基层党组织迅速组织党员突击队转移受灾群众。这体现了',o:['基层党组织可以替代政府部门职能','救援工作与经济无关','基层党组织发挥了战斗堡垒作用和党员先锋模范作用','只有党员才需要参与救援'],a:2,e:'基层党组织在危急时刻迅速行动，发挥着战斗堡垒作用，党员发挥了先锋模范作用。'},
  {u:1,s:'2024·广西·中考真题',q:'“人民”二字在中国共产党人心中位置最高、分量最重。下列做法与这一观点相符的是',o:['为追求政绩搞形象工程','忽视群众合理诉求','缩减民生领域财政支出','推进城镇老旧小区改造，改善居民居住条件'],a:3,e:'推进老旧小区改造、改善居民居住条件，把群众利益放在首位，符合以人民为中心的要求。'},
  {u:1,s:'2023·山东青岛·中考真题',q:'中国共产党的领导是中国特色社会主义最本质的特征。下列认识正确的是',o:['党的领导是中国特色社会主义制度的最大优势','党的领导是对其他政治力量的替代','党的领导意味着党直接经营所有企业','党的领导只体现在政治生活中'],a:0,e:'中国共产党领导是中国特色社会主义最本质的特征，是中国特色社会主义制度的最大优势。'},
  {u:1,s:'2025·江苏·中考真题',q:'弘扬伟大建党精神，就要做到对党忠诚、不负人民。对“不负人民”理解正确的是',o:['人民的要求可以不予理会','始终把人民利益放在首位，全心全意为人民服务','只满足少数人的利益','以个人利益为重'],a:1,e:'“不负人民”要求始终把人民利益放在首位，践行全心全意为人民服务的根本宗旨。'},
  {u:1,s:'2024·湖南·中考真题',q:'百年党史，就是一部践行初心使命的不懈奋斗史。中国共产党的初心和使命，其落脚点是',o:['提高执政地位','增加财政收入','实现人民幸福和民族复兴','单纯扩大组织规模'],a:2,e:'中国共产党人的初心和使命就是为中国人民谋幸福、为中华民族谋复兴。'},
  {u:1,s:'2023·四川·中考真题',q:'“不驰于空想、不骛于虚声”，中国共产党坚持把人民对美好生活的向往作为奋斗目标，脚踏实地为民办实事。这启示我们，坚持党的领导必须',o:['只停留在口头上','追求形式主义','搞政绩工程','落实到实际行动中，体现在具体工作上'],a:3,e:'坚持党的全面领导必须体现在实际行动中，不能停留在口号上，要切实为民办实事。'},
  {u:4,s:'2021·黑龙江·中考真题',q:'伟大中华民族精神的核心是（　　）',o:['改革创新','爱国主义','勤劳勇敢','自强不息'],a:1,e:'中华民族精神的核心是爱国主义，改革创新是时代精神的核心。'},
  {u:1,s:'2025·河北·中考真题',q:'新时代坚持和发展中国特色社会主义，必须坚持党的全面领导。这是因为',o:['党的领导是权宜之计','党的领导是党和国家的根本所在、命脉所在','党的领导可以解决一切问题','其他组织不需要发挥作用'],a:1,e:'中国共产党领导是党和国家的根本所在、命脉所在，是全国各族人民的利益所系、命运所系。'},
  {u:1,s:'2024·安徽·中考真题',q:'党是领导一切的。这里的“一切”，不包括',o:['政治建设','文化建设','违背宪法法律的活动','经济建设'],a:2,e:'党领导一切工作，但党必须在宪法和法律范围内活动，坚持依法执政；党的活动本身不能违背宪法法律。'},
  {u:1,s:'2023·江西·中考真题',q:'“赶考”永远在路上。中国共产党始终保持自我革命的清醒，不断推进全面从严治党。这',o:['说明党存在严重问题','意味着要削弱党的领导','只是阶段性要求','有利于保持党的先进性和纯洁性'],a:3,e:'推进全面从严治党有利于保持党的先进性和纯洁性，增强党的凝聚力和战斗力。'},
  {u:1,s:'2025·云南·中考真题',q:'一百多年前，中国共产党的先驱们创建了中国共产党，形成了伟大建党精神。伟大建党精神是',o:['中国共产党的精神之源','中国革命的全部内容','只能体现在革命年代','与新时代无关'],a:0,e:'伟大建党精神是中国共产党的精神之源，跨越时空、历久弥新，在新时代依然具有重要价值。'},

  /* ---- 第二单元 补充 ---- */
  {u:2,s:'2023·江苏·中考真题',q:'进入新时代，我国社会主要矛盾的变化没有改变我们对我国社会主义所处历史阶段的判断。我国仍处于',o:['资本主义阶段','社会主义初级阶段','发达的社会主义阶段','共产主义高级阶段'],a:1,e:'我国社会主要矛盾的变化，没有改变我们对我国社会主义所处历史阶段的判断，我国仍处于并将长期处于社会主义初级阶段。'},
  {u:2,s:'2024·重庆·中考真题',q:'我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这一矛盾中，“不平衡不充分的发展”主要表现为（①区域发展差距 ②城乡发展差距 ③收入分配差距 ④发展质量和效益还不高）',o:['①②④','①③④','①②③④','①②③'],a:2,e:'发展不平衡不充分主要表现为区域差距、城乡差距、收入分配差距，以及发展质量和效益不高、创新能力不够强等方面。'},
  {u:2,s:'2025·浙江·中考真题',q:'解决新时代我国社会主要矛盾，必须坚持以经济建设为中心，大力发展生产力。这是因为',o:['只要发展经济就能解决所有问题','经济建设可以代替其他建设','发展速度越快越好','发展是解决我国一切问题的基础和关键'],a:3,e:'发展是解决我国一切问题的基础和关键，必须坚持以经济建设为中心，大力提升发展质量和效益。'},
  {u:2,s:'2023·湖北·中考真题',q:'习近平新时代中国特色社会主义思想是马克思主义中国化时代化的最新成果。这一判断的依据是',o:['它科学回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题','它只总结了中国古代思想','它与其他理论毫无关系','它是封闭的理论体系'],a:0,e:'习近平新时代中国特色社会主义思想科学回答了新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义等重大时代课题。'},
  {u:2,s:'2024·山东·中考真题',q:'确立习近平新时代中国特色社会主义思想的指导地位，是党的十九大的重大历史性贡献。这一思想',o:['不具有实践指导意义','是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南','只适用于理论工作者','只适用于经济工作'],a:1,e:'习近平新时代中国特色社会主义思想是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南。'},
  {u:2,s:'2025·四川·中考真题',q:'习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义。对其理解错误的是',o:['它是中国特色社会主义理论体系的重要组成部分','它是党和人民实践经验和集体智慧的结晶','它已经完成了理论创新，不再需要发展','它是马克思主义中国化时代化的最新成果'],a:2,e:'任何科学理论都需要在实践中不断发展，习近平新时代中国特色社会主义思想同样需要在实践中不断丰富发展。'},
  {u:2,s:'2023·河南·中考真题',q:'“十四个坚持”是新时代坚持和发展中国特色社会主义的基本方略。下列不属于“十四个坚持”内容的是',o:['坚持党对一切工作的领导','坚持以人民为中心','坚持全面深化改革','坚持个人利益至上'],a:3,e:'“十四个坚持”包括坚持党对一切工作的领导、坚持以人民为中心、坚持全面深化改革等，不包括“坚持个人利益至上”。'},
  {u:2,s:'2024·湖北·中考真题',q:'进入新时代，我国经济社会发展取得历史性成就、发生历史性变革。这些成就被称为“历史性”是因为',o:['其影响深远、意义重大，对党和国家事业发展具有全局性影响','成就数量多','持续时间长','涉及领域广'],a:0,e:'“历史性成就、历史性变革”指成就在党和国家事业发展中具有全局性、根本性、长远性影响，意义深远。'},
  {u:2,s:'2025·湖南·中考真题',q:'我国经济已由高速增长阶段转向高质量发展阶段。这一判断',o:['意味着要放慢一切发展','是对我国经济发展阶段的科学把握','说明我国经济不再增长','表明我国经济发展遇到根本困难'],a:1,e:'这一判断是对我国经济发展阶段的科学把握，是适应我国发展条件变化作出的正确选择。'},
  {u:2,s:'2023·山西·中考真题',q:'从“有没有”转向“好不好”，从“量的扩张”转向“质的提升”，我国经济发展呈现新特征。这表明',o:['我国经济已无发展空间','要放弃经济增长','高质量发展成为新时代经济发展的鲜明主题','经济发展不再重要'],a:2,e:'从“有没有”到“好不好”、从量到质的转变，表明高质量发展已成为新时代经济发展的鲜明主题。'},
  {u:2,s:'2024·甘肃·中考真题',q:'我国建成世界上规模最大的社会保障体系、医疗卫生体系、教育体系。这些成就',o:['只是数字上的成果','与人民生活无关','说明我国已解决所有民生问题','体现了以人民为中心的发展思想，增进了民生福祉'],a:3,e:'建成世界规模最大的社会保障、医疗、教育体系，体现了以人民为中心的发展思想，切实增进了民生福祉。'},
  {u:2,s:'2025·黑龙江·中考真题',q:'我国科技创新实现重大突破，进入创新型国家行列。这得益于我国坚持',o:['科教兴国战略、人才强国战略、创新驱动发展战略','只依靠技术引进','减少教育投入','放弃自主创新'],a:0,e:'我国深入实施科教兴国战略、人才强国战略、创新驱动发展战略，科技创新取得重大突破。'},
  {u:2,s:'2023·福建·中考真题',q:'我国坚持总体国家安全观，着力构建大安全格局。这是因为',o:['国际环境已经和缓','国家安全是安邦定国的重要基石','国家安全与个人无关','只要经济安全就够了'],a:1,e:'国家安全是安邦定国的重要基石，维护国家安全是全国各族人民根本利益所在。'},
  {u:2,s:'2024·四川·中考真题',q:'某国外企业将研发中心设在中国，与我国企业共同开发新技术。这表明',o:['外国企业必须在中国投资','技术合作没有意义','经济全球化使各国经济联系日益紧密','我国已主导世界经济'],a:2,e:'跨国技术合作表明经济全球化使各国经济相互联系、相互依赖程度不断加深。'},
  {u:2,s:'2025·江苏苏州·中考真题',q:'近年来我国数字经济规模持续扩大，成为经济发展的重要引擎。发展数字经济',o:['与实体经济无关','会取代所有传统产业','不需要技术创新','有利于推动经济高质量发展，培育发展新动能'],a:3,e:'发展数字经济有利于推动经济高质量发展、培育发展新动能，推动数字技术与实体经济深度融合。'},
  {u:2,s:'2023·广东·中考真题',q:'我国区域发展战略深入推进，京津冀协同发展、长江经济带发展等取得明显成效。实施这些战略',o:['有利于促进区域协调发展，缩小区域发展差距','会加剧区域差距','只对发达地区有利','与共同富裕无关'],a:0,e:'实施区域协调发展战略，有利于促进区域协调发展、缩小区域发展差距，朝着共同富裕方向前进。'},
  {u:2,s:'2024·贵州·中考真题',q:'“绿水青山就是金山银山”，我国生态环境质量明显改善。这一变化说明',o:['可以不再重视环保','我国坚持绿色发展，生态文明建设成效显著','经济发展与环境保护无法兼顾','环境问题已完全解决'],a:1,e:'生态环境质量明显改善，说明我国坚持绿水青山就是金山银山理念，生态文明建设取得显著成效。'},
  {u:2,s:'2025·天津·中考真题',q:'习近平新时代中国特色社会主义思想是系统科学的理论体系。“系统科学”体现在',o:['它篇幅很长','它只讲理论不讲实践','它贯通马克思主义哲学、政治经济学、科学社会主义，涵盖改革发展稳定、内政外交国防、治党治国治军各领域','它只涉及经济问题'],a:2,e:'这一思想贯通马克思主义哲学、政治经济学、科学社会主义，涵盖改革发展稳定、内政外交国防、治党治国治军等各领域各方面，是一个系统科学的理论体系。'},
  {u:2,s:'2023·广西·中考真题',q:'我国坚持对外开放基本国策，连续举办进博会、服贸会等国际展会。这体现了',o:['我国只做出口不做进口','对外开放只对发达国家','我国已不需要外资','我国坚定不移扩大对外开放，与各国共享发展机遇'],a:3,e:'举办进博会、服贸会等国际展会，体现我国坚定不移扩大对外开放，与世界各国共享发展机遇。'},

  /* ---- 第三单元 补充 ---- */
  {u:3,s:'2023·湖北·中考真题',q:'中国式现代化是中国共产党领导的社会主义现代化。这一性质决定了中国式现代化',o:['必须坚持中国共产党领导，坚持中国特色社会主义','可以照搬西方模式','与社会主义制度无关','不需要人民参与'],a:0,e:'中国式现代化是中国共产党领导的社会主义现代化，这决定了它必须坚持党的领导、坚持中国特色社会主义道路。'},
  {u:3,s:'2024·山东青岛·中考真题',q:'到本世纪中叶，我国要建成富强民主文明和谐美丽的社会主义现代化强国。这一目标',o:['与2035年目标完全相同','是第二个百年奋斗目标','是第一个百年奋斗目标','已经实现'],a:1,e:'到本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，是第二个百年奋斗目标。'},
  {u:3,s:'2025·河南·中考真题',q:'实现社会主义现代化，必须坚持和完善中国特色社会主义制度。这是因为',o:['只要经济发展就够了','制度可以随意变更','制度优势是一个国家的最大优势，制度稳则国家稳','制度与现代化建设无关'],a:2,e:'制度优势是一个国家的最大优势，制度稳则国家稳；推进现代化建设必须充分发挥中国特色社会主义制度优势。'},
  {u:3,s:'2023·浙江·中考真题',q:'中国式现代化是全体人民共同富裕的现代化。扎实推进共同富裕，必须',o:['搞平均主义','限制高收入人群的合法收入','减少对困难群体的帮扶','在发展中保障和改善民生，逐步缩小收入分配差距'],a:3,e:'推进共同富裕必须在发展中保障和改善民生，构建初次分配、再分配、转移支付协调配套的制度体系，逐步缩小收入分配差距。'},
  {u:3,s:'2024·云南·中考真题',q:'新发展理念是一个整体，必须完整、准确、全面贯彻。其中，创新解决的是',o:['发展动力问题','发展不平衡问题','人与自然和谐问题','发展内外联动问题'],a:0,e:'创新解决发展动力问题，协调解决发展不平衡问题，绿色解决人与自然和谐问题，开放解决发展内外联动问题，共享解决社会公平正义问题。'},
  {u:3,s:'2025·江苏·中考真题',q:'推进高质量发展，要加快建设现代化产业体系。下列做法符合这一要求的是',o:['只发展第一产业','推动传统产业转型升级，培育战略性新兴产业','继续扩大高耗能产业','减少科技研发投入'],a:1,e:'推动传统产业转型升级、培育战略性新兴产业，是加快建设现代化产业体系的应有之举。'},
  {u:3,s:'2023·安徽·中考真题',q:'某县依托本地特色农产品发展深加工，带动农民增收致富。该县的做法',o:['会破坏生态环境','不利于经济发展','有利于发展特色产业，促进乡村振兴和农民增收','与高质量发展无关'],a:2,e:'依托本地特色资源发展深加工、带动农民增收，有利于发展特色产业、促进乡村振兴、实现共同富裕。'},
  {u:3,s:'2024·湖南·中考真题',q:'我国把创新摆在国家发展全局的核心位置。这是因为',o:['创新只与企业有关','创新成本太高','引进技术比自己创新更划算','创新是引领发展的第一动力，是建设现代化经济体系的战略支撑'],a:3,e:'创新是引领发展的第一动力，是建设现代化经济体系的战略支撑，必须把创新摆在国家发展全局的核心位置。'},
  {u:3,s:'2025·福建·中考真题',q:'实现高质量发展，必须处理好发展与保护的关系。下列认识正确的是',o:['保护生态环境就是保护生产力，改善生态环境就是发展生产力','经济发展必须以牺牲环境为代价','先发展后治理是必然规律','环境保护会阻碍经济发展'],a:0,e:'保护生态环境就是保护生产力，改善生态环境就是发展生产力；要坚持在发展中保护、在保护中发展。'},
  {u:3,s:'2023·黑龙江·中考真题',q:'“十四五”时期，我国经济社会发展要以推动高质量发展为主题。这一主题的确定',o:['只考虑经济因素','顺应了我国发展阶段、环境、条件的变化','是主观随意决定的','与国际环境无关'],a:1,e:'以推动高质量发展为主题，是顺应我国发展阶段、环境、条件变化作出的科学决策。'},
  {u:3,s:'2024·江西·中考真题',q:'我国实施扩大内需战略，着力扩大国内需求。这',o:['表明我国不再需要外贸','会降低经济效率','有利于构建以国内大循环为主体的新发展格局','说明我国放弃对外开放'],a:2,e:'实施扩大内需战略，有利于畅通国内大循环，构建以国内大循环为主体、国内国际双循环相互促进的新发展格局。'},
  {u:3,s:'2025·湖北·中考真题',q:'绿色发展注重解决人与自然和谐共生问题。下列做法符合绿色发展要求的是',o:['大量砍伐森林','随意排放工业废水','过度开采矿产资源','发展清洁能源，推进碳达峰碳中和'],a:3,e:'发展清洁能源、推进碳达峰碳中和，符合绿色发展理念，有利于实现人与自然和谐共生。'},
  {u:3,s:'2023·辽宁·中考真题',q:'我国坚持对外开放，推动贸易和投资自由化便利化。这体现了新发展理念中的',o:['开放发展','共享发展','协调发展','绿色发展'],a:0,e:'坚持对外开放、推动贸易和投资自由化便利化，体现开放发展理念。'},
  {u:3,s:'2024·湖北武汉·中考真题',q:'共建“一带一路”成为深受欢迎的国际公共产品和国际合作平台。这',o:['意味着一带一路只对中国有利','体现了我国坚持共商共建共享的全球治理观','表明我国追求霸权','说明我国只与发展中国家合作'],a:1,e:'共建“一带一路”坚持共商共建共享的全球治理观，践行人类命运共同体理念，成为深受欢迎的国际公共产品和国际合作平台。'},
  {u:3,s:'2025·甘肃·中考真题',q:'我国经济社会发展必须坚持稳中求进工作总基调。坚持“稳中求进”就要',o:['只求进，不稳','既不求稳也不求进','在保持经济社会大局稳定的前提下，推动各项工作取得新进展','只求稳，不进'],a:2,e:'“稳中求进”要求在保持经济社会大局稳定的前提下，积极进取，推动各项工作取得新进展新突破。'},
  {u:3,s:'2023·吉林·中考真题',q:'建设现代化经济体系，要大力发展实体经济。这是因为实体经济',o:['比虚拟经济更容易赚钱','不需要技术创新','不受市场影响','是一国经济的立身之本，是财富创造的根本源泉'],a:3,e:'实体经济是一国经济的立身之本，是财富创造的根本源泉，是国家强盛的重要支柱。'},
  {u:3,s:'2024·陕西·中考真题',q:'我国扎实推进乡村全面振兴，加快建设农业强国。这有利于',o:['保障国家粮食安全，促进农业农村现代化','减少农业人口','放弃农业','只发展城市'],a:0,e:'推进乡村全面振兴、建设农业强国，有利于保障国家粮食安全，促进农业农村现代化，实现城乡协调发展。'},

  /* ---- 第四单元 补充 ---- */
  {u:4,s:'2023·内蒙古·中考真题',q:'我国是统一的多民族国家，各民族在长期交往中形成了你中有我、我中有你的多元一体格局。这一格局',o:['只体现在文化领域','是中华民族共同体意识的历史基础','说明各民族可以彼此分离','与民族团结无关'],a:1,e:'各民族多元一体格局是中华民族共同体意识的历史基础，为铸牢中华民族共同体意识提供了深厚历史根基。'},
  {u:4,s:'2025·宁夏·中考真题',q:'我国大力支持民族地区经济发展，改善民族地区基础设施和公共服务。这',o:['只对少数民族有利','会扩大地区差距','有利于促进各民族共同繁荣发展','会加重国家财政负担，不值得'],a:2,e:'支持民族地区经济发展、改善基础设施和公共服务，有利于促进各民族共同繁荣发展，实现区域协调发展。'},
  {u:4,s:'2023·青海·中考真题',q:'维护民族团结，要坚决反对一切形式的民族分裂活动。这是因为民族分裂活动',o:['只是少数人的行为','不影响国家发展','只发生在个别地区','损害国家统一和民族团结，危害国家安全'],a:3,e:'民族分裂活动损害国家统一和民族团结，危害国家安全，必须坚决反对。'},
  {u:4,s:'2024·广西·中考真题',q:'各民族共同团结奋斗、共同繁荣发展，是我国民族工作的主题。贯彻这一主题，要',o:['加快民族地区发展，增进民族团结','只强调经济发展','忽视民族文化保护','减少对民族地区的支持'],a:0,e:'贯彻各民族共同团结奋斗、共同繁荣发展的主题，要加快民族地区发展，增进民族团结，保护和发展各民族文化。'},
  {u:4,s:'2025·西藏·中考真题',q:'青藏铁路、川藏铁路等重大工程的建设，极大地改善了民族地区发展条件。这些工程',o:['会破坏民族地区环境','体现了国家对民族地区发展的大力支持，促进了各民族共同繁荣','只是交通工程，与民族团结无关','只对当地经济有利'],a:1,e:'青藏铁路、川藏铁路等重大工程体现了国家对民族地区发展的大力支持，有力促进了各民族共同繁荣。'},
  {u:4,s:'2023·新疆·中考真题',q:'铸牢中华民族共同体意识，要引导各族群众增强“五个认同”。“五个认同”不包括',o:['对中华民族的认同','对中华文化的认同','对本民族利益的绝对维护','对伟大祖国的认同'],a:2,e:'“五个认同”指对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同，不包括“对本民族利益的绝对维护”。'},
  {u:4,s:'2024·云南·中考真题',q:'“一国两制”方针中，“一国”是前提和基础。坚持“一国”原则，就要',o:['允许香港澳门独立','放弃对特别行政区的管辖','否认国家统一的重要性','维护国家主权、安全、发展利益，坚持一个中国原则'],a:3,e:'“一国”是“两制”的前提和基础，必须维护国家主权、安全、发展利益，坚持一个中国原则。'},
  {u:4,s:'2025·福建·中考真题',q:'解决台湾问题，实现祖国完全统一，必须坚持一个中国原则。这是因为',o:['一个中国原则是两岸关系的政治基础','台湾问题与国际无关','两岸交流没有必要','和平统一已无可能'],a:0,e:'一个中国原则是两岸关系的政治基础，必须坚持“和平统一、一国两制”基本方针，推动两岸关系和平发展。'},
  {u:4,s:'2023·湖南·中考真题',q:'中国梦是历史的、现实的，也是未来的。今天我们比历史上任何时期都更有信心实现中国梦，根本在于',o:['资源丰富','中国共产党坚强领导，中国特色社会主义道路正确','国际环境有利','人口众多'],a:1,e:'更有信心实现中国梦，根本在于有中国共产党的坚强领导，有中国特色社会主义道路的正确指引。'},
  {u:4,s:'2024·四川·中考真题',q:'弘扬中国精神，就要弘扬以爱国主义为核心的民族精神和以改革创新为核心的时代精神。民族精神与时代精神的关系是',o:['民族精神比时代精神重要','时代精神比民族精神重要','两者相互联系，共同构成中国精神','两者相互对立'],a:2,e:'以爱国主义为核心的民族精神和以改革创新为核心的时代精神相辅相成、相互支撑，共同构成中国精神。'},
  {u:4,s:'2025·湖北武汉·中考真题',q:'实现中国梦，必须走中国道路。中国道路是',o:['照搬外国的发展道路','封闭僵化的老路','改旗易帜的邪路','实现社会主义现代化、创造人民美好生活的必由之路'],a:3,e:'中国道路就是中国特色社会主义道路，是实现社会主义现代化、创造人民美好生活的必由之路。'},
  {u:4,s:'2023·北京·中考真题',q:'青年兴则国家兴，青年强则国家强。中华民族伟大复兴的中国梦终将在一代代青年的接力奋斗中变为现实。这启示青年学生',o:['要把个人理想融入国家发展，勇于担当时代责任','等长大后再说','只关注个人前途','依赖国家安排'],a:0,e:'青年学生应把个人理想融入国家发展，勇于担当时代责任，在实现中国梦的实践中放飞青春梦想。'},
  {u:4,s:'2024·天津·中考真题',q:'“四个自信”中，更基础、更广泛、更深厚的自信是',o:['制度自信','文化自信','道路自信','理论自信'],a:1,e:'文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中更基本、更深沉、更持久的力量。'},
  {u:4,s:'2025·重庆·中考真题',q:'我国各民族在交往交流交融中共同创造了灿烂的中华文化。这表明',o:['各民族文化的差异应当消除','少数民族文化不重要','中华文化是各民族共同创造的，各民族都为中华文化发展作出了贡献','中华文化只由一个民族创造'],a:2,e:'中华文化是各民族在长期交往交流交融中共同创造的，各民族都为中华文化的发展作出了重要贡献。'},
  {u:4,s:'2023·甘肃·中考真题',q:'实现中国梦必须凝聚中国力量。下列做法有利于凝聚中国力量的是',o:['制造民族矛盾','削弱集体意识','鼓励各自为政','加强民族团结，巩固和发展最广泛的爱国统一战线'],a:3,e:'加强民族团结、巩固和发展最广泛的爱国统一战线，有利于凝聚起实现中国梦的磅礴力量。'},
  {u:4,s:'2024·江苏·中考真题',q:'某校组织学生参观“奋进新时代”主题成就展。这一活动有助于学生',o:['感受国家发展成就，增强民族自信心和自豪感','了解历史事件的全部细节','提高考试成绩','减轻课业负担'],a:0,e:'组织学生参观主题成就展，有助于学生感受国家发展成就，增强民族自信心和自豪感，激发爱国热情。'},
  {u:4,s:'2025·四川成都·中考真题',q:'实现中华民族伟大复兴，需要物质文明和精神文明协调发展。这是因为',o:['物质文明比精神文明重要','物质富足、精神富有是社会主义现代化的根本要求','只要经济发展就够了','精神文明可有可无'],a:1,e:'物质富足、精神富有是社会主义现代化的根本要求，实现民族复兴必须推动物质文明和精神文明协调发展。'},
  {u:4,s:'2023·云南·中考真题',q:'“功成不必在我，功成必定有我。”这句话启示我们，实现中国梦需要',o:['等待时机','追求个人名利','每个人都发扬主人翁精神，脚踏实地贡献力量','只靠少数英雄人物'],a:2,e:'“功成不必在我，功成必定有我”启示每个人都应发扬主人翁精神，脚踏实地为实现中国梦贡献力量。'},
  {u:1,s:'2024·黑龙江·中考真题',q:'中国共产党之所以能够历经百年而风华正茂、饱经磨难而生生不息，关键在于',o:['始终拥有最多的党员','始终掌握最先进的武器','始终处于和平环境','始终坚守初心使命，勇于自我革命'],a:3,e:'中国共产党始终坚守为中国人民谋幸福、为中华民族谋复兴的初心使命，勇于自我革命，因而能够历经百年而风华正茂。'}
];

</script>
<script>
/**
 * 道德与法治九年级上册 · 单机刷题（纯本地，无网络依赖）
 * ---------------------------------------------------------------
 * 功能：单元筛选 → 题量/顺序设置 → 即时判分与解析 → 答题卡跳题
 *      → 错题本（本地保存、可重刷、答对可移除）→ 成绩统计与历史记录
 * 数据全部存本机浏览器 localStorage，不上传任何服务器。
 */
const UNITS = [
  { id: 1, name: '百年大党风华正茂', lessons: '第1—3课' },
  { id: 2, name: '新的历史方位', lessons: '第4—6课' },
  { id: 3, name: '擘画宏伟蓝图', lessons: '第7—8课' },
  { id: 4, name: '和谐与梦想', lessons: '第9—10课' }
];
const CN = '一二三四';
const KEYS = ['A', 'B', 'C', 'D'];
const LS_WRONG = 'df_wrong_v1';
const LS_HIST = 'df_history_v1';

const S = {
  view: 'setup',            // setup | quiz | result | wrong
  units: [1, 2, 3, 4],
  size: 20,                 // 10 | 20 | 30 | 50 | all
  random: true,
  shuffleOpts: true,
  queue: [],
  cur: 0,
  picks: [],
  judge: [],
  startTs: 0,
  lastResult: null,
  wrongOnly: false
};

/* ---------------- 存储 ---------------- */
function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 空间不足等忽略 */ }
}
function getWrong() { return readJSON(LS_WRONG, {}); }
function setWrong(w) { writeJSON(LS_WRONG, w); }
function getHist() { return readJSON(LS_HIST, []); }
function qkey(q) { return q.q.slice(0, 24) + '#' + q.u; }

/* ---------------- 工具 ---------------- */
const $ = (sel) => document.querySelector(sel);
function esc(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function unitName(u) {
  const it = UNITS.filter((x) => x.id === u)[0];
  return it ? '第' + CN[u - 1] + '单元 · ' + it.name : '第' + u + '单元';
}
function isReal(q) { return !/改编|原创/.test(q.s); }
function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? m + '分' + s + '秒' : s + '秒';
}
function today() {
  const d = new Date();
  const p = (n) => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------------- 组卷 ---------------- */
function buildQueue(poolIdx) {
  const pool = poolIdx.map((qi) => {
    const ord = S.shuffleOpts ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
    return { qi, ord, ans: ord.indexOf(QUESTIONS[qi].a) };
  });
  if (S.random) return shuffle(pool);
  return pool;
}

function startQuiz() {
  const idx = [];
  QUESTIONS.forEach((q, i) => { if (S.units.indexOf(q.u) >= 0) idx.push(i); });
  if (!idx.length) { alert('请至少选择一个单元'); return; }
  let queue = buildQueue(idx);
  if (S.size !== 'all') {
    if (!S.random) {
      const ordered = idx.map((qi) => {
        const ord = S.shuffleOpts ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
        return { qi, ord, ans: ord.indexOf(QUESTIONS[qi].a) };
      });
      queue = ordered.slice(0, Number(S.size));
    } else {
      queue = queue.slice(0, Number(S.size));
    }
  }
  S.queue = queue;
  S.cur = 0;
  S.picks = queue.map(() => -1);
  S.judge = queue.map(() => false);
  S.startTs = Date.now();
  S.wrongOnly = false;
  S.view = 'quiz';
  render();
}

function startWrongOnly() {
  const wrong = getWrong();
  const idx = [];
  QUESTIONS.forEach((q, i) => { if (wrong[qkey(q)]) idx.push(i); });
  if (!idx.length) { alert('错题本是空的，先去刷题吧'); return; }
  S.queue = buildQueue(idx);
  S.cur = 0;
  S.picks = S.queue.map(() => -1);
  S.judge = S.queue.map(() => false);
  S.startTs = Date.now();
  S.wrongOnly = true;
  S.view = 'quiz';
  render();
}

/* ---------------- 判分 ---------------- */
function pick(displayIdx) {
  const item = S.queue[S.cur];
  if (S.judge[S.cur]) return;
  S.picks[S.cur] = displayIdx;
  S.judge[S.cur] = true;
  const q = QUESTIONS[item.qi];
  const right = displayIdx === item.ans;
  const wrong = getWrong();
  const k = qkey(q);
  if (right) {
    if (S.wrongOnly && wrong[k]) { delete wrong[k]; setWrong(wrong); }   // 错题已掌握 → 移出
  } else {
    wrong[k] = {
      u: q.u, s: q.s, q: q.q, o: q.o, a: q.a, e: q.e,
      cnt: (wrong[k] ? wrong[k].cnt : 0) + 1, ts: Date.now()
    };
    setWrong(wrong);
  }
  render();
}

function go(delta) {
  const n = S.cur + delta;
  if (n < 0 || n >= S.queue.length) return;
  S.cur = n;
  render();
}
function jump(i) { S.cur = i; render(); }

function finish() {
  const answered = S.judge.filter(Boolean).length;
  let right = 0;
  const perUnit = {};
  S.queue.forEach((item, i) => {
    const q = QUESTIONS[item.qi];
    if (!perUnit[q.u]) perUnit[q.u] = { total: 0, right: 0 };
    perUnit[q.u].total++;
    if (S.judge[i] && S.picks[i] === item.ans) { right++; perUnit[q.u].right++; }
  });
  const secs = Math.max(1, Math.round((Date.now() - S.startTs) / 1000));
  S.lastResult = { total: S.queue.length, answered, right, secs, perUnit, ts: Date.now() };
  const hist = getHist();
  hist.unshift({ ts: Date.now(), time: today(), total: S.queue.length, right, secs, wrongOnly: S.wrongOnly });
  writeJSON(LS_HIST, hist.slice(0, 30));
  S.view = 'result';
  render();
}

/* ---------------- 渲染 ---------------- */
function render() {
  const app = $('#app');
  if (S.view === 'setup') app.innerHTML = viewSetup();
  else if (S.view === 'quiz') app.innerHTML = viewQuiz();
  else if (S.view === 'result') app.innerHTML = viewResult();
  else if (S.view === 'wrong') app.innerHTML = viewWrong();
  window.scrollTo(0, S.view === 'quiz' ? 0 : window.scrollY);
  if (S.view === 'quiz') {
    const el = $('#sheetCard');
    if (el) el.dataset.n = S.queue.length;
  }
  const pct = $('#progFill');
  if (pct) pct.style.width = (S.queue.length ? Math.round((S.cur + 1) / S.queue.length * 100) : 0) + '%';
}

function viewSetup() {
  const counts = {};
  QUESTIONS.forEach((q) => { counts[q.u] = (counts[q.u] || 0) + 1; });
  const realCount = QUESTIONS.filter(isReal).length;
  const wrongN = Object.keys(getWrong()).length;
  const hist = getHist();
  const unitHtml = UNITS.map((u) => {
    const on = S.units.indexOf(u.id) >= 0 ? ' on' : '';
    return '<div class="unit-chip' + on + '" data-u="' + u.id + '">' +
      '<span>第' + CN[u.id - 1] + '单元 ' + esc(u.name) + '</span>' +
      '<span class="n">' + counts[u.id] + '题 · ' + u.lessons + '</span></div>';
  }).join('');

  const sizeHtml = [10, 20, 30, 50, 'all'].map((s) =>
    '<button class="' + (String(S.size) === String(s) ? 'on' : '') + '" data-size="' + s + '">' +
    (s === 'all' ? '全部' : s + '题') + '</button>').join('');
  const orderHtml = '<button class="' + (S.random ? 'on' : '') + '" data-order="random">随机</button>' +
    '<button class="' + (!S.random ? 'on' : '') + '" data-order="seq">按顺序</button>';
  const optHtml = '<button class="' + (S.shuffleOpts ? 'on' : '') + '" data-opt="shuffle">随机打乱</button>' +
    '<button class="' + (!S.shuffleOpts ? 'on' : '') + '" data-opt="keep">固定 A-D</button>';

  const histHtml = hist.length ? hist.slice(0, 8).map((h) =>
    '<tr><td>' + esc(h.time) + '</td><td>' + (h.wrongOnly ? '错题重刷' : '常规') + '</td>' +
    '<td class="num">' + h.right + ' / ' + h.total + '</td>' +
    '<td class="num">' + Math.round(h.right / h.total * 100) + '%</td>' +
    '<td class="num">' + fmtTime(h.secs) + '</td></tr>').join('')
    : '<tr><td colspan="5" class="empty">还没有记录，开刷后会自动保存</td></tr>';

  return '' +
    '<div class="card">' +
    '  <h2>题库范围</h2>' +
    '  <div class="sub">统编版《道德与法治》九年级上册（R版）· 4 个单元 10 课 · 共 ' + QUESTIONS.length + ' 题（中考真题 ' + realCount + ' 题，改编 ' + (QUESTIONS.length - realCount) + ' 题）</div>' +
    '  <div class="units">' + unitHtml + '</div>' +
    '  <div class="row"><span class="label">快速选择</span>' +
    '    <button class="btn sm" id="allUnits">全选</button>' +
    '    <button class="btn sm" id="noneUnits">全不选</button>' +
    '    <button class="btn sm" id="only12">党的领导与新时代(一~二单元)</button>' +
    '  </div>' +
    '  <div class="row"><span class="label">本轮题量</span><div class="seg">' + sizeHtml + '</div></div>' +
    '  <div class="row"><span class="label">出题顺序</span><div class="seg">' + orderHtml + '</div></div>' +
    '  <div class="row"><span class="label">选项顺序</span><div class="seg">' + optHtml + '</div></div>' +
    '  <div class="row" style="margin-top:16px">' +
    '    <button class="btn primary" id="start" style="flex:1;padding:12px">开始刷题</button>' +
    '    <button class="btn" id="wrongBook">错题本' + (wrongN ? '（' + wrongN + '）' : '') + '</button>' +
    '    <button class="btn" id="wrongStart"' + (wrongN ? '' : ' disabled') + '>刷错题</button>' +
    '  </div>' +
    '  <div class="hint">提示：答题时可用键盘 A / B / C / D 选择，← → 切换题目。数据只保存在本机浏览器。</div>' +
    '</div>' +
    '<div class="card">' +
    '  <h2>历史成绩</h2>' +
    '  <div class="sub">最近 8 次（最多保留 30 次）</div>' +
    '  <table><thead><tr><th>时间</th><th>类型</th><th class="num">答对</th><th class="num">正确率</th><th class="num">用时</th></tr></thead>' +
    '  <tbody>' + histHtml + '</tbody></table>' +
    (hist.length ? '  <div class="row" style="margin-top:12px"><button class="btn sm danger" id="clearHist">清空历史成绩</button></div>' : '') +
    '</div>';
}

function viewQuiz() {
  const item = S.queue[S.cur];
  const q = QUESTIONS[item.qi];
  const judged = S.judge[S.cur];
  const picked = S.picks[S.cur];
  const rightN = S.judge.filter((j, i) => j && S.picks[i] === S.queue[i].ans).length;
  const wrongN = S.judge.filter((j, i) => j && S.picks[i] !== S.queue[i].ans).length;

  const optsHtml = item.ord.map((origIdx, disp) => {
    let cls = 'opt';
    if (judged) {
      cls += ' locked';
      if (disp === item.ans) cls += ' right';
      else if (disp === picked) cls += ' wrong';
    } else if (disp === picked) cls += ' picked';
    return '<button class="' + cls + '" data-pick="' + disp + '">' +
      '<span class="key">' + KEYS[disp] + '</span><span>' + esc(q.o[origIdx]) + '</span></button>';
  }).join('');

  let explain = '';
  if (judged) {
    const ok = picked === item.ans;
    explain = '<div class="explain"><div class="verdict ' + (ok ? 'ok' : 'bad') + '">' +
      (ok ? '✓ 答对了' : '✗ 答错了，正确答案是 ' + KEYS[item.ans]) + '</div>' +
      '<b>解析：</b>' + esc(q.e) + '</div>';
  }

  const sheetHtml = S.queue.map((it, i) => {
    let cls = '';
    if (S.judge[i]) cls = S.picks[i] === it.ans ? 'right' : 'wrong';
    if (i === S.cur) cls += ' cur';
    return '<button class="' + cls + '" data-jump="' + i + '">' + (i + 1) + '</button>';
  }).join('');

  return '' +
    '<div class="card">' +
    '  <div class="qmeta">' +
    '    <span class="tag unit">' + esc(unitName(q.u)) + '</span>' +
    '    <span class="tag src">' + esc(q.s) + '</span>' +
    (S.wrongOnly ? '<span class="tag wrong">错题重刷</span>' : '') +
    '    <span class="spacer" style="flex:1"></span>' +
    '    <span class="tag">第 ' + (S.cur + 1) + ' / ' + S.queue.length + ' 题</span>' +
    '  </div>' +
    '  <div class="qtext">' + esc(q.q) + '</div>' +
    '  <div class="opts">' + optsHtml + '</div>' +
    explain +
    '  <div class="bar"><i id="progFill"></i></div>' +
    '  <div class="stats"><span>已答 <b>' + (rightN + wrongN) + '</b></span><span>答对 <b style="color:var(--ok)">' + rightN + '</b></span>' +
    '  <span>答错 <b style="color:var(--bad)">' + wrongN + '</b></span></div>' +
    '  <div class="row" style="margin-top:14px">' +
    '    <button class="btn" id="prev"' + (S.cur === 0 ? ' disabled' : '') + '>← 上一题</button>' +
    '    <button class="btn primary" id="next" style="flex:1">' + (S.cur === S.queue.length - 1 ? '完成并看成绩' : '下一题 →') + '</button>' +
    '    <button class="btn ghost" id="quit">退出</button>' +
    '  </div>' +
    '</div>' +
    '<div class="card" id="sheetCard">' +
    '  <h2>答题卡</h2><div class="sub">绿色=答对，红色=答错，点击题号可跳转</div>' +
    '  <div class="sheet">' + sheetHtml + '</div>' +
    '</div>';
}

function viewResult() {
  const r = S.lastResult;
  if (!r) return '<div class="card empty">暂无成绩</div>';
  const rate = Math.round(r.right / r.total * 100);
  const desc = rate >= 90 ? '非常好，考点掌握扎实！' : rate >= 75 ? '不错，个别考点再巩固一下' : rate >= 60 ? '基本过关，错题要重刷' : '基础还不牢，建议回背记本对应单元再读一遍';
  const unitRows = Object.keys(r.perUnit).sort((a, b) => a - b).map((u) => {
    const d = r.perUnit[u];
    const p = Math.round(d.right / d.total * 100);
    return '<tr><td>' + esc(unitName(Number(u))) + '</td>' +
      '<td class="num">' + d.right + ' / ' + d.total + '</td>' +
      '<td class="num">' + p + '%</td>' +
      '<td><div class="mini-bar"><i style="width:' + p + '%;background:' + (p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)') + '"></i></div></td></tr>';
  }).join('');

  const wrongList = S.queue.map((it, i) => ({ it, i })).filter((x) => S.judge[x.i] && S.picks[x.i] !== x.it.ans);
  const wrongHtml = wrongList.length ? wrongList.map((x) => {
    const q = QUESTIONS[x.it.qi];
    return '<div class="wrong-item"><div class="q">' + esc(q.q) + '</div>' +
      '<div class="a">你选了 <span class="bad">' + KEYS[S.picks[x.i]] + '. ' + esc(q.o[x.it.ord[S.picks[x.i]]]) + '</span>；' +
      '正确答案 <span class="ok">' + KEYS[x.it.ans] + '. ' + esc(q.o[q.a]) + '</span></div>' +
      '<div class="a" style="margin-top:4px">解析：' + esc(q.e) + '</div></div>';
  }).join('') : '<div class="empty">全对，太强了！</div>';

  return '' +
    '<div class="card"><div class="score">' +
    '  <div class="big">' + r.right + '<small> / ' + r.total + '</small></div>' +
    '  <div class="desc">正确率 ' + rate + '% · 用时 ' + fmtTime(r.secs) + ' · ' + desc + '</div>' +
    '</div>' +
    '  <div class="row" style="justify-content:center">' +
    '    <button class="btn primary" id="again">再刷一轮</button>' +
    '    <button class="btn" id="wrongStart2">刷错题</button>' +
    '    <button class="btn ghost" id="backSetup">返回设置</button>' +
    '  </div>' +
    '</div>' +
    '<div class="card"><h2>各单元掌握情况</h2><div class="sub">按本轮所抽题目统计</div>' +
    '  <table><thead><tr><th>单元</th><th class="num">答对</th><th class="num">正确率</th><th>掌握度</th></tr></thead><tbody>' + unitRows + '</tbody></table>' +
    '</div>' +
    '<div class="card"><h2>本轮错题（' + wrongList.length + '）</h2><div class="sub">已自动加入错题本，可随时重刷</div>' + wrongHtml + '</div>';
}

function viewWrong() {
  const wrong = getWrong();
  const keys = Object.keys(wrong).sort((a, b) => wrong[b].ts - wrong[a].ts);
  const listHtml = keys.length ? keys.map((k) => {
    const w = wrong[k];
    return '<div class="wrong-item">' +
      '<div class="qmeta"><span class="tag unit">' + esc(unitName(w.u)) + '</span>' +
      '<span class="tag src">' + esc(w.s) + '</span>' +
      (w.cnt > 1 ? '<span class="tag wrong">错过 ' + w.cnt + ' 次</span>' : '') + '</div>' +
      '<div class="q">' + esc(w.q) + '</div>' +
      '<div class="a">正确答案：<span class="ok">' + KEYS[w.a] + '. ' + esc(w.o[w.a]) + '</span></div>' +
      '<div class="a" style="margin-top:4px">解析：' + esc(w.e) + '</div>' +
      '</div>';
  }).join('') : '<div class="empty">错题本是空的，说明你还没答错过题 👏</div>';

  return '' +
    '<div class="card">' +
    '  <div class="qmeta"><h2 style="margin:0">错题本（' + keys.length + ' 题）</h2></div>' +
    '  <div class="sub">答错自动收录；重刷答对后自动移出。也可手动管理。</div>' +
    '  <div class="row">' +
    '    <button class="btn primary" id="wrongStart3"' + (keys.length ? '' : ' disabled') + '>开始刷错题</button>' +
    '    <button class="btn danger" id="clearWrong"' + (keys.length ? '' : ' disabled') + '>清空错题本</button>' +
    '    <button class="btn ghost" id="backSetup2">返回</button>' +
    '  </div>' +
    '</div>' +
    '<div class="card">' + listHtml + '</div>';
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-u],[data-size],[data-order],[data-opt],[data-pick],[data-jump]');
  if (!t) return;
  if (t.dataset.u) {
    const u = Number(t.dataset.u);
    const i = S.units.indexOf(u);
    if (i >= 0) S.units.splice(i, 1); else S.units.push(u);
    S.units.sort((a, b) => a - b);
    render(); return;
  }
  if (t.dataset.size) { S.size = t.dataset.size === 'all' ? 'all' : Number(t.dataset.size); render(); return; }
  if (t.dataset.order) { S.random = t.dataset.order === 'random'; render(); return; }
  if (t.dataset.opt) { S.shuffleOpts = t.dataset.opt === 'shuffle'; render(); return; }
  if (t.dataset.pick !== undefined && t.dataset.pick !== '') { pick(Number(t.dataset.pick)); return; }
  if (t.dataset.jump !== undefined && t.dataset.jump !== '') { jump(Number(t.dataset.jump)); return; }
});

document.addEventListener('click', (e) => {
  const id = e.target.id;
  if (!id) return;
  const map = {
    allUnits: () => { S.units = [1, 2, 3, 4]; render(); },
    noneUnits: () => { S.units = []; render(); },
    only12: () => { S.units = [1, 2]; render(); },
    start: startQuiz,
    wrongStart: startWrongOnly,
    wrongStart2: startWrongOnly,
    wrongStart3: startWrongOnly,
    wrongBook: () => { S.view = 'wrong'; render(); },
    backSetup: () => { S.view = 'setup'; render(); },
    backSetup2: () => { S.view = 'setup'; render(); },
    again: startQuiz,
    prev: () => go(-1),
    next: () => { if (S.cur === S.queue.length - 1) finish(); else go(1); },
    quit: () => { if (confirm('退出本轮？已答题目会保留在错题本中。')) { S.view = 'setup'; render(); } },
    clearHist: () => { if (confirm('清空历史成绩记录？')) { writeJSON(LS_HIST, []); render(); } },
    clearWrong: () => { if (confirm('清空错题本？此操作不可恢复。')) { setWrong({}); render(); } }
  };
  if (map[id]) map[id]();
});

document.addEventListener('keydown', (e) => {
  if (S.view !== 'quiz') {
    if (e.key === 'Enter' && S.view === 'setup') startQuiz();
    return;
  }
  const k = e.key.toUpperCase();
  if (KEYS.indexOf(k) >= 0) { pick(KEYS.indexOf(k)); return; }
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight' || e.key === 'Enter') {
    if (S.cur === S.queue.length - 1 && S.judge[S.cur]) finish(); else go(1);
  }
});

/* ---------------- 启动 ---------------- */
render();

</script>
</body>
</html>
