<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>世界历史九上 · 单机刷题（200题）</title>
<meta name="description" content="统编版《世界历史》九年级上册 7 个单元 200 题单机刷题：中考真题为主，错题本与成绩统计，数据存本机。">
<style>
:root {
  --bg: #f6f5f1;
  --card: #ffffff;
  --ink: #1f2430;
  --ink-2: #5b6272;
  --ink-3: #8c93a5;
  --line: #e6e4de;
  --brand: #b4553c;
  --brand-soft: #fbeee9;
  --ok: #2f7d5c;
  --ok-soft: #e8f5ee;
  --bad: #c0392b;
  --bad-soft: #fdeceb;
  --warn: #b8860b;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(31, 36, 48, 0.06);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
  font-size: 16px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 40px; }

/* ---------- 顶部 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(246, 245, 241, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 860px; margin: 0 auto; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
}
.brand { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.brand small { display: block; font-size: 11px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  font-family: inherit; transition: .15s;
}
.btn:hover { border-color: #cfcbc2; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #9d4730; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: #eccdc9; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 11px; font-size: 12px; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 14px;
}
.card h2 { margin: 0 0 4px; font-size: 16px; }
.card .sub { color: var(--ink-3); font-size: 12.5px; margin-bottom: 12px; }

/* ---------- 设置区 ---------- */
.units { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.unit-chip {
  border: 1px solid var(--line); background: #fbfaf8; border-radius: 10px;
  padding: 8px 11px; font-size: 13px; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 6px; transition: .15s;
}
.unit-chip.on { background: var(--brand-soft); border-color: #e3bdb1; color: #8d3b25; font-weight: 600; }
.unit-chip .n { color: var(--ink-3); font-size: 11px; }
.unit-chip.on .n { color: #b4745f; }

.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.row > .label { font-size: 13px; color: var(--ink-2); min-width: 62px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  border: 0; background: #fff; padding: 7px 13px; font-size: 13px; cursor: pointer;
  font-family: inherit; color: var(--ink-2); border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--brand); color: #fff; font-weight: 600; }

/* ---------- 答题区 ---------- */
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.tag { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: #f1efe9; color: var(--ink-2); }
.tag.unit { background: var(--brand-soft); color: #8d3b25; font-weight: 600; }
.tag.src { background: #eef3f8; color: #3c5d7d; }
.tag.wrong { background: var(--bad-soft); color: var(--bad); font-weight: 600; }

.qtext { font-size: 17px; line-height: 1.75; font-weight: 600; margin: 4px 0 14px; }

.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1.5px solid var(--line); background: #fff; border-radius: 12px;
  padding: 12px 13px; cursor: pointer; transition: .15s; text-align: left;
  font-family: inherit; font-size: 15.5px; line-height: 1.6; color: var(--ink);
}
.opt:hover { border-color: #cfcbc2; background: #fdfcfa; }
.opt .key {
  flex: 0 0 24px; height: 24px; border-radius: 50%; background: #f1efe9; color: var(--ink-2);
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  margin-top: 1px;
}
.opt.picked { border-color: var(--brand); background: var(--brand-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .key { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.locked { cursor: default; }

.explain {
  margin-top: 14px; border-left: 3px solid var(--brand);
  background: #fbf7f5; border-radius: 0 10px 10px 0; padding: 11px 13px; font-size: 14.5px;
  line-height: 1.7; color: #4a4137;
}
.explain b { color: var(--brand); }
.verdict { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }

/* ---------- 进度 ---------- */
.bar { height: 6px; background: #eceae4; border-radius: 99px; overflow: hidden; margin: 12px 0 8px; }
.bar i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .25s; }
.stats { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.stats b { color: var(--ink); font-size: 15px; }

/* ---------- 答题卡 ---------- */
.sheet { display: flex; flex-wrap: wrap; gap: 6px; }
.sheet button {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; font-size: 12.5px; cursor: pointer; font-family: inherit; color: var(--ink-2);
}
.sheet button.right { background: var(--ok-soft); border-color: #bfe0cf; color: var(--ok); font-weight: 700; }
.sheet button.wrong { background: var(--bad-soft); border-color: #eecac6; color: var(--bad); font-weight: 700; }
.sheet button.cur { outline: 2px solid var(--brand); outline-offset: 1px; font-weight: 700; }

/* ---------- 结算 ---------- */
.score { text-align: center; padding: 6px 0 12px; }
.score .big { font-size: 44px; font-weight: 800; line-height: 1.1; color: var(--brand); }
.score .big small { font-size: 16px; color: var(--ink-3); font-weight: 600; }
.score .desc { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.mini-bar { height: 7px; background: #eeece6; border-radius: 99px; overflow: hidden; min-width: 60px; }
.mini-bar i { display: block; height: 100%; background: var(--ok); }

.wrong-item { border-top: 1px dashed var(--line); padding: 12px 0; }
.wrong-item:first-child { border-top: 0; }
.wrong-item .q { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
.wrong-item .a { font-size: 13.5px; color: var(--ink-2); }
.wrong-item .a .bad { color: var(--bad); }
.wrong-item .a .ok { color: var(--ok); }

.empty { text-align: center; color: var(--ink-3); padding: 26px 10px; font-size: 14px; }
.hide { display: none !important; }
.hint { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
.foot { text-align: center; color: var(--ink-3); font-size: 12px; padding: 18px 0 0; }

@media (max-width: 480px) {
  .wrap { padding: 12px 10px 32px; }
  .card { padding: 14px; }
  .qtext { font-size: 16px; }
  .opt { font-size: 15px; padding: 11px; }
  .brand { font-size: 15.5px; }
}

</style>
</head>

  <div class="topbar-in">
    <div class="brand">世界历史九上 · 刷题<small>统编版九年级上册 · 200 题 · 单机版</small></div>
    <div class="spacer"></div>
    <span class="tag" id="kvTag">数据存本机</span>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="foot">题库依据统编版《世界历史》九年级上册与近五年中考高频考点整理 · 本页完全离线可用</footer>
<script>
/**
 * 世界历史九年级上册 · 题库（200题）
 * ---------------------------------------------------------------
 * 范围：统编版《世界历史》九年级上册 7 个单元 21 课
 * 来源：优先收录 2021—2025 年各地中考真题（题目标注「年份·地区·中考真题」）；
 *       不足部分按教材考点与中考命题方式改编（标注「改编」）。
 * 每题结构：{ u:单元, s:来源, q:题干, o:[4选项], a:正确项下标(0-3), e:解析 }
 * 注意：真题文本经整理录入，个别标点/图片题（含图）已作文字化处理，题意不变。
 */

const QUESTIONS = [
  /* ==================== 第一单元 古代亚非文明（24题） ==================== */
  {u:1,s:'2023·广西·中考真题',q:'古埃及的最高统治者法老自称是神之子。作为神灵的后代和神的化身，他享有比所有臣民都要高的权威。这说明法老',o:['推行了种姓制度','受到希腊哲学影响','建立了幕府统治','利用神权强化王权'],a:3,e:'法老以“神之子”自居，借助神权神化王权，服务于专制统治。'},
  {u:1,s:'2023·四川泸州·中考真题',q:'古代亚非地区的文明古国创造了辉煌灿烂的文明成果，如古代埃及的象形文字和金字塔，古代两河流域的楔形文字和《汉谟拉比法典》，古代中国的甲骨文和青铜器，古代印度的梵文和佛教等。这反映了',o:['古典文化的再复兴','亚非文明的联系密切','文明进程的延续性','古代文明的多元特征'],a:3,e:'各地文明各具特色、独立发展，体现古代文明的多元特征。'},
  {u:1,s:'2023·黑龙江齐齐哈尔·中考真题',q:'古代亚非地区的文明古国创造了辉煌灿烂的文明成果。下列文明成果中，古巴比伦王国创造的是',o:['金字塔','《荷马史诗》','帕特农神庙','《汉谟拉比法典》'],a:3,e:'《汉谟拉比法典》是古巴比伦王国的文明成果；金字塔属古埃及，后两项属古希腊。'},
  {u:1,s:'2024·云南·中考真题',q:'《汉谟拉比法典》是古巴比伦王国留给人类的宝贵文化遗产。它诞生于',o:['尼罗河流域','两河流域','印度河流域','爱琴海地区'],a:1,e:'公元前18世纪汉谟拉比统一两河流域，为维护奴隶主利益制定该法典。'},
  {u:1,s:'2024·金昌·学业考',q:'它是世界上最古老的文明之一，创立了作为神权象征的法老，建造了规模宏大且数量众多的金字塔，创造了表音与表意相结合的象形文字。该文明是',o:['古巴比伦文明','古印度文明','古埃及文明','古希腊文明'],a:2,e:'法老、金字塔、象形文字均为古埃及文明的标志。'},
  {u:1,s:'2023·山东济宁·中考真题',q:'某古代国家建立了严格的社会等级制度：第一等级婆罗门掌管祭祀，第二等级刹帝利掌管军事和行政权力，第三等级吠舍从事农业、畜牧业和商业，第四等级首陀罗要为前三个等级服务。该古代国家是',o:['古代埃及','古巴比伦','古代印度','古代希腊'],a:2,e:'雅利安人进入印度后建立了种姓制度，等级依次为婆罗门、刹帝利、吠舍、首陀罗。'},
  {u:1,s:'2023·辽宁阜新·中考真题',q:'古代印度是世界四大文明古国之一，其文明的象征是',o:['金字塔','青铜器','种姓制度','《汉谟拉比法典》'],a:2,e:'种姓制度是古印度文明的典型象征；金字塔属埃及，青铜器属中国，法典属古巴比伦。'},
  {u:1,s:'2023·湖南岳阳·中考真题',q:'九年级某学生在学习世界三大宗教时，写下了“乔达摩·悉达多”“众生平等”“忍耐顺从”等课堂笔记。他正在学习的宗教最有可能是',o:['基督教','佛教','天主教','伊斯兰教'],a:1,e:'公元前6世纪古印度乔达摩·悉达多创立佛教，后被称为释迦牟尼。'},
  {u:1,s:'2023·甘肃平凉·中考真题',q:'某同学整理古代亚非地区文明成果简表：古埃及——象形文字、金字塔；古巴比伦王国——楔形文字、▲；古印度——梵文、佛教、种姓制度。表中“▲”处的内容最有可能是',o:['《十二铜表法》','《汉谟拉比法典》','《荷马史诗》','《天方夜谭》'],a:1,e:'《汉谟拉比法典》是古巴比伦的楔形文字法典，属两河流域文明。'},
  {u:1,s:'2024·山东滨州·中考真题',q:'古埃及文明、古代西亚文明、古印度文明、中国文明都位于北纬20度至40度的大河流域。究其原因，在于相关区域适合',o:['农业耕作','游牧生活','海外贸易','发展手工业'],a:0,e:'大河流域水源充沛、土壤肥沃、光热充足，适合农业生产，故称大河文明。'},
  {u:1,s:'2024·黑龙江绥化·中考真题',q:'古埃及被认为是“尼罗河的赠礼”，古埃及文明的象征是',o:['金字塔','帕特农神庙','凯旋门','大竞技场'],a:0,e:'金字塔是古埃及法老的陵墓，是古埃及文明的象征。'},
  {u:1,s:'2024·宁夏·中考真题',q:'大约从公元前4000年起，中国的甲骨文和青铜器，古代埃及的太阳历和金字塔，古代两河流域的《汉谟拉比法典》，希腊的城邦国家，迥然相异，对照鲜明。由此可见',o:['古代人类文明呈现多元发展格局','罗马法制建设奠定欧洲法学渊源','亚历山大东征促进东西文化交汇','欧亚非美之间建立起直接的联系'],a:0,e:'各地文明成果迥然相异，说明古代人类文明呈现多元发展格局。'},
  {u:1,s:'改编·中考风格',q:'古埃及人发现，当太阳和天狼星在地平线上同时升起时，尼罗河就开始涨水；水退后需重新丈量土地，由此积累了几何学知识。这说明',o:['自然环境影响文明发展','埃及的数学领先世界','宗教支配了埃及社会','埃及实行中央集权统治'],a:0,e:'尼罗河泛滥规律推动历法与几何知识形成，体现自然环境对文明发展的影响。'},
  {u:1,s:'改编·中考风格',q:'《汉谟拉比法典》规定：拐带奴隶、帮助奴隶逃跑或窝藏奴隶者，都要被处以死刑。这反映出该法典',o:['宣扬君权神授','强化封建君主专制','巩固民主政治','维护奴隶主的利益'],a:3,e:'以严刑保护奴隶主对奴隶的占有，实质是维护奴隶主阶级的利益。'},
  {u:1,s:'2022·湖北宜昌·中考真题',q:'大英博物馆收藏的一具木乃伊棺上铭文记载，死者名叫霍尼吉提夫，是托勒密三世时期（公元前246—前222）卡纳克阿蒙神庙的大祭司。这份文物信息应属于',o:['古代埃及文明','古代两河流域文明','罗马文明','古代印度河流域文明'],a:0,e:'木乃伊、卡纳克阿蒙神庙都是古埃及文明的典型标志，故选 A。'},
  {u:1,s:'改编·中考风格',q:'古代两河流域的苏美尔人用削尖的芦苇杆在泥板上刻写文字，笔画形似楔形。这种文字是',o:['象形文字','楔形文字','字母文字','甲骨文'],a:1,e:'楔形文字由苏美尔人创造，是两河流域的典型文字。'},
  {u:1,s:'改编·中考风格',q:'古印度种姓制度下，婆罗门、刹帝利、吠舍、首陀罗之外还有被称为“不可接触者”的贱民。这一制度',o:['促进了社会流动','维护了统治秩序却也阻碍了社会发展','保障了人人平等','推动了商品经济发展'],a:1,e:'种姓制度固化了社会等级，短期维护统治秩序，长远阻碍印度社会发展。'},
  {u:1,s:'2022·湖南常德·中考真题',q:'人类最早的文明产生于亚非地区的大河流域，古希腊历史学家希罗多德形象地把古埃及文明称为“尼罗河的赠礼”。这主要是由于尼罗河流域',o:['商品经济比较活跃','适合于农业耕作','民主政治起源较早','有利于建金字塔'],a:1,e:'尼罗河定期泛滥、留下肥沃淤泥，为古埃及农耕提供了优越条件，故古埃及文明被称为“尼罗河的赠礼”。'},
  {u:1,s:'2022·福建·中考真题',q:'下表列举了古埃及与古印度的国家机器、大型工程和文化成就——古埃及：军队、刑法、法老，金字塔，太阳历；古印度：种姓制度，佛教、发明十个数字符号。这张表反映出古代文明具有',o:['多样性','一致性','互信性','互鉴性'],a:0,e:'两个文明古国在制度、工程与文化上各具特色，反映出古代亚非文明的多样性。'},
  {u:1,s:'改编·中考风格',q:'雅利安人进入古代印度后，逐渐产生不同等级，形成严格的种姓制度。这一制度产生的背景是',o:['佛教的广泛传播','雅利安人征服与内部阶层分化','波斯帝国的入侵','中亚商路的开辟'],a:1,e:'雅利安人征服当地居民后，按征服与被征服及内部职业差异形成等级制度。'},
  {u:1,s:'2021·辽宁大连·中考真题',q:'古代世界人民创造了辉煌灿烂的文明成果。下列国家（地区）与文明成果对应正确的是（①古埃及——金字塔和太阳历 ②古巴比伦王国——《十二铜表法》 ③古希腊——《汉谟拉比法典》 ④古罗马——罗马大竞技场）',o:['①②','①④','②③','③④'],a:1,e:'①④正确：《十二铜表法》属古罗马而非古巴比伦，《汉谟拉比法典》属古巴比伦而非古希腊，故②③对应错误。'},
  {u:1,s:'改编·中考风格',q:'古代亚非文明多产生于大河流域，古代欧洲文明则兴起于海洋区域。形成这一差异的主要原因是',o:['人种的差别','地理环境的差异','宗教信仰不同','文化程度不同'],a:1,e:'地理环境影响生产方式，进而影响文明类型与特征。'},
  {u:1,s:'2021·湖南常德·中考真题',q:'2019年土耳其发起代号为“和平之泉”的军事行动，目标直指幼发拉底河以东地区，古老的两河流域再次成为国际关注的焦点。下列文物诞生于该地区的是',o:['金字塔','《汉谟拉比法典》石柱','种姓制度','雅典卫城遗址'],a:1,e:'两河流域孕育了古巴比伦文明，《汉谟拉比法典》石柱是其代表性文物；金字塔属古埃及，种姓制度属古印度，雅典卫城属古希腊。'},
  {u:1,s:'2022·广西桂林·中考真题',q:'胡夫金字塔使用了230万块石灰石，每块平均重2300公斤。据估计，大约84000名劳力每年工作80天，耗时20年才能完成这项工程。金字塔的修建反映了古埃及',o:['环境的优越','城市的兴盛','王权的强大','战争的频繁'],a:2,e:'如此宏大的工程需要大规模组织和调用全国人力物力，反映出古埃及法老王权与国家组织力量的强大。'},

  /* ==================== 第二单元 古代欧洲文明（26题，本页16题，续16题见下） ==================== */
  {u:2,s:'2024·广西·中考真题',q:'据不完全统计，古希腊的城邦总数达到300多个。这些城邦都是土地和人口十分有限的弹丸小国。这反映古希腊城邦的突出特点是',o:['种姓制度森严','法律完备','庄园经济发达','小国寡民'],a:3,e:'城邦土地人口有限、数量众多，突出特点是“小国寡民”。'},
  {u:2,s:'2024·四川广元·中考真题',q:'在伯里克利当政时期，根据雅典民主制度，有资格参加公民大会的是',o:['外邦人和奴隶','成年男性公民','成年男子','全体居民'],a:1,e:'雅典民主仅限于本邦成年男性公民，妇女、奴隶、外邦人无权参政。'},
  {u:2,s:'2024·黑龙江绥化·中考真题',q:'伯里克利主政时期，雅典的奴隶制民主政治发展到高峰。雅典的最高权力机构是',o:['元老院','公民大会','议会','三级会议'],a:1,e:'公民大会是雅典最高权力机构；元老院属罗马，三级会议属法国等级会议。'},
  {u:2,s:'2024·江苏扬州·中考真题',q:'考古学家从一处遗址清理出一幅马赛克镶嵌画，画面表现了公元前333年伊苏斯会战中一位统帅奋勇冲进波斯军阵的场景。这位统帅是',o:['伯里克利','亚历山大','屋大维','斯巴达克'],a:1,e:'伊苏斯会战的胜利者是马其顿国王亚历山大。'},
  {u:2,s:'2024·重庆B·中考真题',q:'亚历山大及其继承者们在东方的土地上建立了300多座希腊城市，并建有希腊式剧场和体育场，这些城市定期巡回上演希腊的悲剧和喜剧。材料可以用来说明',o:['罗马征服了意大利半岛','希腊的城邦制度影响深远','雅典民主政治达到高峰','亚历山大东征的客观作用'],a:3,e:'东征建立希腊化城市、传播希腊文化，客观上促进了东西方文化交流。'},
  {u:2,s:'2024·福建·中考真题',q:'亚历山大及其继承者在东方的土地上建立了众多的城市，“东西方在这一时期频繁互动和深度融合”。能为此提供直接证据的是',o:['刻有希腊式长袍的印度佛像','位于日本奈良的唐招提寺','应用于航海的指南针','传入中国的马铃薯'],a:0,e:'印度佛像上出现希腊式长袍，是希腊文化与东方文化融合的直接物证。'},
  {u:2,s:'2024·四川成都·中考真题',q:'下图（文字描述：绘有身着丝绸的妇女形象的古希腊陶壶）可用来研究古希腊时期',o:['雕刻艺术的高超','东西方文明的交流','理性主义的起源','城邦政治的繁荣'],a:1,e:'陶壶上出现来自东方的丝绸形象，反映东西方文明之间的交流。'},
  {u:2,s:'2024·江苏盐城·中考真题',q:'《十二铜表法》把向来由贵族祭司阶层把持的“习惯法”用文字公布出来，使司法执法以明确的法律文件为依据。它的颁布',o:['开创了第一部较为完备的成文法','彰显了罗马共和国阶级平等理念','遏制了贵族对法律的曲解和滥用','体现了早期资产阶级的利益要求'],a:2,e:'法律成文公布限制了贵族随意解释法律的权力，一定程度保护平民利益。'},
  {u:2,s:'2024·黑龙江齐齐哈尔·中考真题',q:'地中海是联系欧洲南部各国和亚、欧、非三洲的重要水域。2世纪时，有一位旅行探险者想要环游地中海，他应该前往',o:['亚历山大帝国','罗马帝国','拜占庭帝国','阿拉伯帝国'],a:1,e:'2世纪罗马帝国进入黄金时期，地中海成为其“内湖”，可环游。'},
  {u:2,s:'2024·四川广安·中考真题',q:'希腊、罗马古典文化丰富多彩，是人类宝贵的精神遗产，其对后世影响深远的成就是',o:['象形文字和金字塔','楔形文字和《汉谟拉比法典》','梵文和佛教','帕特农神庙和《十二铜表法》'],a:3,e:'帕特农神庙是古希腊建筑代表，《十二铜表法》是罗马法制建设第一步。'},
  {u:2,s:'2025·陕西·中考真题',q:'世界古代文明多姿多彩。下列成就：文学《荷马史诗》、法学《十二铜表法》、历法儒略历、建筑帕特农神庙，产生于',o:['古代印度','拜占庭帝国','古代希腊罗马','阿拉伯帝国'],a:2,e:'四者分别属古希腊（史诗、神庙）与古罗马（十二铜表法、儒略历）。'},
  {u:2,s:'2025·山东泰安·中考真题',q:'罗马法是欧洲法学的渊源。罗马人确立的诉讼程序、律师制度、陪审制度等为后世所承袭。《拿破仑法典》主要参照了罗马法，欧美各国又借鉴《拿破仑法典》制定本国法律。材料反映了罗马法',o:['维护了奴隶主贵族利益','实现了法律面前人人平等','体系完备、程序严谨','对西方法治产生深远影响'],a:3,e:'材料强调罗马法被后世广泛承袭与借鉴，突出其对西方法治的深远影响。'},
  {u:2,s:'2024·四川成都·中考真题（改编）',q:'在古希腊，将比赛胜利者的雕像树立在奥林匹克运动会上成为一种风气，甚至有人认为没有奥林匹克运动会就不会有希腊雕塑。材料表明古希腊运动会',o:['促进艺术发展','推动文化交流','消除政治分歧','倡导和平理念'],a:0,e:'运动会为雕塑提供题材与需求，推动了希腊雕塑艺术的发展。'},
  {u:2,s:'2023·广东·中考真题',q:'在古罗马的建筑和其他艺术中，皇帝经常被刻画成武士、和平缔造人、主持宗教献祭的神职人员、仁慈的统治者。这种艺术行为旨在',o:['塑造罗马皇帝权威','倡导民主与平等','表现神人同形同性','推动罗马法普及'],a:0,e:'多面向美化皇帝形象，意在凸显皇帝在各领域的至高权威。'},
  {u:2,s:'2023·四川宜宾·中考真题',q:'在埃及历法的基础上创新了儒略历；吸收希腊建筑特点，创新出石拱门、穹顶；制定《十二铜表法》，成为欧洲法学的渊源。这说明，古罗马',o:['成为欧亚文化发祥地','推动文化交流与传播','建立完整的法学体系','搭建了欧亚和平之桥'],a:1,e:'罗马借鉴埃及历法、希腊建筑并影响后世法律，体现文化交流与传播作用。'},
  {u:2,s:'2024·宁夏·中考真题（改编）',q:'在帝国的统治下，地中海地区保持了200多年的和平。由于不同地区经济联系的加强，以及贸易的发展，帝国在2世纪进入黄金时期。材料中的“帝国”是',o:['亚历山大帝国','罗马帝国','拜占庭帝国','阿拉伯帝国'],a:1,e:'2世纪罗马帝国疆域空前、地中海成内湖，进入黄金时期。'},
  {u:2,s:'改编·中考风格',q:'公元前509年，罗马建立了共和国，国家统治的决策权掌握在由300名贵族组成的元老院手里，两个权力相等的执政官主持日常政务。这表明罗马共和国',o:['实现了公民普遍参政','由贵族元老院掌握决策权','实行君主专制统治','建立了民主共和制度'],a:1,e:'罗马共和国权力核心是元老院，执政官由贵族担任，实质是贵族共和。'},
  {u:2,s:'改编·中考风格',q:'公元前27年，屋大维首创“元首制”这一政治形式，掌握国家最高权力，罗马帝国由此建立。此后的罗马帝国',o:['不再对外扩张','以元首（皇帝）为最高统治者','恢复了共和制的实质','废除了一切法律'],a:1,e:'元首制实际上是皇帝专制，罗马由共和国转变为帝国。'},
  {u:2,s:'改编·中考风格',q:'395年罗马帝国分裂为东、西两部分；476年西罗马帝国在日耳曼人的打击下灭亡。西罗马帝国的灭亡',o:['标志西欧奴隶社会结束、封建时代开始','标志罗马帝国建立','使地中海成为罗马内湖','表明基督教产生'],a:0,e:'西罗马灭亡标志西欧奴隶社会的终结，欧洲进入封建时代（中世纪）。'},
  {u:2,s:'改编·中考风格',q:'伯里克利说：“我们的制度之所以被称为民主政治，因为政权是在全体公民手中。”但当时雅典的成年男性公民仅占居民总数的很小部分。这说明雅典民主',o:['是全体居民的民主','实质是少数人的民主','已经发展为代议制民主','保障了妇女的权利'],a:1,e:'妇女、奴隶、外邦人被排除在外，雅典民主实质是少数男性公民的民主。'},
  {u:2,s:'2022·湖北宜昌·中考真题',q:'古希腊孕育了深厚的哲学思想，其中逻辑学的创立者是一位百科全书式的学者。该学者是',o:['德谟克利特','苏格拉底','柏拉图','亚里士多德'],a:3,e:'亚里士多德是古希腊百科全书式的学者，创立了逻辑学。'},
  {u:2,s:'2022·吉林·中考真题',q:'古代希腊、罗马的建筑艺术对后世的建筑风格产生了深远影响。古代希腊建筑艺术主要体现在',o:['教堂','陵墓','石雕','神庙'],a:3,e:'古希腊建筑艺术主要体现在神庙，其四周以廊柱环绕、柱身有粗有细，雅典帕特农神庙是典型代表。'},
  {u:2,s:'改编·中考风格',q:'《荷马史诗》包括《伊利亚特》和《奥德赛》两部分，描写了古希腊人远征特洛伊的故事。这部作品',o:['是古希腊最早的成文法典','是研究早期希腊社会的重要史料','由亚里士多德创作','记录罗马共和国的历史'],a:1,e:'《荷马史诗》是古希腊不朽的文学作品，也是研究早期希腊社会的重要史料。'},
  {u:2,s:'2024·天津·中考真题（改编）',q:'古埃及人发现，当太阳和天狼星在地平线上同时升起时，尼罗河就会开始涨水。据此他们制定的历法是',o:['太阳历','太阴历','公历','儒略历'],a:0,e:'古埃及人根据天狼星与太阳的升落规律制定了太阳历。'},
  {u:2,s:'改编·中考风格',q:'亚历山大东征给被征服地区带来灾难，但也使希腊文化与东方文化发生碰撞交融。这一评价体现',o:['一分为二的辩证观点','全盘否定的观点','完全肯定的观点','只重结果的观点'],a:0,e:'既指出破坏性，也承认其客观进步作用，是一分为二的评价方法。'},

  /* ==================== 第三单元 封建时代的欧洲（28题） ==================== */
  {u:3,s:'2025·广东广州·中考真题',q:'中世纪是欧洲的重要历史时期，将欧洲带入中世纪的是',o:['苏美尔人','印第安人','日耳曼人','斯巴达人'],a:2,e:'日耳曼人灭亡西罗马帝国并建立诸王国，西欧由此进入中世纪。'},
  {u:3,s:'2025·河南·中考真题',q:'作为法兰克王国国王，他十分重视传承古典文化。在其推动下，出现了“加洛林文艺复兴”。他是',o:['伯里克利','亚历山大大帝','查理大帝','查士丁尼一世'],a:2,e:'8世纪法兰克国王查理大帝推动收集整理古典文献，史称“加洛林文艺复兴”。'},
  {u:3,s:'2025·广西·中考真题',q:'一个贵族通常也是一名骑马仗剑的骑士，他的天职就是作为军事附庸而为其领主作战，尽管他本人也是拥有众多附庸的封建主。与此现象相关联的是',o:['雅典民主政治','日本大化改新','西欧封建制度','俄国1861年改革'],a:2,e:'封君与封臣层层分封、逐级依附，体现西欧封建制度的等级关系。'},
  {u:3,s:'2025·新疆·中考真题',q:'课本剧场景：人物1解下武器、脱帽下跪，把双手放到人物2合拢的手掌中宣誓效忠；人物2拉起他、亲吻脸颊，并将一把宝剑交给他。据此判断剧中',o:['人物分别是领主、佃户','人物关系以血缘为纽带','人物正式结成契约关系','场景出现在罗马共和国'],a:2,e:'这是封臣向封君宣誓效忠的仪式，双方通过契约确立权利与义务。'},
  {u:3,s:'2024·内蒙古通辽·中考真题',q:'中世纪欧洲的制度，其实就是把放大的个人（希腊）放小一点，把放大的国家（罗马）也放小一点，但把部落的习惯、家族血缘的习俗放大了，变成了一种政治制度。这种“政治制度”指的是',o:['西欧奴隶制度','中央集权制度','封君封臣制度','民主政治制度'],a:2,e:'以土地封赐为纽带形成的封建等级制度即封君封臣制度。'},
  {u:3,s:'2023·湖南邵阳·中考真题',q:'2023年1月7日，俄罗斯总统普京在克里姆林宫的天使报喜大教堂参加东正教礼拜活动，并在身上划十字。据此判断，普京信奉',o:['佛教','基督教','伊斯兰教','犹太教'],a:1,e:'“划十字”是基督教仪式，东正教是基督教的一支。'},
  {u:3,s:'2023·呼和浩特·中考真题',q:'在中世纪的欧洲，国王或皇帝是名义上的最高统治者，他们通过封君封臣制度与各级封建主联系，封建主作为领主在各自领地内行使权力。这一情形在政治上导致了',o:['基督教的兴起','不同程度割据的形成','自由城市出现','大学自治权利的加强'],a:1,e:'封君封臣制度下封建主各自为政，导致政治上不同程度的分裂割据。'},
  {u:3,s:'2023·辽宁阜新·中考真题',q:'下列表述与“封君封臣制度”相关的是',o:['根据血缘关系远近和功劳大小分封','我的附庸的附庸，不是我的附庸','嫡长子继承王位，封地可再次分封','大封同姓王，据守州郡重镇'],a:1,e:'这句话概括了西欧封建等级制下各等级之间的依附关系特点。'},
  {u:3,s:'2023·江西·中考真题',q:'11世纪，西欧封建主之间普遍结成封君封臣关系，在这种关系下',o:['封君没有保护封臣的义务','封君封臣具有一定的契约关系','封臣要直接承担国家赋税','封君与封臣以血缘关系为纽带'],a:1,e:'封君须保护封臣、封臣须效忠封君，权利义务交织，带有契约意义。'},
  {u:3,s:'2025·安徽阜阳·二模',q:'811年，法兰克王国国王查理曼在遗嘱中将大量土地遗留给国内21个大主教，并命大主教保留部分后把其余分给副主教及其他教士。这可以用于印证，中世纪西欧',o:['城市自治不断深入','神权和皇权的结合','庄园经济日益瓦解','大学教育影响巨大'],a:1,e:'国王以土地赠予教会换取支持，体现中世纪西欧王权与教权的结合。'},
  {u:3,s:'2024·青海西宁·中考真题',q:'“庄园里有手工作坊、磨坊和烤面包坊等，可以生产各种生活和生产所需的物品，除非万不得已，庄园很少出去采购。”由此可见，庄园',o:['是一个独立的自给自足的经济单位','在日常教学和行政管理中具有自主权','创造出兼收并蓄且独具特色的文化','农民可以通过庄园法庭维护一些权益'],a:0,e:'庄园所需物品基本自产，很少对外采购，体现自给自足特征。'},
  {u:3,s:'2024·山东日照·中考真题',q:'某示意图呈现了自9世纪开始流行、14世纪中叶以后逐步瓦解的一种经济组织。与这一示意图相对应的历史现象是',o:['封建行会','城市自治','西欧庄园','欧洲大学'],a:2,e:'9世纪兴起、14世纪中期后因租地农场兴起而瓦解的是西欧庄园。'},
  {u:3,s:'2024·湖南·中考真题',q:'9世纪起，法兰克盛行庄园制。农奴须自带工具无偿耕种领主自营地，一般每周3天，农忙时增加，农奴还得向领主献纳贡物和缴纳捐税。这反映了法兰克的庄园',o:['采用罗马奴隶制进行生产','存在领主对农奴的剥削','成为地方经济发展的中心','通过劳动惩罚违法行为'],a:1,e:'无偿劳作、加派劳役与纳贡缴税，反映领主对农奴的剥削。'},
  {u:3,s:'2024·安徽·中考真题',q:'中世纪西欧庄园中有擅长各种工作的人，如木匠、铁匠、金银匠、鞋匠、渔民等，庄园里所需要的绝大多数生产工具和日常用具都是由农奴生产制造的。这反映出当时的西欧庄园',o:['自给自足特征明显','农奴生活质量较高','阶级矛盾异常尖锐','奢靡浪费之风盛行'],a:0,e:'庄园内部分工齐全、生产工具自产，体现自给自足特征。'},
  {u:3,s:'2024·西藏·中考真题',q:'9世纪开始，欧洲流行一种新的组织。它大小不一，耕地由领主自营地和农民份地组成，是一个独立的自给自足的经济和政治单位。这种组织是',o:['庄园','工场','农场','城市'],a:0,e:'庄园由领主自营地和农民份地组成，是独立的自给自足的经济政治单位。'},
  {u:3,s:'2025·四川资阳·中考真题',q:'12世纪，法国琅城市民通过赎买获得了自治权，但主教背信弃义收回特权，市民武装起义杀死主教，最终在国王特许下重新获得自治。这反映中世纪城市争取自治的方式有',o:['金钱赎买与武装斗争','国王恩赐与市民选举','和平谈判与教会支持','庄园联合与行会抗争'],a:0,e:'先赎买后武装起义，说明争取自治的主要方式是金钱赎买与武力斗争。'},
  {u:3,s:'2025·辽宁·中考真题',q:'12—15世纪的欧洲大学通过官方特许状，获取了免税、司法管辖、生活和教学秩序不受干扰、迁徙等权利。这体现了欧洲大学的',o:['自治地位','严格等级','多元文化','基本义务'],a:0,e:'特许状赋予大学一系列特权，说明大学拥有一定的自治地位。'},
  {u:3,s:'2025·吉林长春·中考真题',q:'“中世纪的鼎盛时期，经济繁荣为教育的发展提供了保障”。这一表述的是西欧大学兴起的',o:['背景','过程','影响','特点'],a:0,e:'经济繁荣为教育发展提供保障，这是分析大学兴起的原因（背景）。'},
  {u:3,s:'2025·广东·中考真题',q:'中世纪晚期，工商业者进入英国的最高法院和税务法庭、法国的财政和司法机构任职，甚至还有人担任国家各部大臣。这反映出当时西欧',o:['封建贵族势力强大','文艺复兴运动兴起','市民阶层力量壮大','封君封臣制度强化'],a:2,e:'工商业者进入国家管理机构，说明市民阶层力量不断壮大。'},
  {u:3,s:'2024·江苏徐州·中考真题',q:'博洛尼亚大学是以学生组成的社团为基础建立起来的，社团得到教会的支持并掌握了学校的管理权，而教学则由资深教授掌控。这说明中世纪大学',o:['推广大众教育','都由教会建立','推动城市兴起','有一定自主权'],a:3,e:'学生社团与教授分别掌握管理与教学，说明大学具有一定自主权。'},
  {u:3,s:'2024·黑龙江·中考真题',q:'下列选项中，被认为是欧洲中世纪“最美好的花朵”的是',o:['城市的兴起','大学的兴起','庄园的兴起','手工工场的兴起'],a:1,e:'大学的兴起被认为是欧洲中世纪教育“最美好的花朵”。'},
  {u:3,s:'2024·江苏扬州·中考真题',q:'某同学笔记记载：时间公元6世纪；内容《查士丁尼法典》《法学汇纂》《法理概要》《新法典》；目的稳定帝国社会秩序、保证皇帝专制权力；影响奠定了欧洲民法的基础。据此可知他正在学习',o:['《汉谟拉比法典》','《十二铜表法》','《罗马民法大全》','《拿破仑法典》'],a:2,e:'查士丁尼组织编纂的上述法典合称《罗马民法大全》。'},
  {u:3,s:'2024·辽宁·中考真题',q:'这个帝国的重要性绝非仅体现在它的“武功”，更体现在“文治”成就，如深刻影响了后来欧洲各国法律发展的《查士丁尼法典》。材料中的“帝国”指',o:['波斯帝国','亚历山大帝国','拜占庭帝国','阿拉伯帝国'],a:2,e:'查士丁尼是东罗马（拜占庭）帝国皇帝，《查士丁尼法典》属其文治成就。'},
  {u:3,s:'2024·江苏常州·中考真题',q:'拜占庭帝国自14世纪初开始面临来自亚洲的新威胁，这里的“新威胁”是指',o:['阿拉伯帝国','法兰克王国','查理曼帝国','奥斯曼帝国'],a:3,e:'1453年奥斯曼帝国攻破君士坦丁堡，灭亡拜占庭帝国。'},
  {u:3,s:'2025·江苏镇江·中考真题',q:'“它保存了古典文化，并形成了独具特色的文化；1453年被奥斯曼帝国所灭。”材料中的“它”是',o:['亚历山大帝国','罗马帝国','阿拉伯帝国','拜占庭帝国'],a:3,e:'1453年灭亡、长期保存古典文化的帝国是拜占庭帝国。'},
  {u:2,s:'2024·山东聊城·中考真题',q:'裁判官说：“如果船员、客店店员、骡马店伙计未将旅客交给他们看管的物品完整无损地返还给旅客，那么，我将赋予这些旅客以诉权对抗船员、客店店员和骡马店伙计。”《罗马法大全》中的这些记载主要反映了罗马法',o:['重视物权保护','注重诉讼程序','倡导法律至上','保护人身安全'],a:0,e:'条文针对受委托保管的物品，强调完整返还，体现对物权的保护。'},
  {u:3,s:'2025·山东临沂·中考真题',q:'中世纪大学的课程包括文法、修辞、逻辑、算术、几何、天文、音乐，以及法学、医学、神学等。这说明中世纪大学',o:['兴起于欧洲文艺复兴运动时期','只有基础课程而没有专业课程','课程设置受到基督教会的影响','未反映经济和社会的发展要求'],a:2,e:'课程中神学居于重要地位，说明课程设置受基督教会影响。'},
  {u:3,s:'2022·湖北宜昌·中考真题',q:'西欧中世纪乡村的典型组织形式是庄园。下列符合庄园佃户生活情景的是',o:['无需缴纳“什一税”','通过庄园法庭维护自己的一些权益','免费使用领主的磨坊','无需为领主提供劳役'],a:1,e:'佃户可通过庄园法庭维护自身的一些权益；同时须为领主服劳役、向教会缴纳“什一税”，使用领主的磨坊等设施还要交费。'},
  {u:3,s:'2022·湖北宜昌·中考真题',q:'罗马法学成就辉煌，其中由查士丁尼组织编纂、奠定欧洲民法基础的是',o:['《汉谟拉比法典》','《十二铜表法》','《罗马民法大全》','《拿破仑法典》'],a:2,e:'查士丁尼组织编纂的《罗马民法大全》奠定了欧洲民法的基础。'},

  /* ==================== 第四单元 封建时代的亚洲国家（18题，本页2题） ==================== */
  {u:4,s:'2025·福建·中考真题',q:'日本僧人空海随第17次遣唐使入唐，回国后编撰《文镜秘府论》，创立日本汉诗学，满足了日本诗人把握唐诗形式和技巧的需求。这说明当时日本',o:['借鉴中国先进文化','社会动荡不安','幕府把持国家大权','典章制度建立'],a:0,e:'日本遣唐使学习唐朝文化，空海编撰诗学著作，体现借鉴中国文化。'},
  {u:4,s:'2025·内蒙古乌海·模拟',q:'12世纪晚期，源氏首领源赖朝获得“征夷大将军”称号，建立镰仓幕府，日本由此进入长达700年的幕府统治时期。在幕府统治时期，日本鲜明的政治特点是',o:['建立了以天皇为核心的中央集权','天皇与幕府轮流执政','建立起庄园制度','国家大权掌握在幕府将军手中'],a:3,e:'幕府将军实际把持国家大权，天皇成为名义上的统治者。'},
  {u:4,s:'2025·广东惠州·期末',q:'12世纪末，武士集团的首领源赖朝在镰仓设立幕府。镰仓幕府拥有独立于朝廷的政治、军事权力，日本由此进入幕府统治时期。幕府体制的建立',o:['与封建庄园的形成有密切联系','仿效了中国唐朝的政治制度','标志日本初步建立中央集权制','提升了地方政府的行政效率'],a:0,e:'庄园势力膨胀、庄园主豢养武士，武士集团壮大后建立幕府，二者联系密切。'},
  {u:4,s:'2024·山西·中考压轴',q:'幕府是古代日本的权力机构，曾一度凌驾于天皇之上。下列有关幕府统治的说法不正确的是',o:['幕府的最高首领是征夷大将军','幕府首领任命天皇','幕府统治在日本长达近700年','武士是幕府统治的基础'],a:1,e:'幕府将军名义上由天皇任命，实际大权在握；说幕府任命天皇不符合史实。'},
  {u:4,s:'2024·新疆·中考真题',q:'日本平城京和唐朝长安城的宫城都坐北朝南，都有东西两市、棋盘式街道，甚至连名称与走向都相同。能够解释这一现象的是',o:['大和政权的建立','幕府统治的强化','大化改新的影响','明治维新的推动'],a:2,e:'大化改新仿效唐朝典章制度，故都城规划与长安高度相似。'},
  {u:4,s:'2024·黑龙江牡丹江·中考真题',q:'“在世界历史上，很难在什么地方找到另一个自主的民族如此成功地有计划地汲取外国文明。”能够印证这一观点的是',o:['罗马扩张','城市自治','大学兴起','大化改新'],a:3,e:'大化改新有计划地学习中国隋唐制度，是主动汲取外国文明的典型。'},
  {u:4,s:'2024·山东青岛·中考真题',q:'“这个帝国的首都巴格达是座一流的大都市，是中世纪穆斯林世界的知识殿堂，它的繁华给《天方夜谭》里的故事提供了灵感。”这个帝国是',o:['亚历山大帝国','罗马帝国','拜占庭帝国','阿拉伯帝国'],a:3,e:'巴格达是阿拉伯帝国首都，《天方夜谭》是阿拉伯文学代表作。'},
  {u:4,s:'2024·黑龙江绥化·中考真题',q:'担当了沟通东西方文化的角色，为世界文化的发展作出了卓越贡献的是',o:['雅利安人','日耳曼人','阿拉伯人','意大利人'],a:2,e:'中国的造纸术、指南针、火药和印度的棉花、食糖等由阿拉伯人传入欧洲。'},
  {u:4,s:'2024·广西·中考真题',q:'阿拉伯帝国时期出现了“百年翻译运动”，学者翻译了大量的古印度、波斯和古希腊的医学、天文学、数学典籍。这有助于阿拉伯帝国',o:['科技的发展','文学的兴盛','社会的转型','制度的革新'],a:0,e:'翻译吸收各地科学典籍，直接推动阿拉伯帝国科技（医学、天文、数学）发展。'},
  {u:4,s:'2024·内蒙古呼和浩特·中考真题',q:'古代希腊罗马文化，在基督教文化垄断下的欧洲几乎荡然无存。而阿拉伯学者却通过翻译保存了大量的希腊学术著作，并把它们传回欧洲，弥补了欧洲文化的“断层”。可见阿拉伯人对欧洲文化的贡献是',o:['改头换面','破旧立新','承前启后','去伪存真'],a:2,e:'保存并传回希腊著作，起到承接古代、开启后世的作用。'},
  {u:4,s:'2025·吉林·中考真题',q:'某中学历史社团收集了“阿拉伯数字”“《医学集成》”“《天方夜谭》”等资料，他们研究的主题应是',o:['古代印度文明','古代希腊文明','阿拉伯文化成就','拜占庭文化'],a:2,e:'这些成果均属阿拉伯人创造或整理传播的文化成就。'},
  {u:4,s:'2024·湖北武汉·中考真题',q:'某班辩论会论据：数学方面将印度人创造的计数法改造成“阿拉伯数字”并传入欧洲；文学方面《天方夜谭》反映帝国境内各族人民以及印度、中国等东方各国人民的生活习俗；医学方面《医学集成》总结希腊、波斯和印度的医学知识。据此判断，辩论主题应是阿拉伯人',o:['注重法治建设','垄断亚欧贸易','建立国际秩序','沟通东西方文化'],a:3,e:'数学、文学、医学三方面论据都指向阿拉伯人沟通东西方文化的作用。'},
  {u:4,s:'2022·黑龙江大庆·中考真题',q:'中国文化直接影响着日本，推动日本进行改革。从646年开始，日本仿效唐朝的典章制度进行了一系列改革，使日本发展为中央集权的封建国家。这次改革是',o:['大化改新','彼得一世改革','废除农奴制改革','明治维新'],a:0,e:'646年（7世纪中期）日本仿效唐朝典章制度推行大化改新，使其发展为中央集权的封建国家。'},
  {u:4,s:'2022·江苏连云港·中考真题',q:'中国的造纸术、指南针、火药等重大发明和印度的棉花、食糖等，都是由阿拉伯人传入欧洲的。这折射出阿拉伯人致力于',o:['发明与创新','冒险与挑战','贸易与交流','统一与扩张'],a:2,e:'阿拉伯人担当了沟通东西方文化的角色，材料折射其致力于贸易与文化交流。'},
  {u:4,s:'2022·湖北宜昌·中考真题',q:'7—8世纪，唐朝西部有一个政教合一的政权，它迅速扩张为地跨亚、欧、非三大洲的帝国，并与唐朝发生了怛罗斯之战。该帝国是',o:['亚历山大帝国','罗马帝国','拜占庭帝国','阿拉伯帝国'],a:3,e:'8世纪中期阿拉伯帝国成为地跨亚、欧、非三洲的大帝国，政教合一，并曾与唐朝发生怛罗斯之战。'},
  {u:4,s:'改编·中考风格',q:'他创立了伊斯兰教，并把一盘散沙、四分五裂的阿拉伯民族联结成一个伟大的民族，基本统一阿拉伯半岛。他是',o:['穆罕默德','耶稣','乔达摩·悉达多','亚历山大'],a:0,e:'穆罕默德创立伊斯兰教并基本统一阿拉伯半岛。'},
  {u:4,s:'2022·重庆B卷·中考真题',q:'阿拉伯帝国极盛时期疆域横跨亚、非、欧三洲。下列相关表述正确的是',o:['阿拉伯国家兴起于两河流域','阿拉伯帝国首都巴格达扼守红海交通要冲','8世纪中期，地中海成为阿拉伯帝国的内湖','阿拉伯帝国地跨亚非欧，便于沟通东西方文化'],a:3,e:'8世纪中期阿拉伯帝国地跨亚非欧，为东西方文化交流提供了便利；阿拉伯国家兴起于阿拉伯半岛，巴格达位于底格里斯河畔，“地中海成为内湖”是罗马帝国时期的情况。'},
  {u:4,s:'2022·内蒙古呼和浩特·中考真题',q:'阿拉伯人为世界文化发展作出了卓越贡献。帝国时期，其文化发展的有利条件不包括',o:['伊斯兰教的多神崇拜','国家与社会发展繁荣','哈里发重视知识人才','吸收和消化外来文化'],a:0,e:'伊斯兰教信奉唯一的安拉，是严格的一神教，“多神崇拜”说法错误；其余三项都是阿拉伯文化繁荣的有利条件。'},

  /* ==================== 第五单元 走向近代（34题，本页24题） ==================== */
  {u:5,s:'2024·内蒙古兴安盟·中考真题',q:'“人文主义者讴歌现世生活，相信人的力量，认为人应当通过自己的努力和发挥自己的才能来创造幸福，这成为海外冒险事业的一种思想动力。”该材料反映了',o:['新航路开辟后世界整体的观念逐步确立起来','文艺复兴运动推动了欧洲文化思想领域的繁荣','新航路开辟客观上推动了文艺复兴运动发展','文艺复兴运动为新航路开辟提供了思想基础'],a:3,e:'材料强调人文主义成为海外冒险的思想动力，即文艺复兴为新航路开辟提供思想基础。'},
  {u:5,s:'2024·山东聊城·中考真题',q:'文艺复兴时期，达·芬奇的《蒙娜丽莎》、米开朗琪罗的《大卫》、拉斐尔的《西斯廷圣母》等传世艺术作品广为人知。这些艺术作品均体现了',o:['苦行禁欲观念','神权至上思想','人文主义精神','民主共和理念'],a:2,e:'作品刻画人性之美、人的力量与亲情，体现人文主义精神。'},
  {u:5,s:'2024·浙江·中考真题',q:'“这是人类以往从来没有经历过的一次最伟大的、进步的变革”（恩格斯语）。在这个时代，多才多艺和学识渊博的巨人要求建立一种以人为中心而不是以神为中心的生活哲学。这场运动不是简单的文化复兴，它被认为是',o:['电气时代的来临','全球化的出现','多极化趋势的发展','资本主义时代的曙光'],a:3,e:'文艺复兴以人文主义为核心，为资本主义时代到来奠定思想文化基础。'},
  {u:5,s:'2024·贵州黔西·中考真题',q:'14世纪中叶，文艺复兴运动在欧洲兴起，对“复兴”含义理解正确的是',o:['对古典文化的继承和创新','培养文学艺术的高端人才','借助神学来复兴宗教文化','单纯地恢复古罗马的文化'],a:0,e:'文艺复兴借助古希腊罗马文化外壳，实质是对古典文化的继承与创新。'},
  {u:5,s:'2024·贵州毕节·中考真题',q:'有学者估计，哥伦布航行美洲的总费用为200万马拉维迪，而哥伦布个人只筹措了25万马拉维迪，不足部分从西班牙国库预支，为此女王伊莎贝拉还曾打算把她王冠上的珠宝换钱。这说明新航路开辟',o:['受到文艺复兴运动影响','得到西班牙王室的支持','使大量财富流入西班牙','使世界连为了一个整体'],a:1,e:'王室出资支持哥伦布远航，说明新航路开辟得到西班牙王室支持。'},
  {u:5,s:'2024·山东聊城·中考真题',q:'1526年，一位非洲国王控诉说，葡萄牙人每天都在抓走本地人并将他们卖掉，“以至于我们国家的人口正在大量丧失”；1549年，巴西的种植园已经有了非洲人劳作的记录。这段材料可以佐证',o:['三角贸易的出现','工业革命的影响','奴隶制度的消亡','殖民争霸的加剧'],a:0,e:'葡萄牙人掳掠非洲人口卖往美洲种植园，正是三角贸易（黑奴贸易）的表现。'},
  {u:5,s:'2024·贵州铜仁·中考真题',q:'“三角贸易”反映了资本原始积累的野蛮性和残酷性。下列关于三角贸易航程路线表述正确的是',o:['欧洲→美洲→非洲→欧洲','欧洲→非洲→美洲→欧洲','非洲→欧洲→美洲→非洲','美洲→非洲→欧洲→美洲'],a:1,e:'出程欧洲运工业品到非洲，中程贩奴到美洲，归程运金银原料回欧洲。'},
  {u:5,s:'2025·陕西蒲城·一模',q:'“他创作出《神曲》，反对教皇独裁，成为文艺复兴运动的先驱。”“他”是',o:['但丁','莎士比亚','达·芬奇','苏格拉底'],a:0,e:'但丁的《神曲》揭露教会黑暗，他被视为文艺复兴的先驱。'},
  {u:5,s:'2025·陕西蒲城·一模',q:'下列新航路开辟示意图中（①好望角方向 ②美洲方向 ③印度方向 ④环球方向），哥伦布、麦哲伦的航行路线分别是',o:['①②','①③','②③','②④'],a:3,e:'哥伦布横渡大西洋到达美洲（②），麦哲伦船队完成环球航行（④）。'},
  {u:5,s:'2025·四川自贡·中考真题',q:'有学者认为：1492年开始了一场引人注目的大交换，这里的“大交换”指“新大陆”和“旧大陆”之间各种植物、动物以及疾病、宗教、文化、人口的互相传播和交流。这种交换始于',o:['郑和下西洋','哥伦布发现美洲','麦哲伦环球航行','三角贸易的开始'],a:1,e:'1492年哥伦布到达美洲，开启新旧大陆之间的物种与文化交流。'},
  {u:5,s:'2024·江苏苏州·中考真题',q:'统计图显示拉丁美洲土著人口在1492—1825年间锐减。拉美土著人口锐减的悲剧始于',o:['迪亚士到达好望角','哥伦布“发现”新大陆','达·伽马到达印度','麦哲伦船队环球航行'],a:1,e:'1492年哥伦布到达美洲后，欧洲殖民者在美洲的扩张使土著人口大量减少。'},
  {u:5,s:'2024·四川巴中·中考真题',q:'时空观念是历史学科的核心素养之一。在新航路开辟示意图中，证明地圆学说正确的航线是',o:['①迪亚士航线','②哥伦布航线','③达·伽马航线','④麦哲伦航线'],a:3,e:'麦哲伦船队首次完成环球航行，证明地圆学说正确。'},
  {u:5,s:'2025·四川江油·模拟',q:'菲律宾有一块双面碑，正面文字记载“1521年4月27日，拉普拉普和他的战士们在这里打退了西班牙入侵者，杀死了他们的首领……”根据所学知识判断，“他们的首领”是',o:['哥伦布','麦哲伦','迪亚士','达·伽马'],a:1,e:'1521年麦哲伦在菲律宾介入部落冲突被杀。'},
  {u:5,s:'2025·辽宁铁西·模拟',q:'1519年，一支船队从西班牙出发，绕过南美洲进入太平洋，1521年到达菲律宾群岛，之后经南印度洋绕过好望角，1522年回到西班牙。这次航行',o:['宣扬了明朝的国威','首赴美洲开辟新程','打败“无敌舰队”','证明地圆说的正确'],a:3,e:'1519—1522年麦哲伦船队完成首次环球航行，证明地圆学说。'},
  {u:5,s:'2025·江苏苏州·中考真题',q:'小明同学通过课外阅读得知：1500—1800年，美洲和大洋洲有近1亿人死于瘟疫。他组织同学们进行历史课程跨学科主题学习并选用了相关漫画。他们的学习主题最恰当的是',o:['人类对生态系统的破坏','新航路开辟的世界影响','殖民争霸开拓世界市场','横渡大西洋的蒸汽轮船'],a:1,e:'殖民扩张把疾病带入美洲导致瘟疫流行，属新航路开辟带来的世界性影响。'},
  {u:5,s:'2025·河北·中考真题',q:'同学们在“中外海路交通发展史”跨学科主题学习中搜集到新航路开辟示意图。该图所示历史事件的结束距今（以2025年计）',o:['500周年','503周年','530周年','535周年'],a:1,e:'新航路开辟以1522年麦哲伦船队返回西班牙为结束标志，距今503周年。'},
  {u:5,s:'2025·广东深圳·开学考',q:'18世纪后期，欧洲的朗姆酒、布匹、枪炮及其他金属制品被运到非洲，非洲的奴隶被运到美洲，美洲的蔗糖、烟草和金银被运到欧洲。这段话主要描述的是',o:['三角贸易','工业革命','太平洋贸易','新航路开辟'],a:0,e:'三大洲之间的循环贸易以贩卖黑奴为中心，即三角贸易。'},
  {u:5,s:'2024·黑龙江绥化·中考真题',q:'莎士比亚是文艺复兴时期著名的文学艺术家，他的代表作是',o:['《神曲》','《哈姆雷特》','《最后的晚餐》','《蒙娜丽莎》'],a:1,e:'《哈姆雷特》《罗密欧与朱丽叶》是莎士比亚的代表作。'},
  {u:5,s:'2024·湖北武汉·中考真题',q:'莎士比亚的《哈姆雷特》体现了文艺复兴时期的时代风貌和社会本质，巴尔扎克的《高老头》再现了法国19世纪早期纷繁复杂的社会图景。这两部作品的共同之处是',o:['抨击奴隶制度','讴歌工人运动','谴责殖民掠夺','反映社会现实'],a:3,e:'两部作品都关注并再现了各自时代的社会现实。'},
  {u:5,s:'2024·福建·中考真题',q:'17—18世纪，中国的瓷器、漆器和丝绸等产品为了输出欧洲，专门按照欧洲风格制造；欧洲的建筑、园林等装饰造型竞相采用中国题材和模仿中国风格。这反映了',o:['欧洲文化完全被中国文化取代','东西方文化相互交流影响','中国手工业技术领先世界','欧洲开始殖民扩张'],a:1,e:'中国产品迎合欧洲风格、欧洲艺术吸收中国元素，体现双向交流影响。'},
  {u:5,s:'2021·四川攀枝花·中考真题',q:'14世纪前后，西欧社会萌发新的生机，其在经济上的表现是',o:['庄园经济自给自足','自由放任理论产生','城市自治司法独立','雇工分工合作兴起'],a:3,e:'14世纪前后西欧出现租地农场和手工工场，雇工分工合作成为新的生产组织方式，是其经济上的新变化。'},
  {u:5,s:'改编·中考风格',q:'文艺复兴运动的核心思想是人文主义。下列言论最能体现人文主义的是',o:['人生来是有罪的，应禁欲苦修','人应当追求现实生活中的幸福与个性解放','教皇是上帝在人间的代表','君主权力来自神的授予'],a:1,e:'人文主义肯定人的价值与现世幸福，反对禁欲主义和神权至上。'},
  {u:5,s:'2021·黑龙江牡丹江·中考真题',q:'14世纪前后，欧洲兴起了文艺复兴运动，新兴的资产阶级提倡发扬人的个性，追求人在现实生活中的幸福。这次运动的核心思想是',o:['理性主义','人文主义','民族主义','个性主义'],a:1,e:'文艺复兴的核心思想是人文主义，强调人的价值与尊严、追求现实生活的幸福。'},
  {u:5,s:'改编·中考风格',q:'15世纪，奥斯曼帝国控制了连接亚欧的商路，对过往商品征收重税，使东方商品运到欧洲的价格成倍上涨。这一情况',o:['促使欧洲人寻找通往东方的新航路','直接导致工业革命爆发','使欧洲人放弃了海外贸易','促进了文艺复兴运动的兴起'],a:0,e:'传统商路受阻、商品价格暴涨，是欧洲人开辟新航路的重要经济动因。'},
  {u:5,s:'2022·福建·中考真题',q:'可可树原产于中南美洲，16和17世纪时被移植到东南亚和非洲，18世纪可可在欧洲成为一种非常受欢迎的饮料。据此可知，可可树被移植到其他大洲开始于',o:['阿拉伯帝国的扩张','文艺复兴运动的兴起','新航路的开辟','英国资产阶级革命爆发'],a:2,e:'新航路开辟打破了各大洲相互隔绝的状态，美洲的可可等物产由此传播到其他大洲。'},
  {u:5,s:'改编·中考风格',q:'17世纪，荷兰一度控制着波罗的海、印度及美洲的全部贸易，被称为“海上马车夫”。荷兰崛起的关键优势是',o:['最早开辟新航路','拥有庞大的商船队，垄断海上贸易','率先开展工业革命','占据美洲全部殖民地'],a:1,e:'庞大的商船队使荷兰垄断了当时的世界航运与贸易。'},
  {u:5,s:'2021·辽宁大连·中考真题',q:'有人评价某历史事件“开始了欧洲对世界征服和侵略的历史”。材料描述的历史事件是',o:['亚历山大东征','新航路开辟','英国工业革命','拿破仑远征'],a:1,e:'新航路开辟后欧洲国家相继走上殖民扩张道路，开启了欧洲对世界征服和侵略的历史。'},
  {u:5,s:'改编·中考风格',q:'新航路开辟后，欧洲与亚洲、非洲、美洲之间建立起直接的商业联系，往来日益密切。这表明新航路开辟',o:['使世界开始连为一个整体','消除了各国之间的矛盾','使欧洲封建制度得到巩固','结束了殖民扩张'],a:0,e:'各洲之间建立直接商业联系，世界开始连为一体。'},
  {u:5,s:'2021·福建·中考真题',q:'近代西方国家贩卖奴隶的过程中，奴隶死亡率一般为30%，最高达50%。幸存者被卖到美洲后，其劳动寿命平均仅7年左右。据此可知，奴隶贸易具有',o:['长期性','广泛性','复杂性','血腥性'],a:3,e:'极高的死亡率与极短的劳动寿命，直接反映出奴隶贸易的血腥性与残酷性。'},
  {u:5,s:'改编·中考风格',q:'西班牙、葡萄牙两国最先开启殖民扩张，其殖民掠夺所得财富未能转化为本国工业资本，主要原因是',o:['封建制度束缚，财富多用于贵族消费','殖民地物产贫瘠无利可图','禁止国内工商业发展','贸易路线长期中断'],a:0,e:'封建统治下财富被贵族挥霍消费，未能投入工业生产。'},
  {u:5,s:'2021·湖南永州·中考真题',q:'读“1570年前后墨西哥和秘鲁地区人口变动”图可知，该地区人口锐减。推知该地区人口锐减的主要原因是',o:['大批土著居民被卖为奴隶','黑奴贸易使非洲人口大量减少','殖民屠杀以及传染病致死','工业革命改变了世界人口分布'],a:2,e:'欧洲殖民者的屠杀与带去的传染病，使美洲印第安人大量死亡，导致该地区人口锐减。'},
  {u:5,s:'改编·中考风格',q:'下列文艺复兴时期的代表人物与其作品对应正确的是',o:['但丁——《哈姆雷特》','达·芬奇——《蒙娜丽莎》','莎士比亚——《神曲》','彼特拉克——《最后的晚餐》'],a:1,e:'《蒙娜丽莎》是达·芬奇的作品；《神曲》属但丁，《哈姆雷特》属莎士比亚。'},
  {u:5,s:'2021·江西·中考真题',q:'“如果行程顺利，到加勒比和美洲的目的地需要四至六周，这段旅程中，炎热、寒冷和疾病使‘活人货物’付出了沉重的代价。”材料体现了',o:['三角贸易的血腥','印第安人的悲惨处境','鸦片贸易的罪恶','世界市场的最终形成'],a:0,e:'“活人货物”指被贩运的非洲黑人，途中恶劣条件造成大量死亡，体现出三角贸易的血腥。'},
  {u:5,s:'2021·辽宁葫芦岛·中考真题',q:'在“三角贸易”中，凭借实力逐渐成为世界最大奴隶贩子的国家是',o:['葡萄牙','西班牙','英国','法国'],a:2,e:'18世纪，英国凭借强大的海军与商业实力，逐渐成为世界上最大的奴隶贩子。'},

  /* ==================== 第六单元 资本主义制度的初步确立（36题，本页30题） ==================== */
  {u:6,s:'2023·辽宁营口·中考真题',q:'欧美现代化的第一步是在政治领域首先迈出的，英国资产阶级革命是建立新政治制度的第一次尝试。这次尝试后确立的政治体制是',o:['民主集中制','民主共和制','联邦共和制','君主立宪制'],a:3,e:'1689年《权利法案》限制王权、保障议会权力，确立君主立宪制。'},
  {u:6,s:'2023·辽宁营口·中考真题',q:'在美国独立战争进程示意图中，1776年处应填写的内容是',o:['《独立宣言》','《宅地法》','《解放黑人奴隶宣言》','《共产党宣言》'],a:0,e:'1776年7月4日大陆会议发表《独立宣言》，宣告美国诞生。'},
  {u:6,s:'2023·辽宁营口·中考真题',q:'世界上第一部资产阶级成文宪法是',o:['《大宪章》','《人权宣言》','《权利法案》','1787年美国宪法'],a:3,e:'1787年美国宪法是世界上第一部资产阶级成文宪法。'},
  {u:6,s:'2023·辽宁抚顺等·中考真题',q:'它是世界上第一部资产阶级成文宪法，对后来许多国家的政治变革产生了重要影响。“它”指的是',o:['1787年美国宪法','《权利法案》','《全国工业复兴法》','《宅地法》'],a:0,e:'1787年美国宪法确立了联邦制、三权分立等原则，影响深远。'},
  {u:6,s:'2023·辽宁抚顺等·中考真题',q:'“英国几乎有半个世纪没有平静下来，直到1688年的所谓‘光荣革命’时为止。那几十年中的一系列激动人心的事件构成了英国革命。”以下属于英国革命中“激动人心的事件”的是',o:['攻占巴士底狱','雅各宾派专政','萨拉托加大捷','查理一世被推上断头台'],a:3,e:'英国革命中1649年查理一世被处死；其余三项分属法国革命与美国独立战争。'},
  {u:6,s:'2023·湖北十堰·中考真题',q:'下列各国的法律文献搭配正确的是',o:['英国——《权利法案》','法国——《独立宣言》','美国——《人权宣言》','俄国——《拿破仑法典》'],a:0,e:'《权利法案》属英国；《独立宣言》属美国，《人权宣言》《拿破仑法典》属法国。'},
  {u:6,s:'2023·湖北鄂州·中考真题',q:'美国1787年宪法规定：“本宪法所制定的立法权，均属合众国国会”“行政权力赋予美利坚合众国总统”“合众国的司法权属于一个最高法院以及由国会随时下令设立的低级法院”。宪法设计的美国政治体制的特点是',o:['君主立宪','三权分立','中央集权','地方分权'],a:1,e:'立法、行政、司法三权分别由不同机构行使，体现分权制衡（三权分立）。'},
  {u:6,s:'2023·湖北宜昌·中考真题',q:'这场革命“之所以重要，并不是因为它创造了一个独立的国家，而是因为它创造了一个新的、不同类型的国家……十三个州都正式通过了包括人权在内的宪法，这一宪法保证公民天赋的权利。”“这场革命”是',o:['美国独立战争','美国内战','法国大革命','英国资产阶级革命'],a:0,e:'建立联邦制共和国、以宪法保障公民权利的是美国独立战争。'},
  {u:6,s:'2023·内蒙古呼和浩特·中考真题',q:'某会议场景：时间是1787年，地点在费城，在场55人，平均年龄43岁，时人称这为一场“半神大会”。据此判断他们是在',o:['制定《权利法案》','起草《独立宣言》','讨论《人权宣言》','签署美国宪法'],a:3,e:'1787年各州代表在费城召开制宪会议，制定了美国宪法。'},
  {u:6,s:'2023·湖南株洲·中考真题',q:'下列与美国独立战争有关的事件按时间先后顺序排列正确的是①萨拉托加大捷 ②《独立宣言》发表 ③来克星顿枪声 ④英国承认美国独立',o:['①②③④','①③④②','③②①④','③①②④'],a:2,e:'1775年来克星顿枪声→1776年《独立宣言》→1777年萨拉托加大捷→1783年英国承认美国独立。'},
  {u:6,s:'2025·山东安丘·期末',q:'1777年，大陆会议通过《邦联条例》，由此建立起来的美国实际上不能称其为一个国家，只是一个四分五裂的地理上的概念。为解决此问题，美国',o:['发表《独立宣言》','颁布《宅地法》','制定1787年宪法','发表《解放黑人奴隶宣言》'],a:2,e:'邦联体制下中央政府软弱无力，1787年宪法确立联邦制以加强中央权力。'},
  {u:6,s:'2024·贵州黔南·中考真题',q:'《权利法案》规定：“凡未经议会同意，以国王权威停止法律或停止法律实施之僭越权力，为非法权力。”这一规定',o:['废除了英国君主制','推崇“君权神授”理论','限制了国王的权力','以人人生而平等为原则'],a:2,e:'该条款明确限制国王权力，确立议会权力高于王权的原则。'},
  {u:6,s:'2024·江西·中考真题',q:'1688年，英国结束了长期危机，在这一危机中英国人经过不懈斗争，获得了自由政治。材料中的“斗争”指英国',o:['对外殖民扩张','争夺欧洲霸权','资产阶级革命','爆发宪章运动'],a:2,e:'1688年“光荣革命”标志英国资产阶级革命的结束。'},
  {u:6,s:'2024·天津·中考真题',q:'制度的建立和完善都需要一个过程。从《大宪章》确立“王权有限”“王在法下”原则，到议会抨击国王专权引发内战，再到1689年通过《权利法案》，这一过程体现了',o:['英国君主立宪制的探索','俄国废除农奴制的改革','法国共和体制的形成','美国三权分立的确立'],a:0,e:'从限制王权到议会主权，逐步形成君主立宪制的历史过程。'},
  {u:6,s:'2025·黑龙江齐齐哈尔·中考真题',q:'英国在“光荣革命”后，建立的一种新的政治体制是',o:['封建君主专制','君主立宪制','联邦共和制','民主共和制'],a:1,e:'光荣革命后英国通过《权利法案》等确立君主立宪制。'},
  {u:6,s:'2024·四川南充·中考真题',q:'《人权宣言》是法国大革命的政治纲领，它被称为旧制度的“死亡证书”和新体制的“出生证书”。其历史进步性在于',o:['成为欧洲其他国家民法典蓝本','建立了君主立宪制度','确立了人权、法治等基本原则','保证了法国政局稳定'],a:2,e:'《人权宣言》宣告人权、法治、自由、平等和保护私有财产等基本原则。'},
  {u:6,s:'2024·山东临沂·中考真题',q:'“在法律面前，所有的公民都是平等的，故他们都能平等地按其能力担任一切官职、公共职位和职务，除德行和才能上的差别外，不得有其他差别。”（摘自《人权宣言》）据此可知该“宣言”',o:['反对公民拥有私有财产','认为所有公民没有差别','主张法律面前公民平等','受《拿破仑法典》影响'],a:2,e:'材料明确主张法律面前人人平等，按能力任职、不得有身份差别。'},
  {u:6,s:'2024·山东菏泽·中考真题',q:'“拿破仑的《民法典》虽然承认在法律面前人人平等，承认男女都享有同等的继承权，但它强调私有财产的神圣不可侵犯性。”这说明拿破仑颁布《民法典》的基本出发点是',o:['维护资产阶级利益','限制国王权力','建立资本主义制度','解决财政危机'],a:0,e:'强调私有财产神圣不可侵犯，实质是维护资产阶级的经济利益。'},
  {u:6,s:'2025·四川南充·中考真题',q:'“他在法国的15年统治有两个特点：国内改革和军事战役。前者巩固了革命成果，后者在邻国激起了一种民族主义反应，并最后导致他的垮台。”这位统治者是',o:['克伦威尔','罗伯斯庇尔','路易十六','拿破仑'],a:3,e:'拿破仑统治法国15年，既巩固大革命成果，也因对外战争最终失败。'},
  {u:6,s:'2025·河北·中考真题',q:'1804年《拿破仑法典》颁布实施。1825年美国路易斯安那州采用了该法典；之后丹麦、意大利等国的民法典都以该法典为基础；1888—1889年《西班牙民法典》也在体系上接受了该法典。这说明《拿破仑法典》',o:['仅适用于法国本土','对许多国家的立法产生重要影响','废除了私有制','确立了君主专制'],a:1,e:'多国以该法典为蓝本，说明其影响超出法国，成为近代民法典的范本。'},
  {u:6,s:'2025·江苏连云港·中考真题',q:'17、18世纪，资产阶级革命的时代来临，英、美、法三国分别通过《权利法案》《独立宣言》《人权宣言》。这些法律文件所体现的共同理念是',o:['否定封建专制','反对殖民统治','限制君主权力','法治取代人治'],a:3,e:'三者都以法律形式确立新秩序、取代个人统治，共同体现法治取代人治。'},
  {u:6,s:'2025·山东威海·中考真题',q:'马克思说：“1648年的革命是十七世纪对十六世纪的革命，1789年的革命是十八世纪对十七世纪的胜利……反映了当时整个世界的要求。”这里的“当时整个世界的要求”是指',o:['发展封建主义','反抗殖民统治','发展资本主义','发展社会主义'],a:2,e:'英法革命推翻封建制度、建立资产阶级政权，反映发展资本主义的世界潮流。'},
  {u:6,s:'2025·广东深圳·中考真题',q:'法国大革命前，“革命”一词主要表示“动乱”之意，是贬义词；法国大革命之后革命思潮兴起，“革命”成为褒义词。这一变化说明法国大革命',o:['仅是一场思想解放运动','传播了革命思想，冲击了旧观念','建立了君主立宪制度','消除了社会矛盾'],a:1,e:'“革命”词义褒化，反映大革命传播的革命思想对旧观念的冲击。'},
  {u:6,s:'2024·宁夏·中考真题',q:'有学者认为：“17世纪中期到19世纪初，革命改变了欧美的社会。”材料中的“改变”在政治方面的主要体现是',o:['欧洲中世纪大学的兴起','欧洲文化传播到其他地区','资本主义制度相继确立','第二次工业革命快速发展'],a:2,e:'英、美、法等国通过革命相继确立资本主义制度。'},
  {u:6,s:'2024·内蒙古兴安盟·中考真题',q:'时间轴呈现了17—18世纪主要资本主义国家的部分重大历史事件：光荣革命、来克星顿枪声、巴黎人民攻占巴士底狱。这些事件反映的时代潮流是',o:['进行资产阶级革命','反抗外国殖民侵略','推翻本国封建统治','进行资产阶级改革'],a:0,e:'三件事均属早期资产阶级革命，反映资产阶级革命的时代潮流。'},
  {u:6,s:'改编·中考风格',q:'1640年英国议会重新召开，议员们抨击国王专权，国王派军队搜捕议员，挑起了内战。这场内战的结果之一是',o:['确立了君主立宪制','查理一世被推上断头台','英国宣布为共和国并长期稳定','议会权力被取消'],a:1,e:'1649年查理一世被处死，英国宣布为共和国；君主立宪制确立于1689年。'},
  {u:6,s:'2022·湖北·中考真题',q:'代表们既想建立一个有足够权威的中央政府，又要竭力保护各州已经拥有的重要权力……正因为有这些忧虑，这部法律格外注重权力的分割与制约。材料中的“这部法律”是指',o:['《人权宣言》','1787年宪法','《权利法案》','《拿破仑法典》'],a:1,e:'1787年美国宪法确立三权分立、相互制衡的原则，既加强了中央权威，又保障了各州的权力。'},
  {u:6,s:'改编·中考风格',q:'1789年7月14日，巴黎民众攻占了象征封建专制的巴士底狱。这一事件',o:['标志法国大革命开始','标志法国共和国建立','标志拿破仑帝国建立','标志《人权宣言》颁布'],a:0,e:'攻占巴士底狱标志法国大革命的爆发，这一天后来成为法国国庆日。'},
  {u:6,s:'2022·湖北宜昌·中考真题',q:'1821年，一位希腊游击队首领宣称：“法国革命和拿破仑的所作所为使世人知道了真相。以前，人民曾认为国王是地球上的神……通过现在这一变化，统治人民更困难了。”该言论表明，法国大革命',o:['传播了资产阶级自由民主思想','扼制了欧洲社会主义发展','体现了废除旧制度的不彻底性','呈现了革命过程的反复性'],a:0,e:'材料说明自由民主思想已深入人心；法国大革命摧毁了法国的君主统治，传播了资产阶级自由民主思想，具有世界性影响。'},
  {u:6,s:'改编·中考风格',q:'英国资产阶级革命中，克伦威尔率议会军打败国王军队，后来就任“护国主”，实行独裁统治。这一史实说明',o:['英国革命一帆风顺','革命过程中出现曲折与反复','英国确立了共和制','议会权力得到加强'],a:1,e:'革命中出现独裁与王朝复辟，说明资产阶级革命具有曲折性。'},
  {u:6,s:'改编·中考风格',q:'1688年，英国议会中的政治派别联合发动政变，废黜詹姆士二世，迎立威廉和玛丽为国王，史称“光荣革命”。这场革命之所以被称为“光荣”，是因为',o:['没有发生流血冲突','彻底废除了君主','由人民直接发动','建立了共和国'],a:0,e:'因未发生流血冲突，史称“光荣革命”。'},
  {u:6,s:'2022·云南·中考真题',q:'17、18世纪，资产阶级革命的时代来临。其中既是一次民族解放战争，也是一场资产阶级革命的是',o:['法国大革命','英国资产阶级革命','美国独立战争','1861年俄国农奴制改革'],a:2,e:'美国独立战争既推翻了英国的殖民统治、实现了国家独立，又为资本主义发展扫清了道路，具有双重性质。'},
  {u:6,s:'改编·中考风格',q:'华盛顿领导北美人民赢得独立战争胜利，并当选为美国第一任总统，被誉为“美国国父”。他的主要贡献是',o:['起草《人权宣言》','领导独立战争并主持制定1787年宪法','建立法兰西第一帝国','颁布《解放黑人奴隶宣言》'],a:1,e:'华盛顿领导独立战争，并主持费城制宪会议制定1787年宪法。'},
  {u:6,s:'改编·中考风格',q:'拿破仑的对外战争一方面打击了欧洲的封建势力，传播了革命思想；另一方面也损害了被侵略国家人民的利益。这说明拿破仑战争',o:['只具有侵略性','具有双重性','完全正义','与革命无关'],a:1,e:'拿破仑战争既有传播革命思想的进步性，也有侵略奴役他国的落后性。'},
  {u:6,s:'2022·广西贵港·中考真题',q:'英国资产阶级革命、美国独立战争和法国大革命三个历史事件的相同目标是',o:['建立资产阶级统治','打击欧洲封建势力','实现民族解放独立','废除君主专制制度'],a:0,e:'三国革命都推翻了旧制度（封建专制或殖民统治），为资本主义发展扫清道路，共同目标是建立资产阶级统治；B、D 属英法革命的内容，C 是美国独立战争的结果。'},
  {u:6,s:'改编·中考风格',q:'1775年4月19日凌晨，北美来克星顿的枪声打破了宁静，北美人民与英国军队发生交火。这一事件',o:['标志美国独立战争开始','标志美国诞生','是美国独立战争的转折点','标志英国承认美国独立'],a:0,e:'来克星顿枪声标志美国独立战争的开始。'},

  /* ==================== 第七单元 工业革命和国际共产主义运动的兴起（34题） ==================== */
  {u:7,s:'2025·四川广安·中考真题',q:'“市场总是在扩大，需求总是在增加。甚至工场手工业也不再能满足需要了。于是，蒸汽和机器引起了工业生产的革命。”这表明工业革命源于',o:['原有生产方式不能满足市场需求','新航路开辟为世界市场形成创造条件','“光荣革命”后资产阶级掌握政权','殖民扩张推动欧洲资本原始积累完成'],a:0,e:'市场需求扩大而工场手工业无法满足，直接推动大机器生产取代手工劳动。'},
  {u:7,s:'2025·中考真题（改编）',q:'18世纪60年代，工业革命最早开始于英国的棉纺织业。1765年，哈格里夫斯发明了一种一次能纺出多根纱线的纺纱机，他把这种纺纱机命名为',o:['飞梭','珍妮机','蒸汽机','水力织布机'],a:1,e:'哈格里夫斯发明的纺纱机以女儿“珍妮”命名，标志工业革命的开始。'},
  {u:7,s:'2025·四川自贡·中考真题',q:'从前车马很慢，人力畜力有局限。第一次工业革命后，火车的发明为人们提供了便捷廉价的交通工具，汽船的发明加强了洲际联系，开创了交通新纪元。新式交通工具的革新有赖于',o:['蒸汽机的改良','电力广泛应用','内燃机的发明','化学工业兴起'],a:0,e:'瓦特改良蒸汽机为火车、汽船提供了动力，故交通革新有赖于蒸汽机的改良。'},
  {u:7,s:'2022·江苏常州·中考真题',q:'“市场总是在扩大，需求总是在增加。甚至工场手工业也不再能满足需要了。于是，蒸汽和机器引起了工业生产的革命。”这揭示了',o:['“光荣革命”的影响','资本主义萌芽的出现','工业革命的背景','美国独立战争的起因'],a:2,e:'市场扩大与需求增加使工场手工业无法满足需要，这揭示了工业革命兴起的背景。'},
  {u:7,s:'2025·四川南充·中考真题',q:'1820年，英国的手摇纺纱机工人有24万人，到1840年减至12.3万人，到1856年只剩下3000人。这一变化的主要原因是',o:['工资待遇降低','机器生产代替了手工劳动','工作环境恶劣','传统手工技艺缺乏传承者'],a:1,e:'工业革命后机器生产取代手工劳动，手工业者大量失业或转岗。'},
  {u:7,s:'2025·山东临沂·中考真题',q:'铁路时代的到来为社会提供了更为快捷、廉价、便利的交通，使生产和市场之间的联系变得更加密切。该“时代”开始的标志是',o:['哈格里夫斯发明了“珍妮机”','瓦特改进的蒸汽机投入使用','斯蒂芬森试验蒸汽机车成功','戴姆勒研制出了汽油内燃机'],a:2,e:'斯蒂芬森试验蒸汽机车成功，标志铁路时代开始。'},
  {u:7,s:'2022·四川泸州·中考真题',q:'创作于1858年的漫画《泰晤士老爹的子女》中，泰晤士河化为一位衰朽的“老爹”，携带着患霍乱、白喉等疾病的“子女”。该漫画反映了',o:['工业革命提高社会生产力水平','科学研究与工业生产紧密结合','工业革命带来严重的环境污染','石油开采与石油化工飞速发展'],a:2,e:'漫画以拟人手法表现泰晤士河的严重污染及其引发的疾病，反映工业革命造成的环境污染问题。'},
  {u:7,s:'2023·福建·中考真题',q:'1821年，英国工业产值超过农业；1850年，英国工业总产值占世界的三分之一。推动上述现象出现的科技因素是',o:['《权利法案》','君主立宪','启蒙运动','工业革命'],a:3,e:'工业革命极大提高生产力，推动英国工业产值迅速增长。'},
  {u:7,s:'2022·黑龙江牡丹江·中考真题',q:'1848年在伦敦出版的一份宣言成为“所有国家千百万工人共同的纲领，全部社会主义文献中传播最广和最国际性的著作”。该宣言',o:['宣告了北美殖民地的独立','标志着马克思主义的诞生','促进了现代工厂制的出现','调动了黑人奴隶的积极性'],a:1,e:'1848年《共产党宣言》在伦敦发表，标志着马克思主义的诞生。'},
  {u:7,s:'2025·陕西·中考真题',q:'英国工业革命发生的历史条件示意图中，“政治前提”处应填入的内容是',o:['《权利法案》','《独立宣言》','《人权宣言》','《拿破仑法典》'],a:0,e:'1689年《权利法案》确立君主立宪制，为工业革命提供政治前提。'},
  {u:7,s:'2025·四川眉山·中考真题',q:'19世纪前期，西方人关于经济的思考发生变化，非洲越来越被视为各种原材料的产地，也是工业制品的市场，而不再仅仅是奴隶的来源地，大西洋奴隶贸易整体呈下滑趋势。据此可知，奴隶贸易出现整体下滑趋势的重要原因是',o:['工业革命','美国独立战争','经济全球化','启蒙运动'],a:0,e:'工业革命需要原料产地与商品市场，使非洲角色转变，奴隶贸易随之衰落。'},
  {u:7,s:'2025·吉林·中考真题',q:'某同学课堂笔记记载：时间1848年；人物马克思、恩格斯；意义标志着马克思主义的诞生。“事件”处应填入的是',o:['发表《共产党宣言》','出版《资本论》','成立“第一国际”','唱响《国际歌》'],a:0,e:'1848年《共产党宣言》发表，标志马克思主义诞生。'},
  {u:7,s:'2024·江西南昌·期末',q:'经济史学家诺斯一生致力于回答“为什么有的人穷，而有的人富”。其实早在171年前，有两位伟人在他们联合发表的专著中就做出了回答。这一专著是',o:['《权利法案》','《人民宪章》','《共产党宣言》','《国际歌》'],a:2,e:'1848年马克思、恩格斯联合发表《共产党宣言》，揭示资本主义社会的发展规律。'},
  {u:7,s:'2024·广东广州·中考真题',q:'1848—1917年的社会主义发展历程主要包括《共产党宣言》的发表、巴黎公社的建立、俄国十月革命的发生等重大事件。这一时期世界社会主义发展的主题是',o:['社会主义思想从空想到科学','社会主义制度从一国到多国','社会主义运动从理论到实践','社会主义革新从地区到全球'],a:2,e:'《共产党宣言》标志理论形成，巴黎公社与十月革命是实践，故主题是从理论到实践。'},
  {u:7,s:'2025·天津·中考真题',q:'“战斗不息、流血牺牲的巴黎……正放射着它的历史首创精神的光芒。”材料评述的历史事件是',o:['马克思主义诞生','“第一国际”成立','巴黎公社成立','十月革命胜利'],a:2,e:'巴黎公社是世界上第一个无产阶级政权，体现“历史首创精神”。'},
  {u:7,s:'2023·山东烟台·中考真题',q:'19世纪40年代诞生的马克思主义，是西欧资本主义的物质生产、阶级斗争、思想文化和自然科学发展到一定水平的产物，也是马克思、恩格斯根据时代发展和无产阶级解放斗争的需要而进行的理论创新。据此可知，马克思主义',o:['是理论与实践相结合的产物','完全依靠个人天才创造','与工人运动无关','诞生于20世纪初'],a:0,e:'马克思主义是时代条件与革命实践需要结合的产物，并非凭空创造。'},
  {u:7,s:'2023·辽宁·中考真题',q:'19世纪中期，成为世界上第一个工业国家的是',o:['英国','法国','美国','德国'],a:0,e:'19世纪中期英国率先完成工业革命，成为世界上第一个工业国家。'},
  {u:7,s:'2023·山东潍坊·模拟',q:'1851年，英国就业女性283万余人，30年后就业女性达388万人，女工约占工业劳动力的25%，分布在纺织、服装、采矿、金属、帮佣、造纸、印刷、食品等行业。这种现象产生的根源是',o:['技术发展进步，妇女角色转变','民主政治进步，女权意识增强','社会分工细化，妇女思想解放','对外殖民扩张，男性远离故乡'],a:0,e:'机器生产降低了体力门槛，为妇女提供大量就业机会，根源在于技术进步。'},
  {u:7,s:'2025·四川资阳·模拟',q:'19世纪中叶，英国在工业化方面的领先地位，得之于新的生产组织结构的创新，并不亚于机器之出现。下面能体现这一“创新”的是',o:['珍妮机','工厂制度','蒸汽机','火车机车'],a:1,e:'新的“生产组织结构创新”指近代工厂制度。'},
  {u:7,s:'2024·原创·中考风格',q:'在工业革命过程中，解决动力问题是关键。对“工业革命动力演进示意图”中改良蒸汽机作出重要贡献的是',o:['凯伊','哈格里夫斯','斯蒂芬森','瓦特'],a:3,e:'瓦特改进蒸汽机，为其广泛应用作出关键贡献。'},
  {u:7,s:'2024·安徽·中考真题',q:'18、19世纪，英格兰的一些小村落发展为人口稠密的城镇，“烟囱让古老的塔尖相形见绌……北部铺上了第一条铁轨，迎接新火车头的到来，蒸汽货轮开始在入海口和海峡上定期往来。”上述现象的出现主要由于',o:['文艺复兴的开展','新航路开辟','工业革命的进行','殖民扩张的加剧'],a:2,e:'工厂、铁轨、蒸汽轮船等景象都是工业革命推动的结果。'},
  {u:7,s:'2024·四川成都·中考真题',q:'18世纪中期，英国工厂主要分布在水流湍急的乡村。1780年到1830年间，工厂从乡村转移出来，逐渐集中到城市和交通便捷之处。出现这一变化的主要原因是',o:['水力资源的枯竭','蒸汽机的广泛应用','工人运动的兴起','铁路大量修建'],a:1,e:'蒸汽机摆脱了对水力的依赖，工厂得以在城市与交通便利处集中。'},
  {u:7,s:'2023·湖北天门·中考真题',q:'“1820年，英国的手摇纺纱机工人有240000人，到1840年减至123000人，到1856年时只剩下3000人。其中部分工人找到了操作新式动力织布机的工作，但是许多人因不能适应这样的变化而陷入贫困。”出现这种变化的主要原因是',o:['英国工业革命后工人产生了抵触情绪','工业革命后机器生产代替了手工劳动','第二次工业革命后出现新兴工业部门','环境恶劣导致从事手工劳动人数减少'],a:1,e:'机器大生产取代手工劳动，是手工业者人数锐减、生活困顿的直接原因。'},
  {u:7,s:'2023·曲阜·模拟',q:'18世纪中期，英国的海外市场不断扩大，越来越多的商品销往海外，原有的手工生产方式已不能满足大规模商品生产的需要，因而引发了',o:['技术发明的热潮','资产阶级革命','交通工具的变革','工人运动兴起'],a:0,e:'市场需求推动技术革新，引发了发明创造的热潮。'},
  {u:7,s:'2021·内蒙古赤峰·中考真题',q:'“这场革命在人类历史上首次创造了一幅烟囱多于教堂尖顶的图景……从家庭手工业过渡到大工厂生产。”材料中的“这场革命”指的是',o:['英国资产阶级革命','美国独立战争','法国大革命','工业革命'],a:3,e:'“烟囱多于教堂尖顶”“从家庭手工业过渡到大工厂生产”等描述，指向工业革命带来的生产方式变革。'},
  {u:7,s:'改编·中考风格',q:'瓦特改进的蒸汽机在1785年投入使用后，“使人类进入了一个新的时代”。这个“新时代”是指',o:['蒸汽时代','电气时代','信息时代','铁路时代'],a:0,e:'蒸汽机的广泛应用使人类进入“蒸汽时代”。'},
  {u:7,s:'2021·广东广州·中考真题',q:'19世纪英国和爱尔兰曾存在专职叫人起床上班的“叫醒工”，他们每天早上挨家挨户拜访客户，或用短棍敲门或用长杆敲窗，直到把客户叫醒为止。这一现象的存在主要是因为',o:['欧洲大学的兴起','工人运动的需要','《人权宣言》的发表','现代工厂制度的确立'],a:3,e:'现代工厂制度确立后，工人必须按统一的作息时间上下班，“叫醒工”正是这一制度下的产物。'},
  {u:7,s:'改编·中考风格',q:'工业革命极大地提高了社会生产力水平，人类进入“蒸汽时代”。下列对工业革命影响表述不正确的是',o:['促进了人口增长与城市化','推动了大众教育的推广','造成了环境污染','缩小了贫富差距'],a:3,e:'工业革命加剧了贫富分化，而非缩小贫富差距。'},
  {u:7,s:'改编·中考风格',q:'到1840年前后，英国的大机器生产已基本取代工场手工业。这一时间节点的意义是',o:['英国成为世界上第一个工业国家','英国确立了君主立宪制','英国完成了资产阶级革命','英国成为“海上马车夫”'],a:0,e:'1840年前后英国率先完成工业革命，成为世界上第一个工业国家。'},
  {u:7,s:'2021·四川雅安·中考真题',q:'马克思和恩格斯在广泛吸收人类优秀思想成果的基础上，总结工人运动的经验，共同创立了富有生命力的马克思主义。这表明马克思主义',o:['是理论与实践的产物','指导了各国无产阶级革命','是唯一科学的理论','推动了巴黎公社的建立'],a:0,e:'马克思主义既吸收了人类优秀思想成果（理论来源），又总结了工人运动的经验（实践基础），是理论与实践相结合的产物。'},
  {u:7,s:'改编·中考风格',q:'1864年，英、法、德等国的工人代表联合成立了国际工人协会，史称“第一国际”。它的成立说明',o:['工人阶级的斗争开始走向国际联合','社会主义制度已经建立','无产阶级已经取得政权','资本主义制度被推翻'],a:0,e:'第一国际的成立标志国际工人运动进入一个新的历史时期，工运走向国际联合。'},
  {u:7,s:'改编·中考风格',q:'1871年，巴黎人民举行武装起义，推翻了资产阶级反动统治，建立了世界上第一个无产阶级政权。这一政权是',o:['第一国际','巴黎公社','苏维埃俄国','法兰西第一帝国'],a:1,e:'1871年建立的巴黎公社是世界上第一个无产阶级政权。'},
  {u:7,s:'改编·中考风格',q:'《共产党宣言》指出，资本主义社会必将被没有阶级剥削和压迫的共产主义社会所取代。这一论断',o:['揭示了社会发展规律','否认了阶级斗争','主张改良资本主义','认为革命没有必要性'],a:0,e:'《共产党宣言》揭示资本主义必然灭亡、共产主义必然胜利的社会发展规律。'},
  {u:7,s:'改编·中考风格',q:'《共产党宣言》的发表标志着马克思主义的诞生。此后，无产阶级的斗争',o:['失去了理论指导','进入了一个新的历史时期','立即在各国取得胜利','不再需要工人阶级政党'],a:1,e:'马克思主义为国际工人运动提供科学理论指导，使无产阶级斗争进入新阶段。'},
];

</script>
<script>
/**
 * 世界历史九上 · 单机刷题（纯本地，无网络依赖）
 * ---------------------------------------------------------------
 * 功能：单元筛选 → 题量/顺序设置 → 即时判分与解析 → 答题卡跳题
 *      → 错题本（本地保存、可重刷、答对可移除）→ 成绩统计与历史记录
 * 数据全部存本机浏览器 localStorage，不上传任何服务器。
 */
const UNITS = [
  { id: 1, name: '古代亚非文明', lessons: '第1—3课' },
  { id: 2, name: '古代欧洲文明', lessons: '第4—6课' },
  { id: 3, name: '封建时代的欧洲', lessons: '第7—10课' },
  { id: 4, name: '封建时代的亚洲国家', lessons: '第11—12课' },
  { id: 5, name: '走向近代', lessons: '第13—16课' },
  { id: 6, name: '资本主义制度的初步确立', lessons: '第17—19课' },
  { id: 7, name: '工业革命和国际共产主义运动的兴起', lessons: '第20—21课' }
];
const KEYS = ['A', 'B', 'C', 'D'];
const LS_WRONG = 'hq_wrong_v1';
const LS_HIST = 'hq_history_v1';

const S = {
  view: 'setup',            // setup | quiz | result | wrong
  units: [1, 2, 3, 4, 5, 6, 7],
  size: 20,                 // 10 | 20 | 30 | 50 | all
  random: true,             // 抽题顺序
  shuffleOpts: true,        // 选项乱序
  queue: [],                // [{qi, ord:[..], ans}]
  cur: 0,
  picks: [],                // 每题所选（显示位次），未答为 -1
  judge: [],                // 是否已判
  startTs: 0,
  lastResult: null,
  wrongOnly: false
};

/* ---------------- 存储 ---------------- */
function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 空间不足等忽略 */ }
}
function getWrong() { return readJSON(LS_WRONG, {}); }
function setWrong(w) { writeJSON(LS_WRONG, w); }
function getHist() { return readJSON(LS_HIST, []); }
function qkey(q) { return q.q.slice(0, 24) + '#' + q.u; }

/* ---------------- 工具 ---------------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.prototype.slice.call(document.querySelectorAll(sel));
function esc(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function unitName(u) {
  const it = UNITS.filter((x) => x.id === u)[0];
  return it ? '第' + '一二三四五六七'[u - 1] + '单元 · ' + it.name : '第' + u + '单元';
}
function isReal(q) { return !/改编|原创/.test(q.s); }
function fmtTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? m + '分' + s + '秒' : s + '秒';
}
function today() {
  const d = new Date();
  const p = (n) => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------------- 组卷 ---------------- */
function buildQueue(poolIdx) {
  const pool = poolIdx.map((qi) => {
    const ord = S.shuffleOpts ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
    return { qi, ord, ans: ord.indexOf(QUESTIONS[qi].a) };
  });
  if (S.random) return shuffle(pool);
  return pool;
}

function startQuiz() {
  const idx = [];
  QUESTIONS.forEach((q, i) => { if (S.units.indexOf(q.u) >= 0) idx.push(i); });
  if (!idx.length) { alert('请至少选择一个单元'); return; }
  let queue = buildQueue(idx);
  if (S.size !== 'all') {
    if (!S.random) {
      // 顺序模式：按单元顺序取前 N 题，保证从头开始刷
      const ordered = idx.map((qi) => {
        const ord = S.shuffleOpts ? shuffle([0, 1, 2, 3]) : [0, 1, 2, 3];
        return { qi, ord, ans: ord.indexOf(QUESTIONS[qi].a) };
      });
      queue = ordered.slice(0, Number(S.size));
    } else {
      queue = queue.slice(0, Number(S.size));
    }
  }
  S.queue = queue;
  S.cur = 0;
  S.picks = queue.map(() => -1);
  S.judge = queue.map(() => false);
  S.startTs = Date.now();
  S.wrongOnly = false;
  S.view = 'quiz';
  render();
}

function startWrongOnly() {
  const wrong = getWrong();
  const idx = [];
  QUESTIONS.forEach((q, i) => { if (wrong[qkey(q)]) idx.push(i); });
  if (!idx.length) { alert('错题本是空的，先去刷题吧'); return; }
  S.queue = buildQueue(idx);
  S.cur = 0;
  S.picks = S.queue.map(() => -1);
  S.judge = S.queue.map(() => false);
  S.startTs = Date.now();
  S.wrongOnly = true;
  S.view = 'quiz';
  render();
}

/* ---------------- 判分 ---------------- */
function pick(displayIdx) {
  const item = S.queue[S.cur];
  if (S.judge[S.cur]) return;
  S.picks[S.cur] = displayIdx;
  S.judge[S.cur] = true;
  const q = QUESTIONS[item.qi];
  const right = displayIdx === item.ans;
  const wrong = getWrong();
  const k = qkey(q);
  if (right) {
    if (S.wrongOnly && wrong[k]) { delete wrong[k]; setWrong(wrong); }   // 错题已掌握 → 移出
  } else {
    wrong[k] = {
      u: q.u, s: q.s, q: q.q, o: q.o, a: q.a, e: q.e,
      cnt: (wrong[k] ? wrong[k].cnt : 0) + 1, ts: Date.now()
    };
    setWrong(wrong);
  }
  render();
}

function go(delta) {
  const n = S.cur + delta;
  if (n < 0 || n >= S.queue.length) return;
  S.cur = n;
  render();
}
function jump(i) { S.cur = i; render(); }

function finish() {
  const answered = S.judge.filter(Boolean).length;
  let right = 0;
  const perUnit = {};
  S.queue.forEach((item, i) => {
    const q = QUESTIONS[item.qi];
    if (!perUnit[q.u]) perUnit[q.u] = { total: 0, right: 0 };
    perUnit[q.u].total++;
    if (S.judge[i] && S.picks[i] === item.ans) { right++; perUnit[q.u].right++; }
  });
  const secs = Math.max(1, Math.round((Date.now() - S.startTs) / 1000));
  S.lastResult = { total: S.queue.length, answered, right, secs, perUnit, ts: Date.now() };
  const hist = getHist();
  hist.unshift({ ts: Date.now(), time: today(), total: S.queue.length, right, secs, wrongOnly: S.wrongOnly });
  writeJSON(LS_HIST, hist.slice(0, 30));
  S.view = 'result';
  render();
}

/* ---------------- 渲染 ---------------- */
function render() {
  const app = $('#app');
  if (S.view === 'setup') app.innerHTML = viewSetup();
  else if (S.view === 'quiz') app.innerHTML = viewQuiz();
  else if (S.view === 'result') app.innerHTML = viewResult();
  else if (S.view === 'wrong') app.innerHTML = viewWrong();
  window.scrollTo(0, S.view === 'quiz' ? 0 : window.scrollY);
  if (S.view === 'quiz') {
    const el = $('#sheetCard');
    if (el) el.dataset.n = S.queue.length;
  }
  const pct = $('#progFill');
  if (pct) pct.style.width = (S.queue.length ? Math.round((S.cur + 1) / S.queue.length * 100) : 0) + '%';
}

function viewSetup() {
  const counts = {};
  QUESTIONS.forEach((q) => { counts[q.u] = (counts[q.u] || 0) + 1; });
  const realCount = QUESTIONS.filter(isReal).length;
  const wrongN = Object.keys(getWrong()).length;
  const hist = getHist();
  const unitHtml = UNITS.map((u) => {
    const on = S.units.indexOf(u.id) >= 0 ? ' on' : '';
    return '<div class="unit-chip' + on + '" data-u="' + u.id + '">' +
      '<span>第' + '一二三四五六七'[u.id - 1] + '单元 ' + esc(u.name) + '</span>' +
      '<span class="n">' + counts[u.id] + '题 · ' + u.lessons + '</span></div>';
  }).join('');

  const sizeHtml = [10, 20, 30, 50, 'all'].map((s) =>
    '<button class="' + (String(S.size) === String(s) ? 'on' : '') + '" data-size="' + s + '">' +
    (s === 'all' ? '全部' : s + '题') + '</button>').join('');
  const orderHtml = '<button class="' + (S.random ? 'on' : '') + '" data-order="random">随机</button>' +
    '<button class="' + (!S.random ? 'on' : '') + '" data-order="seq">按顺序</button>';
  const optHtml = '<button class="' + (S.shuffleOpts ? 'on' : '') + '" data-opt="shuffle">随机打乱</button>' +
    '<button class="' + (!S.shuffleOpts ? 'on' : '') + '" data-opt="keep">固定 A-D</button>';

  const histHtml = hist.length ? hist.slice(0, 8).map((h) =>
    '<tr><td>' + esc(h.time) + '</td><td>' + (h.wrongOnly ? '错题重刷' : '常规') + '</td>' +
    '<td class="num">' + h.right + ' / ' + h.total + '</td>' +
    '<td class="num">' + Math.round(h.right / h.total * 100) + '%</td>' +
    '<td class="num">' + fmtTime(h.secs) + '</td></tr>').join('')
    : '<tr><td colspan="5" class="empty">还没有记录，开刷后会自动保存</td></tr>';

  return '' +
    '<div class="card">' +
    '  <h2>题库范围</h2>' +
    '  <div class="sub">统编版《世界历史》九年级上册 · 7 个单元 21 课 · 共 ' + QUESTIONS.length + ' 题（中考真题/模拟 ' + realCount + ' 题，改编 ' + (QUESTIONS.length - realCount) + ' 题）</div>' +
    '  <div class="units">' + unitHtml + '</div>' +
    '  <div class="row"><span class="label">快速选择</span>' +
    '    <button class="btn sm" id="allUnits">全选</button>' +
    '    <button class="btn sm" id="noneUnits">全不选</button>' +
    '    <button class="btn sm" id="only567">近现代史(五~七单元)</button>' +
    '  </div>' +
    '  <div class="row"><span class="label">本轮题量</span><div class="seg">' + sizeHtml + '</div></div>' +
    '  <div class="row"><span class="label">出题顺序</span><div class="seg">' + orderHtml + '</div></div>' +
    '  <div class="row"><span class="label">选项顺序</span><div class="seg">' + optHtml + '</div></div>' +
    '  <div class="row" style="margin-top:16px">' +
    '    <button class="btn primary" id="start" style="flex:1;padding:12px">开始刷题</button>' +
    '    <button class="btn" id="wrongBook">错题本' + (wrongN ? '（' + wrongN + '）' : '') + '</button>' +
    '    <button class="btn" id="wrongStart"' + (wrongN ? '' : ' disabled') + '>刷错题</button>' +
    '  </div>' +
    '  <div class="hint">提示：答题时可用键盘 A / B / C / D 选择，← → 切换题目。数据只保存在本机浏览器。</div>' +
    '</div>' +
    '<div class="card">' +
    '  <h2>历史成绩</h2>' +
    '  <div class="sub">最近 8 次（最多保留 30 次）</div>' +
    '  <table><thead><tr><th>时间</th><th>类型</th><th class="num">答对</th><th class="num">正确率</th><th class="num">用时</th></tr></thead>' +
    '  <tbody>' + histHtml + '</tbody></table>' +
    (hist.length ? '  <div class="row" style="margin-top:12px"><button class="btn sm danger" id="clearHist">清空历史成绩</button></div>' : '') +
    '</div>';
}

function viewQuiz() {
  const item = S.queue[S.cur];
  const q = QUESTIONS[item.qi];
  const judged = S.judge[S.cur];
  const picked = S.picks[S.cur];
  const rightN = S.judge.filter((j, i) => j && S.picks[i] === S.queue[i].ans).length;
  const wrongN = S.judge.filter((j, i) => j && S.picks[i] !== S.queue[i].ans).length;

  const optsHtml = item.ord.map((origIdx, disp) => {
    let cls = 'opt';
    if (judged) {
      cls += ' locked';
      if (disp === item.ans) cls += ' right';
      else if (disp === picked) cls += ' wrong';
    } else if (disp === picked) cls += ' picked';
    return '<button class="' + cls + '" data-pick="' + disp + '">' +
      '<span class="key">' + KEYS[disp] + '</span><span>' + esc(q.o[origIdx]) + '</span></button>';
  }).join('');

  let explain = '';
  if (judged) {
    const ok = picked === item.ans;
    explain = '<div class="explain"><div class="verdict ' + (ok ? 'ok' : 'bad') + '">' +
      (ok ? '✓ 答对了' : '✗ 答错了，正确答案是 ' + KEYS[item.ans]) + '</div>' +
      '<b>解析：</b>' + esc(q.e) + '</div>';
  }

  const sheetHtml = S.queue.map((it, i) => {
    let cls = '';
    if (S.judge[i]) cls = S.picks[i] === it.ans ? 'right' : 'wrong';
    if (i === S.cur) cls += ' cur';
    return '<button class="' + cls + '" data-jump="' + i + '">' + (i + 1) + '</button>';
  }).join('');

  return '' +
    '<div class="card">' +
    '  <div class="qmeta">' +
    '    <span class="tag unit">' + esc(unitName(q.u)) + '</span>' +
    '    <span class="tag src">' + esc(q.s) + '</span>' +
    (S.wrongOnly ? '<span class="tag wrong">错题重刷</span>' : '') +
    '    <span class="spacer" style="flex:1"></span>' +
    '    <span class="tag">第 ' + (S.cur + 1) + ' / ' + S.queue.length + ' 题</span>' +
    '  </div>' +
    '  <div class="qtext">' + esc(q.q) + '</div>' +
    '  <div class="opts">' + optsHtml + '</div>' +
    explain +
    '  <div class="bar"><i id="progFill"></i></div>' +
    '  <div class="stats"><span>已答 <b>' + (rightN + wrongN) + '</b></span><span>答对 <b style="color:var(--ok)">' + rightN + '</b></span>' +
    '  <span>答错 <b style="color:var(--bad)">' + wrongN + '</b></span></div>' +
    '  <div class="row" style="margin-top:14px">' +
    '    <button class="btn" id="prev"' + (S.cur === 0 ? ' disabled' : '') + '>← 上一题</button>' +
    '    <button class="btn primary" id="next" style="flex:1">' + (S.cur === S.queue.length - 1 ? '完成并看成绩' : '下一题 →') + '</button>' +
    '    <button class="btn ghost" id="quit">退出</button>' +
    '  </div>' +
    '</div>' +
    '<div class="card" id="sheetCard">' +
    '  <h2>答题卡</h2><div class="sub">绿色=答对，红色=答错，点击题号可跳转</div>' +
    '  <div class="sheet">' + sheetHtml + '</div>' +
    '</div>';
}

function viewResult() {
  const r = S.lastResult;
  if (!r) return '<div class="card empty">暂无成绩</div>';
  const rate = Math.round(r.right / r.total * 100);
  const desc = rate >= 90 ? '非常好，考点掌握扎实！' : rate >= 75 ? '不错，个别考点再巩固一下' : rate >= 60 ? '基本过关，错题要重刷' : '基础还不牢，建议回课本对应单元再读一遍';
  const unitRows = Object.keys(r.perUnit).sort((a, b) => a - b).map((u) => {
    const d = r.perUnit[u];
    const p = Math.round(d.right / d.total * 100);
    return '<tr><td>' + esc(unitName(Number(u))) + '</td>' +
      '<td class="num">' + d.right + ' / ' + d.total + '</td>' +
      '<td class="num">' + p + '%</td>' +
      '<td><div class="mini-bar"><i style="width:' + p + '%;background:' + (p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)') + '"></i></div></td></tr>';
  }).join('');

  // 本轮错题
  const wrongList = S.queue.map((it, i) => ({ it, i })).filter((x) => S.judge[x.i] && S.picks[x.i] !== x.it.ans);
  const wrongHtml = wrongList.length ? wrongList.map((x) => {
    const q = QUESTIONS[x.it.qi];
    return '<div class="wrong-item"><div class="q">' + esc(q.q) + '</div>' +
      '<div class="a">你选了 <span class="bad">' + KEYS[S.picks[x.i]] + '. ' + esc(q.o[x.it.ord[S.picks[x.i]]]) + '</span>；' +
      '正确答案 <span class="ok">' + KEYS[x.it.ans] + '. ' + esc(q.o[q.a]) + '</span></div>' +
      '<div class="a" style="margin-top:4px">解析：' + esc(q.e) + '</div></div>';
  }).join('') : '<div class="empty">全对，太强了！</div>';

  return '' +
    '<div class="card"><div class="score">' +
    '  <div class="big">' + r.right + '<small> / ' + r.total + '</small></div>' +
    '  <div class="desc">正确率 ' + rate + '% · 用时 ' + fmtTime(r.secs) + ' · ' + desc + '</div>' +
    '</div>' +
    '  <div class="row" style="justify-content:center">' +
    '    <button class="btn primary" id="again">再刷一轮</button>' +
    '    <button class="btn" id="wrongStart2">刷错题</button>' +
    '    <button class="btn ghost" id="backSetup">返回设置</button>' +
    '  </div>' +
    '</div>' +
    '<div class="card"><h2>各单元掌握情况</h2><div class="sub">按本轮所抽题目统计</div>' +
    '  <table><thead><tr><th>单元</th><th class="num">答对</th><th class="num">正确率</th><th>掌握度</th></tr></thead><tbody>' + unitRows + '</tbody></table>' +
    '</div>' +
    '<div class="card"><h2>本轮错题（' + wrongList.length + '）</h2><div class="sub">已自动加入错题本，可随时重刷</div>' + wrongHtml + '</div>';
}

function viewWrong() {
  const wrong = getWrong();
  const keys = Object.keys(wrong).sort((a, b) => wrong[b].ts - wrong[a].ts);
  const listHtml = keys.length ? keys.map((k) => {
    const w = wrong[k];
    return '<div class="wrong-item">' +
      '<div class="qmeta"><span class="tag unit">' + esc(unitName(w.u)) + '</span>' +
      '<span class="tag src">' + esc(w.s) + '</span>' +
      (w.cnt > 1 ? '<span class="tag wrong">错过 ' + w.cnt + ' 次</span>' : '') + '</div>' +
      '<div class="q">' + esc(w.q) + '</div>' +
      '<div class="a">正确答案：<span class="ok">' + KEYS[w.a] + '. ' + esc(w.o[w.a]) + '</span></div>' +
      '<div class="a" style="margin-top:4px">解析：' + esc(w.e) + '</div>' +
      '</div>';
  }).join('') : '<div class="empty">错题本是空的，说明你还没答错过题 👏</div>';

  return '' +
    '<div class="card">' +
    '  <div class="qmeta"><h2 style="margin:0">错题本（' + keys.length + ' 题）</h2></div>' +
    '  <div class="sub">答错自动收录；重刷答对后自动移出。也可手动管理。</div>' +
    '  <div class="row">' +
    '    <button class="btn primary" id="wrongStart3"' + (keys.length ? '' : ' disabled') + '>开始刷错题</button>' +
    '    <button class="btn danger" id="clearWrong"' + (keys.length ? '' : ' disabled') + '>清空错题本</button>' +
    '    <button class="btn ghost" id="backSetup2">返回</button>' +
    '  </div>' +
    '</div>' +
    '<div class="card">' + listHtml + '</div>';
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-u],[data-size],[data-order],[data-opt],[data-pick],[data-jump]');
  if (!t) return;
  if (t.dataset.u) {
    const u = Number(t.dataset.u);
    const i = S.units.indexOf(u);
    if (i >= 0) S.units.splice(i, 1); else S.units.push(u);
    S.units.sort((a, b) => a - b);
    render(); return;
  }
  if (t.dataset.size) { S.size = t.dataset.size === 'all' ? 'all' : Number(t.dataset.size); render(); return; }
  if (t.dataset.order) { S.random = t.dataset.order === 'random'; render(); return; }
  if (t.dataset.opt) { S.shuffleOpts = t.dataset.opt === 'shuffle'; render(); return; }
  if (t.dataset.pick !== undefined && t.dataset.pick !== '') { pick(Number(t.dataset.pick)); return; }
  if (t.dataset.jump !== undefined && t.dataset.jump !== '') { jump(Number(t.dataset.jump)); return; }
});

document.addEventListener('click', (e) => {
  const id = e.target.id;
  if (!id) return;
  const map = {
    allUnits: () => { S.units = [1, 2, 3, 4, 5, 6, 7]; render(); },
    noneUnits: () => { S.units = []; render(); },
    only567: () => { S.units = [5, 6, 7]; render(); },
    start: startQuiz,
    wrongStart: startWrongOnly,
    wrongStart2: startWrongOnly,
    wrongStart3: startWrongOnly,
    wrongBook: () => { S.view = 'wrong'; render(); },
    backSetup: () => { S.view = 'setup'; render(); },
    backSetup2: () => { S.view = 'setup'; render(); },
    again: startQuiz,
    prev: () => go(-1),
    next: () => { if (S.cur === S.queue.length - 1) finish(); else go(1); },
    quit: () => { if (confirm('退出本轮？已答题目会保留在错题本中。')) { S.view = 'setup'; render(); } },
    clearHist: () => { if (confirm('清空历史成绩记录？')) { writeJSON(LS_HIST, []); render(); } },
    clearWrong: () => { if (confirm('清空错题本？此操作不可恢复。')) { setWrong({}); render(); } }
  };
  if (map[id]) map[id]();
});

document.addEventListener('keydown', (e) => {
  if (S.view !== 'quiz') {
    if (e.key === 'Enter' && S.view === 'setup') startQuiz();
    return;
  }
  const k = e.key.toUpperCase();
  if (KEYS.indexOf(k) >= 0) { pick(KEYS.indexOf(k)); return; }
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight' || e.key === 'Enter') {
    if (S.cur === S.queue.length - 1 && S.judge[S.cur]) finish(); else go(1);
  }
});

/* ---------------- 启动 ---------------- */
render();

</script>
</body>
</html>
